# Pytest configuration for the cross-stack test tiers only.
#
# The backend's own pyramid (unit / component / integration) is configured by
# backend/pyproject.toml and is run from inside backend/. This file exists for
# the tiers that live here — currently the pytest half of performance/, which
# drives the application the way a load generator would rather than the way a
# unit test does.
#
# Kept in tests/ rather than the repository root so the root carries no tooling
# files. pytest still finds it: it searches the arguments' ancestor directories,
# and performance/ sits under this one. Every path below therefore resolves
# against THIS directory — hence `../backend`.
#
# `pythonpath` is what lets these tests `import src.*` from outside backend/.
[pytest]
asyncio_mode = auto
pythonpath = ../backend
testpaths = performance
markers =
    performance: resource-exhaustion and concurrency probes — slow, run on demand
addopts =
    --strict-markers
    --durations=10

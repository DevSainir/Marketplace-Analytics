# ---------------------------------------------------------------------------
# The road from Alertmanager to Telegram.
#
# WHY THIS EXISTS. This box cannot reach Telegram reliably, and it is Telegram
# specifically. Measured on 2026-10-15 from the host, a fresh TLS connection to
# api.telegram.org answered 50 times in 77 over IPv4 (149.154.167.220) and 70
# in 77 over IPv6, both failing at the same moment once in 41 rounds — while
# GitHub, Cloudflare and Yandex answered 41 of 41. The other IPv4 address DNS
# gives, 149.154.166.110, answered 0 of 77 and has not since 2026-09-12: two
# weeks of alerts went nowhere on it before anybody noticed. The failures are
# at the TCP connect (the SYN is dropped; time_connect is 0) and they are per
# connection.
#
# So the cure is not a better address, it is MORE ATTEMPTS, FAST, ON BOTH
# ROADS. Alertmanager on its own makes one connection, waits out a long dial
# timeout, and only retries after a backoff; and from its container it has no
# IPv6 at all, because Docker's networks here are IPv4-only and enabling IPv6
# on one would turn on forwarding and cost the host its RA-learnt IPv6 route.
# This relay runs in the HOST's network, so it has both families, and it turns
# one slow attempt into up to seven two-second ones alternating between them.
# At the measured rates, seven connects in a row failing is roughly one in
# ten thousand. Tried on the box before it went in: 12 requests of 12 through
# it answered, three of them on a retry it made by itself.
#
# WHAT IT IS NOT. A TCP pipe, not a proxy: TLS runs end to end between
# Alertmanager and Telegram, so the relay never sees the bot token, and a
# compromise of it learns nothing that a packet capture would not. It forwards
# to Telegram's two addresses and nowhere else.
#
# HOW ALERTMANAGER FINDS IT. `api.telegram.org` is pinned to `host-gateway`
# (docker0, 172.17.0.1) in Alertmanager's `extra_hosts`, and its `api_url`
# carries this port — so the certificate Alertmanager checks is still
# Telegram's own. Port 443 is not available here: the edge's docker-proxy holds
# 0.0.0.0:443, and 8443 is the e2e stack's. Telegram accepts the port in the
# Host header (checked 2026-10-15: 401 on a bogus token, both families).
#
# WHY docker0 AND NOT :7443. The host's INPUT chain accepts everything (no
# ufw), so a wildcard bind would publish this to the internet. 172.17.0.1 is
# reachable from the containers and not from outside; the `src` check below is
# the second lock.
# ---------------------------------------------------------------------------

global
    log stdout format raw local0 info
    maxconn 64

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    # THE SETTING THIS FILE EXISTS FOR. A dropped SYN is retransmitted by the
    # kernel after 1 s and 3 s on the SAME flow, which the network drops again
    # (curl's 8 s attempts failed whole); a NEW connection is a new roll. Two
    # seconds lets one retransmit through — one connect on 2026-10-15 took
    # 1.07 s — and gives up on the rest.
    timeout connect 2s
    timeout client 60s
    timeout server 60s
    # Retried only on a failed connect (HAProxy's default `retry-on
    # conn-failure`), which is safe: nothing has been sent yet. Redispatch on
    # every retry, so the attempts alternate between the two roads.
    retries 6
    option redispatch 1

frontend from_alertmanager
    bind 172.17.0.1:7443
    tcp-request connection reject unless { src 172.16.0.0/12 }
    default_backend telegram

backend telegram
    balance roundrobin
    # The health check is what Prometheus reads (`haproxy_backend_active_servers`)
    # and what `Watchdog` requires to be non-zero — the road is checked every
    # ten seconds whether or not an alert is waiting, rather than discovered
    # broken by the first alert that fails. `fall 5`: at one-in-three per
    # connect, three misses in a row happen several times an hour and mean
    # nothing; five in a row is under a third of one percent.
    default-server check inter 10s fall 5 rise 1
    server ipv6 [2001:67c:4e8:f004::9]:443
    server ipv4 149.154.167.220:443
    # 149.154.166.110 is deliberately absent: dead since 2026-09-12, it would
    # sit DOWN forever and keep `TelegramRoadDown` firing about nothing.

frontend metrics
    mode http
    bind 172.17.0.1:7405
    tcp-request connection reject unless { src 172.16.0.0/12 }
    http-request use-service prometheus-exporter if { path /metrics }
    http-request return status 404

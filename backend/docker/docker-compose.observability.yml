# ---------------------------------------------------------------------------
# The observability stack: Prometheus + Grafana + Loki + Alloy.
#
# A SEPARATE OVERLAY, not part of the base topology, and that is a deliberate
# operational choice rather than a filing decision. The base stack is what
# serves customers; this one watches it. Keeping them separable means the
# monitoring can be restarted, upgraded or stopped entirely without touching
# the API, and — the case that matters — that a box under memory pressure has
# something to turn off that is not the product.
#
#   make obs-up      # start it            make obs-down   # stop it
#   make obs-logs    # follow its logs
#
# The application is instrumented whether or not this file is ever run:
# /metrics and /healthz exist in the API image, and the counters cost a few
# hundred floats. Nothing here is required for the service to work.
#
# ---------------------------------------------------------------------------
# THE MEMORY ARITHMETIC, because this box does not have room to be casual.
#
# The VPS is 2 vCPU / 3.8 GB with no swap, and it hosts more than this stack.
# The base topology already commits ~2.4 GB of ceilings (worker 768m, api and
# api_standby 512m each, postgres 384m, beat 192m, redis 96m, frontend and
# frontend_standby 64m each, edge 64m).
# This overlay adds 832m:
#
#   prometheus 320m · grafana 224m · loki 192m · alloy 96m
#
# That is ~3.2 GB of CEILING against 3.8 GB of RAM. Ceilings are not
# reservations — nothing is set aside, and measured steady state for these
# four is roughly 250-350 MB together — so the over-subscription is intended,
# exactly as it already is for the base stack. But the headroom is genuinely
# thinner than it was, and the honest reading is: this fits, and it is the
# last thing that fits. Two consequences are load-bearing rather than
# advisory:
#
#   * Prometheus retention is bounded by SIZE as well as time (see its
#     command). A time-only retention lets the disk fill at whatever rate the
#     series count grows to, and this box's disk is shared with Postgres.
#   * Loki's ingestion limits (loki-config.yaml) are set low. A retry loop
#     logging in a tight cycle is the realistic way a log store fills a disk,
#     and taking Postgres down to keep every line of a runaway would be a poor
#     trade.
#
# If this box gains co-tenants or the customer list grows, the first thing to
# move off it is Grafana — it is the only one of the four that is idle unless
# somebody is looking at it, and pointing a hosted Grafana at this Prometheus
# and Loki costs nothing here.
#
# ---------------------------------------------------------------------------
# EXPOSURE. Not one of these publishes a port to the internet DIRECTLY, and
# exactly one of them is reachable from it.
#
# Grafana is served on its own host, `https://grafana.example.com`, by the
# application's nginx over this shared network — a subdomain rather than a path
# under the app, so a flaw in Grafana cannot sit in the same browser origin as
# the session that authenticates real sellers (frontend/docker/nginx.conf holds
# the reasoning and the login rate limit).
#
# This block used to say the SSH tunnel was "the whole access model". It is not,
# and has not been since Grafana was given its own host; the tunnel survives as
# the way in when nginx itself is the broken thing:
#
#     ssh -L 3001:127.0.0.1:3000 <host>
#
# The published port stays bound to `127.0.0.1:` for that reason and no other —
# it is the bypass around TLS, the security headers and the login throttle, so
# it must never be allowed to listen on a routable address. The port-443 rule
# the base topology is built on still holds: 443 is the only port the internet
# can reach, and everything public arrives through the edge and the nginx
# behind it.
#
# Prometheus, Loki and Alloy publish nothing at all; they talk over the
# project's internal Docker network. Prometheus reaches `api:8000/metrics` and
# `worker:9100/metrics` there, which is why the exposition route needs no
# token by default (see src/core/observability/instrument.py for the second
# lock, and why it exists anyway).
# ---------------------------------------------------------------------------

# A SEPARATE COMPOSE PROJECT, sharing the application's network.
#
# It was in the application's project at first, and that was wrong in a way
# that only production could show: the deploy runs
# `docker compose -f docker-compose.yml up -d --remove-orphans`, and a service
# that belongs to the project but is absent from the file compose was handed is
# by definition an orphan. So every deploy silently deleted the entire
# monitoring stack — quietly, with the volumes left behind, which is precisely
# the failure mode monitoring exists to catch and the one it cannot catch about
# itself. Two deploys on 2026-09-05 removed it before anybody looked.
#
# Its own project name puts it out of reach: `--remove-orphans` on the app's
# project cannot see services that are not in it. That also makes the separate
# lifecycle real rather than merely intended — the monitoring is now genuinely
# startable, upgradable and stoppable without the deploy having an opinion.
#
# The network is joined as EXTERNAL, which is what keeps `api:8000` and
# `loki:3100` resolvable across the two projects: Compose gives every container
# a network alias equal to its service name, and Docker's embedded DNS resolves
# those for anything attached to the same network, project boundaries included.
# If the application stack is not up, this file fails to start with a clear
# "network not found" — which is the right answer, because there would be
# nothing to watch.
name: marketplace-observability

networks:
  default:
    name: marketplace-service_default
    external: true

# The same rotation policy the base stack applies to every service, for the same
# reason: a container's stdout is written by the Docker daemon, so nothing
# inside the container can bound it, and a full partition takes Postgres with
# it. Declared again here because a compose OVERLAY cannot see the base file's
# anchors — YAML anchors are per-document, and silently resolving to nothing is
# how this would have shipped with four unbounded logs.
x-obs-logging: &obs_logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    logging: *obs_logging
    mem_limit: 320m
    cpus: 0.5
    user: "65534:65534"  # nobody. It only ever writes its own volume.
    # The Telegram relay is in the host's network, not this one; docker0 is
    # where its metrics listener is bound.
    extra_hosts:
      - "telegram-relay:host-gateway"
    volumes:
      - ./docker/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # TWO retention bounds, and the size one is the one that matters. Time
      # alone bounds how far back you can look; it does not bound the disk,
      # because the disk is a function of retention MULTIPLIED by series
      # count — and series count grows when somebody adds a label. 2 GB is the
      # ceiling this box can give up without threatening Postgres's own.
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
      # No admin API: it can delete series and drop the TSDB, and nothing in
      # this deployment needs it.
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The last hop: turns a firing rule into a message a person sees.
  #
  # Without it the rules evaluate and are visible in Prometheus and Grafana, and
  # page nobody — which is a monitoring system that only works when somebody is
  # already looking, i.e. exactly when it is least needed.
  alertmanager:
    image: prom/alertmanager:v0.28.0
    restart: unless-stopped
    logging: *obs_logging
    # The smallest service here by a wide margin: it holds a few alert groups
    # and a notification schedule, and does nothing at all between alerts.
    mem_limit: 64m
    cpus: 0.25
    user: "65534:65534"
    # Telegram goes through the relay below, not straight out. The name is
    # pinned to the host (docker0), where `telegram-relay` listens, and the
    # rendered config's `api_url` carries the relay's port; TLS still runs end
    # to end and is verified against api.telegram.org. Straight out, this
    # container has IPv4 only and one address that answers two connects in
    # three — and before 2026-09-30 an address that had answered nothing for
    # two weeks. docker/telegram-relay/haproxy.cfg has the measurements.
    extra_hosts:
      - "api.telegram.org:host-gateway"
    depends_on:
      - telegram-relay
    volumes:
      # The RENDERED config, not the template — it carries the Telegram bot
      # token and is gitignored. `make obs-up` renders it first; starting this
      # service by hand without doing so leaves the file absent and the
      # container in a restart loop, which is the loud failure rather than the
      # quiet one (an empty config would start fine and alert nobody).
      - ./docker/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The road to Telegram: a TCP relay in the HOST's network, so it has the
  # host's IPv6 as well as IPv4, retrying a dropped connect within two seconds
  # on the other family. Why, and the numbers behind it, are in its config.
  # Owner's decision on 2026-10-15, over an IPv4-only relay inside
  # Alertmanager's own namespace that would open nothing on the host: that one
  # goes silent the day Telegram's one working IPv4 address goes the way of
  # 149.154.166.110, and this one does not.
  telegram-relay:
    # The edge's image and digest: one HAProxy to keep patched, already scanned
    # by base-image-freshness.yml.
    image: haproxy:3.2.25-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    restart: unless-stopped
    logging: *obs_logging
    # Host networking is the point (IPv6), and the reason the listeners bind
    # docker0's address rather than a wildcard — see the config's header.
    network_mode: host
    mem_limit: 32m
    cpus: 0.1
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      # The DIRECTORY, for the edge's reason: a single-file mount keeps the old
      # inode after `git pull`, so a reload would load the previous config.
      - ./docker/telegram-relay:/usr/local/etc/haproxy:ro

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    logging: *obs_logging
    mem_limit: 224m
    cpus: 0.5
    ports:
      # LOOPBACK ONLY, and it stays that way even though Grafana is now
      # reachable on a public host. The public path goes through the app's
      # nginx over the internal network, which is where TLS, the security
      # headers and the login rate limit live; this published port is the
      # bypass around all three, so it must never leave `127.0.0.1:`.
      #
      # Kept rather than removed because it is the way in when nginx itself is
      # the broken thing: `ssh -L 3001:127.0.0.1:3000 <host>`.
      - "127.0.0.1:3000:3000"
    environment:
      # Reachable on its own public host, proxied by the app's nginx over this
      # shared network (frontend/docker/nginx.conf). Grafana needs to KNOW its
      # public URL: it builds absolute links — password-reset, OAuth callbacks,
      # panel share links, and the Live WebSocket endpoint — and without this it
      # would emit `http://localhost:3000` ones that go nowhere from a browser.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.example.com}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-grafana.example.com}
      # Session cookies, now that they travel over the internet rather than
      # down an SSH tunnel. `lax` rather than `strict`: strict drops the cookie
      # on any cross-site navigation, so following a dashboard link from
      # somewhere else lands you on a login form every time.
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      # Grafana emits its OWN Content-Security-Policy, maintained against its
      # own bundle. nginx deliberately does not apply the app's policy here —
      # see snippets/grafana-headers.conf for why that would be worse than it
      # sounds.
      GF_SECURITY_CONTENT_SECURITY_POLICY: "true"
      GF_SECURITY_STRICT_TRANSPORT_SECURITY: "true"
      # No embedding, which also makes Grafana send its own X-Frame-Options —
      # the reason nginx does not add a second, conflicting one.
      GF_SECURITY_ALLOW_EMBEDDING: "false"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in backend/.env}
      # Nobody signs up for a Grafana reachable only through an SSH tunnel,
      # and an open sign-up form on it would be the one way in that the tunnel
      # does not gate.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # No call home, and no "check for updates" from a box that should make
      # no outbound connections it was not asked for.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    logging: *obs_logging
    mem_limit: 192m
    cpus: 0.5
    user: "10001:10001"
    volumes:
      - ./docker/observability/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    command: ["-config.file=/etc/loki/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 5s
      # Generous: Loki answers /ready only once its ingester has joined the
      # ring, which takes longer than the process takes to start.
      retries: 10
      start_period: 60s

  alloy:
    image: grafana/alloy:v1.6.1
    restart: unless-stopped
    logging: *obs_logging
    mem_limit: 96m
    cpus: 0.25
    # Root, and it is worth being explicit about why: reading other
    # containers' logs means reading /var/lib/docker/containers, which is
    # root-owned. Both mounts below are READ-ONLY, including the socket —
    # a writable Docker socket is root on the host, and this agent needs only
    # to list containers and read their output.
    user: root
    volumes:
      - ./docker/observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - alloy_data:/var/lib/alloy
    command:
      - run
      - --storage.path=/var/lib/alloy
      # No UI. It would be a second unauthenticated surface on this network
      # for a config file that is already in git.
      - --server.http.listen-addr=127.0.0.1:12345
      - /etc/alloy/config.alloy
    depends_on:
      loki:
        condition: service_healthy

volumes:
  alertmanager_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:

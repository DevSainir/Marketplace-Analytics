# The edge: the only thing on this box that holds :80 and :443.
#
# WHY IT EXISTS. Until 2026-10 nginx held those ports itself, and there was one
# of it, so replacing nginx — a new image, a changed compose entry, a crash —
# took the whole site down until the new one was up (15 s on 2026-10-08). Now
# two identical nginx (`frontend`, `frontend_standby`) sit behind this, and the
# deploy replaces them one at a time, taking each out of rotation here first.
# This process is the new
# single point, but it is one that almost never has to change: the config below
# is the whole of it, and a change to it is a seamless reload, not a restart.
#
# TCP, not HTTP. TLS is still terminated by nginx, so certificates, certbot and
# every header rule stay where they were; this only moves bytes.
#
# THE CLIENT'S ADDRESS. A TCP proxy is the peer nginx sees, so without help
# every request would come from this container's address — and the login
# limiter, which keys on the address nginx writes into X-Real-IP, would put
# every user in one budget. `send-proxy-v2`
# prepends the real one in a PROXY protocol header, and nginx takes
# $remote_addr from it (`real_ip_header proxy_protocol` in nginx.conf). Both
# ends must agree, or every connection is garbage to nginx:
# backend/tests/unit/core/test_edge_ingress.py holds them together.

global
    log stdout format raw local0 info
    # The process runs as uid 99 with every capability dropped, which is why it
    # listens on 8080/8443 inside the container; compose maps 80/443 onto them.
    #
    # Memory scales with this, at roughly 32 KB per connection in TCP mode
    # (two buffers), so 1000 is ~35 MB against the container's 64m. Traffic is
    # a few dozen people; a connection that waits here waits in the kernel's
    # backlog rather than being refused.
    maxconn 1000
    # THE RUNTIME API. `level admin` can drain every server, so it is bound to
    # this container's own loopback and nothing else: nothing on the Docker
    # network, let alone the internet, can reach it. The deploy talks to it
    # with `docker compose exec edge` and busybox nc.
    stats socket ipv4@127.0.0.1:9999 level admin
    # A reload hands the listening sockets to a new worker; the old one keeps
    # the connections it holds until they end. This bounds how long that is,
    # so old workers do not pile up across deploys holding idle keep-alives.
    hard-stop-after 10m

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 3s
    # Idle bounds for a connection in either direction. nginx closes an idle
    # keep-alive at 75 s on its own, so in practice it ends them first; this is
    # the backstop, sized for Grafana's live websocket.
    timeout client 10m
    timeout server 10m
    # Checked every 2 s, out after two misses, back after two passes: an nginx
    # that dies on its own is out of rotation within ~4 s. A planned
    # replacement does not wait for this — the deploy drains it first.
    #
    # `init-addr last,libc,none` lets the edge start while an nginx does not
    # exist yet (the first deploy, a host boot), and `resolvers docker` follows
    # a recreated nginx to its new address instead of the one it had.
    default-server inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none

# Docker's embedded DNS.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 5s

frontend http
    bind :8080
    default_backend nginx_http

frontend https
    bind :8443
    default_backend nginx_https

# ONE PRIMARY, ONE BACKUP — not round-robin. Each nginx keeps its own
# `limit_req` counters, so spreading one client across both would double every
# rate limit. The standby takes all the traffic whenever the primary is out —
# on every rotation, so it is exercised and not only trusted.
#
# THE HEALTH CHECK is plain HTTP on 8081, the one nginx listener that does not
# expect a PROXY header (a check does not send one). Docker's HEALTHCHECK in
# frontend/docker/Dockerfile probes the same port for the same reason.
backend nginx_https
    option httpchk
    http-check send meth GET uri /healthz
    http-check expect status 200
    server frontend frontend:443 send-proxy-v2 check port 8081
    server frontend_standby frontend_standby:443 send-proxy-v2 check port 8081 backup

# Port 80 serves only the redirect to https and the ACME challenge. Its servers
# TRACK the https ones rather than checking on their own, so draining an nginx
# in `nginx_https` drains it here too: the deploy names one backend, not two.
backend nginx_http
    server frontend frontend:80 send-proxy-v2 track nginx_https/frontend
    server frontend_standby frontend_standby:80 send-proxy-v2 track nginx_https/frontend_standby backup

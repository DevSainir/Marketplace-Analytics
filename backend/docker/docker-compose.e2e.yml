# ---------------------------------------------------------------------------
# Overlay for throwaway end-to-end stacks (CI, and local runs without a cert).
#
#   docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
#
# WHAT IT CHANGES, AND WHY. Exactly one thing: nginx serves plain HTTP on any
# Host (../frontend/docker/nginx.ci.conf) instead of terminating TLS for
# example.com. The production config hard-requires the Let's Encrypt key
# pair, which exists only on the VPS; without it nginx does not fall back to
# HTTP, it refuses to load its configuration at all — `nginx -t` reports
# "cannot load certificate ... no such file" — so the container restart-loops
# and every request fails in a way that reads as a broken application.
#
# Everything else is the real topology: the same images, the same migrate job,
# the same /api/ reverse proxy, the same security headers. The browser tier is
# only worth running against something honest.
#
# The base file's `443:443` publish and its read-only /etc/letsencrypt mount are
# left in place deliberately rather than removed. Compose MERGES `ports` and
# `volumes` from an overlay instead of replacing them, and the `!override` tag
# that would replace them needs Compose >= 2.24 — a floor not worth imposing on
# contributors. Both leftovers are inert here: nothing listens on 443, and the
# mounted directory is never read.
#
# Note this is NOT docker-compose.override.yml. Overrides apply automatically,
# and a production stack that silently downgraded itself to plain HTTP would be
# a security incident. This overlay has to be named on the command line.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# ISOLATION, added 2026-09-09 when the browser tier moved onto the production
# VPS's own runner. Read this before running the stack anywhere that matters.
#
# The base file declares `name: marketplace-service`, so `docker compose -f
# docker-compose.yml -f docker-compose.e2e.yml up --build` targets THE
# PRODUCTION PROJECT. On the VPS that recreates the live containers with the
# plain-HTTP nginx config below, pointed at a throwaway database — an outage
# dressed as a test run. The command must therefore always carry an explicit
# `-p marketplace-e2e`, and tests.yml asserts that it does.
#
# A distinct project is necessary but NOT sufficient. Image tags are global to
# the daemon, so a build that kept the base file's `marketplace-service-api:
# latest` would overwrite the image production restarts from, whatever project
# built it. Hence the `:e2e` tags below — scalars, which an overlay REPLACES
# (unlike `ports` and `volumes`, which it merges).
#
# The caps are the third leg. Compose limits are enforced by the kernel on the
# container, so unlike the runner's own systemd limits they also bound a
# `docker build`'s children and anything the stack spawns. Sized to leave the
# live stack its working set on a 4 GB box.
#
# The budget is stated here in full because getting it wrong took the service
# down on 2026-09-19, and the comment this replaces was itself part of how:
# it claimed "~1 GB" while `postgres` and `redis` inherited the base file's
# 384m and 96m uncapped by this overlay, making the real topology 1536m. The
# box has 3915 MB and NO SWAP, against 3424 MB of limits for the live stack
# and the observability overlay together — so the true figure oversubscribed
# the machine by a gigabyte, and memory pressure has nowhere to go but the
# OOM killer. Every service is therefore listed below, including the two that
# need no image change, so that the total is readable in one place:
#
#   frontend 64 + api 320 + api_standby 256 + worker 320 + beat 192
#   + postgres 256 + redis 64  =  1472m
#
# `restart` is the other half of that lesson. The base file says
# `unless-stopped`, which is right for a stack that is meant to stay up and
# catastrophic for one that is not: when the runner died mid-run on
# 2026-09-19 the teardown step never ran, and Docker faithfully restarted this
# throwaway stack on every boot thereafter. Worse, `beat` was capped at 96m —
# below the ~148m it actually uses — so it was OOM-killed and restarted every
# 45 seconds, churning the box until nothing could be scheduled and sshd
# itself could no longer answer. A throwaway stack must die when it dies.
# ---------------------------------------------------------------------------

services:
  frontend:
    image: marketplace-service-frontend:e2e
    restart: "no"
    # The self-contained variant: it carries its own release (the built SPA,
    # the snippets and nginx.ci.conf) instead of reading one from the host.
    #
    # This replaces a bind mount of nginx.ci.conf over
    # /etc/nginx/conf.d/default.conf, which stopped being possible when that
    # directory became a symlink into a read-only release. Baking it into a
    # stage is better anyway: a throwaway stack now needs no host state at all,
    # and cannot reach the production release directory even by accident.
    build:
      target: e2e
    mem_limit: 64m
    cpus: 0.25

  # The four Python services share one image each in the base file; both tags
  # are redirected so neither production image can be rebuilt from here.
  api:
    image: marketplace-service-api:e2e
    restart: "no"
    mem_limit: 320m
    cpus: 0.4

  api_standby:
    image: marketplace-service-api:e2e
    restart: "no"
    mem_limit: 256m
    cpus: 0.25

  migrate:
    image: marketplace-service-api:e2e
    restart: "no"

  worker:
    image: marketplace-service-worker:e2e
    restart: "no"
    mem_limit: 320m
    cpus: 0.4

  beat:
    image: marketplace-service-worker:e2e
    restart: "no"
    # 96m until 2026-09-19, which is below what beat actually resident-sets
    # (~148m on the live stack). The kernel killed it every 45 seconds and
    # `restart: unless-stopped` brought it straight back; that loop is what
    # turned a tight box into an unreachable one.
    mem_limit: 192m
    cpus: 0.1

  # No image change needed for these two — they are here only so the overlay
  # caps them itself instead of silently inheriting production's sizing, and
  # so the budget above adds up on the page.
  postgres:
    restart: "no"
    mem_limit: 256m

  redis:
    restart: "no"
    mem_limit: 64m

# ---------------------------------------------------------------------------
# The rules that page somebody. Register P2.2 named real-time alerting on auth
# failures, 403 spikes and rate-limit trips as the open half of the logging
# work, and P2.1 said the fields to bind a rule to already existed. These are
# those rules.
#
# Every alert here obeys two conventions. `for:` is never zero — an alert that
# fires on one bad scrape fires on a deploy, and an alert that fires on a
# deploy is one people mute. And every annotation says what to DO, because the
# person reading it at 03:00 is not the person who wrote it.
# ---------------------------------------------------------------------------

groups:
  # -------------------------------------------------------------------------
  - name: availability
    rules:
      - alert: ApiDown
        expr: up{job="marketplace-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "API instance {{ $labels.instance }} is not answering scrapes."
          description: >-
            nginx fails a refused request over to the other instance, so ONE
            instance down is degraded rather than an outage — check whether the
            other is still up before treating this as customer-facing.
            `make logs` on the box, then look for a failed migrate step.

      - alert: BothApiInstancesDown
        expr: count(up{job="marketplace-api"} == 1) == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Neither API instance is answering. The site is down."
          description: >-
            The upstream pool has no live member; nginx is answering 502.
            docs/security/INCIDENT_RESPONSE.md is the runbook.

      - alert: DependencyDown
        expr: dependency_up == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.dependency }} is not answering its health probe."
          description: >-
            Without Postgres nothing serves. Without Redis the API still
            serves, with the auth rate limiter and session revocation failing
            OPEN (register P1.2) — which is a security posture change, not just
            degraded performance.

      - alert: WorkerExporterDown
        expr: up{job="marketplace-worker"} == 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "The Celery worker's metrics exporter is unreachable."
          description: >-
            The worker may still be processing. Confirm with celery_queue_length
            and the harvest counters before assuming the harvests have stopped;
            the exporter binds on worker_ready and is deliberately non-fatal.

  # -------------------------------------------------------------------------
  - name: security
    rules:
      # This one should never fire. That is the point of it.
      - alert: RowLevelSecurityViolation
        expr: increase(security_rls_violations_total{reason="tenant_unset"}[10m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "A query reached tenant data without a tenant bound."
          description: >-
            RLS refused it, so no data crossed a boundary — the control worked.
            What it means is that a code path is reaching tenant tables without
            going through get_current_workspace_id, which is the defect the
            policies were installed to catch (register P2.5). Find it in the
            logs by the ERROR from src.core.observability.rls_watch; the
            statement is on the line. `for: 0m` deliberately: one occurrence is
            the alert.

      - alert: SecurityControlDegraded
        expr: security_degraded_controls == 1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Security control {{ $labels.control }} is failing open."
          description: >-
            It is running its degraded fallback — Redis is unreachable
            (register P1.2). While this is true, password guessing is bounded
            only by whatever is still up. Two of these at once is the
            correlated failure that ledger exists to surface.

      - alert: AuthFailureSpike
        expr: sum(rate(security_auth_failures_total[5m])) > 2
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Sustained authentication failures ({{ $value | printf \"%.1f\" }}/s)."
          description: >-
            Credential stuffing looks like this. P1.5's per-account backoff and
            P0.1's per-IP limiter are both in the path, so this is usually a
            campaign being refused rather than one succeeding — check
            security_auth_failures_total by reason, and the client_ip field in
            the logs, before acting.

  # -------------------------------------------------------------------------
  - name: harvest
    rules:
      # The alert that would have caught the 2026-07-30 incident, in which
      # every harvest reported SUCCESS with funnel_rows: 0 for days.
      - alert: HarvestProducingNoRows
        expr: |
          sum by (harvest) (increase(harvest_rows_processed_total[6h])) == 0
          and on (harvest) (sum by (harvest) (increase(harvest_duration_seconds_count[6h])) > 0)
        for: 30m
        labels:
          severity: page
        annotations:
          summary: "Harvest {{ $labels.harvest }} is running and writing nothing."
          description: >-
            The second clause is what makes this meaningful: the harvest RAN
            and produced zero rows, which is a different event from "the
            harvest did not run". This is the shape of the Redis-pool incident
            — tasks succeeding, sources silently voided — and it is invisible
            in any task-level success metric.

      # The settlement walk gets its own rule, ahead of the general one and at
      # a threshold of ONE. A finance window that stops early is not a degraded
      # source that will heal on the next tick: WB serves this endpoint once per
      # ~917 s, so the week is left part-walked, and until 2026-09-08 the
      # harvest's watermark then advanced past the missing days off the report
      # header and nothing ever asked for them again. The general rule below
      # could not see it — three partials spread over three days never reach
      # `> 3` in an hour, and once the days were skipped the counter went quiet,
      # which reads exactly like recovery.
      - alert: SettlementWalkIncomplete
        expr: increase(harvest_partial_total{harvest="finreports.finance",source="finance"}[1h]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "A settlement week was left part-walked for at least one seller."
          description: >-
            The P&L is short those days until a later tick covers them. Check
            `settled_through` in finreports.settlement_watermark against the
            report headers: the walk should ask again from the watermark, and a
            watermark that has run past days with no rows is the 2026-09-07
            failure returning.

      - alert: HarvestPartial
        expr: increase(harvest_partial_total[1h]) > 3
        for: 0m
        labels:
          severity: warn
        annotations:
          summary: "Harvest {{ $labels.harvest }} keeps losing source {{ $labels.source }}."
          description: >-
            A partial harvest is tolerated by design so one dead WB surface
            does not lose the whole run. Repeated partials are not tolerable:
            the numbers for that source are quietly stale.

      - alert: CeleryQueueBackingUp
        expr: celery_queue_length{queue_name="celery"} > 50
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "The Celery queue is {{ $value }} messages deep."
          description: >-
            Four worker slots. Check whether a task is wedged — celery_queue_length
            {queue_name="unacked"} staying high with the queue draining means
            work is taken and not finishing.

      - alert: TaskFailureRate
        expr: |
          sum by (task_name) (rate(celery_tasks_total{state="failure"}[15m]))
          > 0.05
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Task {{ $labels.task_name }} is failing repeatedly."

  # -------------------------------------------------------------------------
      - alert: SettlementHistoryHasGaps
        expr: finreports_settlement_gap_days > 0
        for: 26h
        labels:
          severity: warn
        annotations:
          summary: "A settlement day is covered by no harvested report."
          description: >-
            Somebody's P&L is short a day. WB forms single-day supplementary
            reports and starts serving their rows days later, by which time the
            walk's window has moved past the days they cover — that is how
            2026-08-31 vanished from all five workspaces unnoticed. Nothing in
            the harvest counters can show this: the run succeeds and writes what
            it was asked for, so the only evidence is a hole in the report
            periods.
            The nightly reconciliation prioritises a workspace with a known gap,
            so a repairable one closes within a day — which is what the 26h
            `for:` is: long enough that this cannot fire on a gap merely waiting
            for tonight, short enough that a gap the repair cannot reach still
            surfaces. WHICH seller and WHICH days are in the worker log
            (`finreports: <name> has N settlement day(s) no report covers`); the
            metric is fleet-wide because /metrics may not name a tenant.
            If it does not clear after a night, the reconciliation is not
            reaching: check whether its window failed on WB rate budget, and
            backfill the day by hand against the affected token.

  - name: wildberries
    rules:
      # `wb_rate_limit_quota_remaining` is deliberately NOT the expression for
      # either rule below, and the reason is worth the paragraph, because the
      # gauge reads like the obvious choice and was the obvious choice until
      # 2026-09-07.
      #
      # That gauge is written only inside `RateGate.observe`, which runs only
      # when a WB response arrives, and nothing ever decays it. WB's bucket
      # refills on a timer; the gauge does not. So the last request of a burst
      # legitimately reports `remaining: 0` — the analytics bucket is three
      # deep, and reaching zero at the end of a burst is pacing WORKING — and
      # that zero then sits there for hours, until the next harvest happens to
      # touch the same endpoint.
      #
      # Measured on prod 2026-09-07: `/adv/v3/fullstats` held 0 for more than
      # 24 hours across 14 requests, every one of which returned 200, and
      # `/api/analytics/v1/stocks-report/wb-warehouses` held 0 for eight hours
      # while receiving four requests in total. Over that window WB returned no
      # 429, no 500, no stall and no `rate_blocked` anywhere. The old rule
      # (`== 0 for 10m`) fired continuously against a completely healthy
      # service.
      #
      # It also FLAPPED, which is the half that turned a false alert into a
      # pager. The gauge is `livemostrecent` across a prefork pool: when a
      # Celery child is recycled, `_mark_process_dead` removes its file and the
      # series stops existing, so the alert resolves; the next child observes
      # the endpoint and it fires again ten minutes later. A resolved/firing
      # pair every few minutes, each one re-sending the whole group, is what
      # that looks like from the receiving end.
      #
      # Both rules below are built on COUNTERS instead. A counter rate decays
      # to zero by itself, cannot be stale, and cannot flap when a series comes
      # and goes with a worker process — the three properties the gauge lacks.
      # The gauge keeps its Grafana panel, where a last-observation is exactly
      # what a human wants to look at.
      - alert: WbRateBudgetExhausted
        expr: |
          sum by (surface, endpoint) (
            rate(wb_api_requests_total{status="rate_blocked"}[15m])
          ) > 0
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "WB pacing is refusing to send {{ $labels.surface }} {{ $labels.endpoint }}."
          description: >-
            `rate_blocked` is OUR gate declining to send, because a token would
            have taken longer than the queue cap to appear. It is the one
            unambiguous statement that the configured bucket no longer matches
            WB's — every other symptom (a stall, a 500) is also what a bad
            token or a WB outage looks like. Compare
            `wb_analytics_bucket_capacity` / `_refill_seconds` against what
            `x-ratelimit-remaining` is actually reporting on the Grafana panel
            before changing anything.
            Rare and bursty on its own: 15m of rate held for 30m means blocking
            spread across half an hour, not one unlucky harvest. Over the seven
            days to 2026-09-07 production produced two `rate_blocked` responses
            in total, both on finance, which this would not have fired on.

      - alert: WbRatePacingPressure
        expr: |
          sum by (surface, endpoint) (
            rate(wb_rate_limit_wait_seconds_total[30m])
          ) > 2
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "WB {{ $labels.surface }} {{ $labels.endpoint }} is queueing {{ $value | printf \"%.1f\" }} caller-seconds per second."
          description: >-
            The leading indicator the quota gauge was supposed to be, in a form
            that cannot go stale. The value is caller-seconds of queueing
            accrued per wall-second, so 1.0 means exactly one caller parked in
            the queue continuously — which is what a healthy sustained harvest
            of a three-deep, ~20s-refill bucket looks like, NOT a fault.
            The threshold is 2 because that is roughly double every healthy peak
            measured over 24h on prod on 2026-09-07 (finance
            reportDetailByPeriod 1.02, sales-funnel/products 0.94, everything
            else under 0.12), and it means at least two callers permanently
            queued on ONE endpoint. Rising here precedes `rate_blocked` by
            enough to widen the window or lower the concurrency first.

      - alert: WbErrorRate
        expr: |
          sum(rate(wb_api_requests_total{status!~"2.."}[10m]))
          / clamp_min(sum(rate(wb_api_requests_total[10m])), 0.001) > 0.25
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Over a quarter of WB calls are failing."
          description: >-
            Includes transport_error and rate_blocked, which is deliberate —
            those are how WB actually fails here, and neither carries an HTTP
            status. Break down by surface and status before concluding it is
            WB rather than one rotated token.

  # -------------------------------------------------------------------------
  - name: saturation
    rules:
      - alert: PostgresPoolExhausted
        expr: postgres_pool_connections_free == 0 and postgres_pool_connections_used > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The connection pool has no free connections."
          description: >-
            This has happened: leaked `idle in transaction` connections held
            every slot for 22 hours, which is why
            idle_in_transaction_session_timeout exists in src/core/database.py.
            If used is pinned at the ceiling while traffic is normal, look for
            a leak rather than for load.

      - alert: ApiLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, handler) (rate(http_request_duration_seconds_bucket[10m]))
          ) > 3
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "p95 latency on {{ $labels.handler }} is above 3s."

      - alert: ServerErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[10m]))
          / clamp_min(sum(rate(http_requests_total[10m])), 0.001) > 0.02
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "More than 2% of responses are 5xx."

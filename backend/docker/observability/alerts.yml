# ---------------------------------------------------------------------------
# The rules that page somebody. Register P2.2 named real-time alerting on auth
# failures, 403 spikes and rate-limit trips as the open half of the logging
# work, and P2.1 said the fields to bind a rule to already existed. These are
# those rules.
#
# Every alert here obeys two conventions. `for:` is never zero — an alert that
# fires on one bad scrape fires on a deploy, and an alert that fires on a
# deploy is one people mute. And every annotation says what to DO, because the
# person reading it at 03:00 is not the person who wrote it.
# ---------------------------------------------------------------------------

groups:
  # -------------------------------------------------------------------------
  - name: availability
    rules:
      - alert: ApiDown
        expr: up{job="marketplace-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "Инстанс API {{ $labels.instance }} не отвечает."
          description: >-
            nginx перекинет отказанный запрос на второй инстанс. Поэтому
            один упавший инстанс — это ещё не авария. Сначала проверьте, жив
            ли второй. Дальше: `make logs` на сервере и поищите упавший шаг
            миграции.

      - alert: BothApiInstancesDown
        expr: count(up{job="marketplace-api"} == 1) == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Оба инстанса API не отвечают. Сайт лежит."
          description: >-
            В пуле nginx не осталось ни одного живого. Пользователи видят
            502. Что делать — в docs/security/INCIDENT_RESPONSE.md.

      - alert: DependencyDown
        expr: dependency_up == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.dependency }} не отвечает на проверку здоровья."
          description: >-
            Без Postgres не работает ничего. Без Redis API продолжает
            отвечать, но ограничитель попыток входа и отзыв сессий начинают
            пропускать всё подряд (реестр P1.2). Это не просто «стало
            медленнее» — это дыра в защите.

      - alert: PostgresCrashRecovered
        expr: max(changes(postgres_stats_reset_timestamp_seconds[30m])) > 0
        for: 1m
        labels:
          severity: warn
        annotations:
          summary: "Postgres аварийно перезапустил свои процессы."
          description: >-
            Postgres обнуляет статистику только при восстановлении после сбоя,
            поэтому это значение сдвинулось. Восстановление занимает секунды,
            но в этот момент рвутся все соединения. Скорее всего, ядро убило
            процесс Postgres по лимиту памяти контейнера. На сервере выполните
            `docker logs --since 1h marketplace-service-postgres-1 | grep
            "terminated by signal"`, затем `dmesg -T | grep oom-kill`. Отчёт
            ядра о нехватке памяти показывает, какой процесс занял память.

      - alert: WorkerExporterDown
        expr: up{job="marketplace-worker"} == 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "Экспортёр метрик воркера Celery недоступен."
          description: >-
            Сам воркер может работать. Прежде чем решить, что сборы встали,
            посмотрите celery_queue_length и счётчики сборов. Экспортёр
            поднимается на worker_ready и специально не роняет воркер.

  # -------------------------------------------------------------------------
  - name: security
    rules:
      # This one should never fire. That is the point of it.
      - alert: RowLevelSecurityViolation
        expr: increase(security_rls_violations_total{reason="tenant_unset"}[10m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "Запрос полез в данные арендатора, не сказав, чьи они."
          description: >-
            RLS его отклонил. Данные никуда не ушли — защита сработала. Но
            где-то в коде есть путь к таблицам арендатора мимо
            get_current_workspace_id. Ради этого политики и ставили (реестр
            P2.5). Ищите в логах ERROR от src.core.observability.rls_watch —
            сам запрос лежит в той же строке. `for: 0m` тут намеренно:
            одного раза достаточно.

      - alert: SecurityControlDegraded
        expr: security_degraded_controls == 1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Защита {{ $labels.control }} работает в аварийном режиме и пропускает всё."
          description: >-
            Она перешла на запасной путь, потому что не отвечает Redis
            (реестр P1.2). Пока это так, подбор паролей ограничен только
            тем, что ещё живо. Две такие сразу — это уже связанный отказ,
            ради которого журнал и заводили.

      - alert: AuthFailureSpike
        expr: sum(rate(security_auth_failures_total[5m])) > 2
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Долгий поток неудачных входов ({{ $value | printf \"%.1f\" }} в секунду)."
          description: >-
            Так выглядит перебор паролей. На пути стоят задержка по аккаунту
            (P1.5) и лимит по IP (P0.1), так что обычно это отбитая атака, а
            не успешная. Прежде чем что-то делать, посмотрите
            security_auth_failures_total в разрезе reason и поле client_ip в
            логах.

  # -------------------------------------------------------------------------
  - name: harvest
    rules:
      # The alert that would have caught the 2026-07-30 incident, in which
      # every harvest reported SUCCESS with funnel_rows: 0 for days.
      #
      # TWO WINDOWS, because "no rows in six hours" is a fault for one harvest
      # and a Tuesday for the other.
      #
      # `monitoring.nightly` sweeps fresh data every night: six hours of
      # nothing means something is broken.
      #
      # `finreports.finance` does not work that way, and reading it as though
      # it did is what produced eight pages and seven repeats between the 13th
      # and 14th of September 2026 with nothing wrong. It ran 21 times a day
      # then (`crontab(hour="0-2,4,8-23")` plus the 03:00 reconcile); since
      # 2026-09-23 it is every 15 minutes 07:00-18:45 MSK, hourly outside that
      # and the 03:00 reconcile (`src/core/celery_app.py`) — against sources
      # WB publishes on ITS schedule — the settlement report weekly, paid
      # that is correct. So nineteen of those twenty-one runs legitimately
      # write nothing, and any six-hour window between publications is red.
      #
      # 26 hours is the same number, and the same reasoning, as
      # `SettlementHistoryHasGaps` below: one full daily cycle plus slack, so
      # the rule cannot fire on a source that is merely waiting for tonight.
      # have landed.
      - alert: HarvestProducingNoRows
        expr: |
          (
            sum by (harvest) (increase(harvest_rows_processed_total{harvest!="finreports.finance"}[6h])) == 0
            and on (harvest)
            (sum by (harvest) (increase(harvest_duration_seconds_count{harvest!="finreports.finance"}[6h])) > 0)
          )
          or
          (
            sum by (harvest) (increase(harvest_rows_processed_total{harvest="finreports.finance"}[26h])) == 0
            and on (harvest)
            (sum by (harvest) (increase(harvest_duration_seconds_count{harvest="finreports.finance"}[26h])) > 0)
          )
        for: 30m
        labels:
          severity: page
        annotations:
          summary: "Сбор {{ $labels.harvest }} идёт и ничего не пишет."
          description: >-
            Важна вторая половина: сбор ЗАПУСТИЛСЯ и дал ноль строк. Это не
            то же самое, что «сбор не запускался». Так выглядел сбой с пулом
            Redis: задачи успешны, а источники пустые. Ни одна метрика
            успеха задач такого не покажет.

      # The settlement walk gets its own rule, ahead of the general one and at
      # a threshold of ONE. A finance window that stops early is not a degraded
      # source that will heal on the next tick: WB served the old endpoint once
      # per ~917 s (finance-api since 2026-09-22 serves one a minute, and a
      # report is booked only once all of it has landed), so the week was left
      # part-walked, and until 2026-09-08 the
      # harvest's watermark then advanced past the missing days off the report
      # header and nothing ever asked for them again. The general rule below
      # could not see it — three partials spread over three days never reach
      # `> 3` in an hour, and once the days were skipped the counter went quiet,
      # which reads exactly like recovery.
      #
      # `for: 2h` rather than `0m`, and the reason the threshold of ONE stays.
      # When this was written a partial window meant permanent loss: the
      # watermark advanced past the missing days off the report header and
      # nothing asked again. That was fixed on 2026-09-08 — the walk now
      # re-asks from the watermark — so a single partial is a window the NEXT
      # tick recovers, and paging on it says "look at this" about something
      # already healing.
      #
      # What is left is the case the threshold was always for: partials that
      # keep happening. Two consecutive hours of them means the next tick did
      # not recover it, which is the state a person is needed for. Measured on
      # 2026-09-13/14: every real firing lasted 55 minutes and cleared on its
      # own, three pages for contention between NEVA's P&L backfill and the
      # hourly harvest over WB's one-request-per-15-minutes settlement
      # endpoint (retired 2026-09-22). None of them would survive this.
      - alert: SettlementWalkIncomplete
        expr: increase(harvest_partial_total{harvest="finreports.finance",source="finance"}[1h]) > 0
        for: 2h
        labels:
          severity: page
        annotations:
          summary: "Неделя отчёта о продажах дочитана не до конца хотя бы у одного продавца."
          description: >-
            За эти дни P&L будет неполным, пока их не дочитает следующий
            проход. Сверьте `settled_through` в
            finreports.settlement_watermark с шапками отчётов: проход должен
            переспросить от водяного знака. Если знак ушёл вперёд, а строк
            за пропущенные дни нет — вернулся сбой от 2026-09-07.

      # WB's own forPaySum against ours, taken the moment a report is booked —
      # rows and total from the same fetch, so a gap is ours: a report cut
      # short, or an operation signed the wrong way. The rule behind "ours" is
      # REFUND_DOC_TYPE; it matched all 143 reports of «Демо» to the kopeck
      # on 2026-09-24, so anything from a rouble up is news. A report that does
      # not add up is re-fetched every tick (incomplete_report_ids) and is
      # observed again each time, which is what keeps this firing until fixed.
      - alert: SettlementPayoutDisagreesWithWb
        expr: >-
          increase(settlement_payout_divergence_count[6h])
          - increase(settlement_payout_divergence_bucket{le="1.0"}[6h]) > 0
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "Сумма «к перечислению» по отчёту не сходится с итогом WB."
          description: >-
            Отчёт записан, но наша сумма `ppvz_for_pay` расходится с
            `forPaySum` из `sales-reports/list` больше чем на рубль. В логе
            worker ищите «totals … here against WB's» — там номер отчёта и
            разница. Либо отчёт дочитан не весь (его перекачает следующий
            тик), либо у WB появилась операция или тип документа, которые мы
            считаем с другим знаком — см. docs/finreports/PNL.md, раздел про
            знак выплаты.

      # `card-prices` is left out on purpose. Since 2026-09-22 the storefront
      # answers 498 (the wbaas captcha) to every address we hold, so every
      # кабинет loses it on every nightly pass — four partials an hour, one
      # page a night, about something nobody can fix from here
      # (integrations/wildberries/clients/card.py). StorefrontPriceBack below
      # says when that changes; put the source back here then.
      - alert: HarvestPartial
        expr: increase(harvest_partial_total{source!="card-prices"}[1h]) > 3
        for: 0m
        labels:
          severity: warn
        annotations:
          summary: "Сбор {{ $labels.harvest }} раз за разом теряет источник {{ $labels.source }}."
          description: >-
            Один неполный сбор — это норма: так одна мёртвая ручка WB не
            роняет весь проход. Много неполных подряд — уже не норма: цифры
            по этому источнику тихо устаревают.

      # The other half of HarvestPartial's exclusion: good news, and the only
      # way anyone learns of it. The nightly pass wrote prices within the last
      # day (so it ran) and not one кабинет lost `card-prices` in that day. Both
      # counters move in the same record_harvest_outcome call, so one window
      # covers both, and a worker restart keeps the older samples in range.
      - alert: StorefrontPriceBack
        expr: >-
          sum(increase(harvest_rows_processed_total{harvest="monitoring.nightly",source="price"}[26h])) > 0
          unless
          sum(increase(harvest_partial_total{harvest="monitoring.nightly",source="card-prices"}[26h])) > 0
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: "Витрина WB снова отдаёт цену покупателя."
          description: >-
            За сутки ночной сбор ни разу не потерял источник card-prices.
            С 22.09.2026 витрина отвечала капчей (498), и цена покупателя с
            СПП не собиралась. Проверьте, что она снова пишется, затем
            верните card-prices в правило HarvestPartial и удалите это.

      - alert: CeleryQueueBackingUp
        expr: celery_queue_length{queue_name="celery"} > 50
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "В очереди Celery накопилось {{ $value }} сообщений."
          description: >-
            Слотов у воркера четыре. Проверьте, не застряла ли задача: если
            celery_queue_length{queue_name="unacked"} держится высоко, а
            сама очередь при этом уходит — работу забрали и не закончили.

      - alert: TaskFailureRate
        expr: |
          sum by (task_name) (rate(celery_tasks_total{state="failure"}[15m]))
          > 0.05
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Задача {{ $labels.task_name }} падает раз за разом."

      # The two rules below are about the same failure from opposite ends: the
      # cgroup OOM killer taking a prefork child mid-task. `TaskFailureRate`
      # above cannot see it — three kills in twelve hours is 0.00007/s against
      # a threshold of 0.05 — and until 2026-09-17 nothing else could either:
      # the worker published no memory series at all, so the kills lived only
      # in `dmesg`.
      #
      # `WorkerKilled` is the aftermath and fires on one. That is not a low
      # threshold, it is the right one: the child died with no unwind, the
      # message is acknowledged rather than requeued, and the tasks that had
      # not run yet simply did not happen. On 2026-09-17 the 01:00 finance
      # harvest died on its first seller and the other four waited four hours
      # for the next tick.
      - alert: WorkerKilled
        expr: increase(celery_worker_lost_total[1h]) > 0
        for: 0m
        labels:
          severity: warn
        annotations:
          summary: "Задача {{ $labels.task_name }} оборвалась вместе с процессом воркера."
          description: >-
            Процесс убит снаружи — почти всегда это ядро за перерасход
            памяти. Задача не переигрывается: сообщение подтверждено, и всё,
            что она не успела сделать, просто не сделано до следующего тика.
            Смотрите `celery_worker_memory_bytes` за тот же час и
            `dmesg -T | grep -i "killed process"` на хосте. Если это память,
            виноват не последний кусок, а дно: ребёнок Celery накапливает
            свой максимум RSS, поэтому та же работа проходит на свежем
            воркере и падает через несколько часов.

      # The approach, so the kill above stops being the first news. 85% of the
      # ceiling with a fresh pool sitting at ~35% (267 MB of 768 MiB, measured
      # 2026-09-17) is a long way from normal and still leaves room to look.
      # Ten minutes because the growth that matters here is the ratchet across
      # tasks, measured in hours — a task's own spike is not something anyone
      # can act on inside its run.
      - alert: WorkerMemoryNearLimit
        expr: |
          celery_worker_memory_bytes / celery_worker_memory_limit_bytes > 0.85
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Воркер занял {{ $value | humanizePercentage }} своего потолка памяти."
          description: >-
            Ещё не убит, но запас кончается. Штатное дно свежего пула —
            около трети потолка; всё, что выше, это накопленный максимум
            детей плюс то, что держит текущая задача. `--max-memory-per-child`
            должен переработать ребёнка раньше ядра, так что держащаяся
            высоко цифра означает либо одну задачу, которой честно нужно
            столько, либо родителя, который растёт сам — второе он делать не
            должен.

  # -------------------------------------------------------------------------
      - alert: SettlementHistoryHasGaps
        expr: finreports_settlement_gap_days > 0
        for: 26h
        labels:
          severity: warn
        annotations:
          summary: "Есть день продаж, который не покрыт ни одним скачанным отчётом."
          description: >-
            У кого-то в P&L не хватит дня. WB делает однодневные
            дополнительные отчёты и начинает отдавать их строки через
            несколько дней — окно прохода к этому времени уже ушло вперёд.
            Так 2026-08-31 пропал у всех пяти воркспейсов, и никто не
            заметил. Счётчики сборов этого не покажут: проход успешен и
            пишет ровно то, о чём его попросили. Единственный след — дырка в
            периодах отчётов. Ночная сверка берёт в первую очередь воркспейс
            с известной дыркой, поэтому починимая закрывается за сутки.
            Отсюда и `for: 26h`: достаточно долго, чтобы не сработать на
            дырке, которая просто ждёт ночи, и достаточно коротко, чтобы
            увидеть дырку, до которой сверка не дотягивается. КТО продавец и
            КАКИЕ дни — в логе воркера (`finreports: <name> has N settlement
            day(s) no report covers`); метрика общая по всем, потому что
            /metrics не имеет права называть арендатора. Если за ночь не
            погасло, сверка не дотягивается: посмотрите, не упало ли её окно
            на лимите WB, и долейте день руками по нужному токену.

  - name: wildberries
    rules:
      # `wb_rate_limit_quota_remaining` is deliberately NOT the expression for
      # either rule below, and the reason is worth the paragraph, because the
      # gauge reads like the obvious choice and was the obvious choice until
      # 2026-09-07.
      #
      # That gauge is written only inside `RateGate.observe`, which runs only
      # when a WB response arrives, and nothing ever decays it. WB's bucket
      # refills on a timer; the gauge does not. So the last request of a burst
      # legitimately reports `remaining: 0` — the analytics bucket is three
      # deep, and reaching zero at the end of a burst is pacing WORKING — and
      # that zero then sits there for hours, until the next harvest happens to
      # touch the same endpoint.
      #
      # Measured on prod 2026-09-07: `/adv/v3/fullstats` held 0 for more than
      # 24 hours across 14 requests, every one of which returned 200, and
      # `/api/analytics/v1/stocks-report/wb-warehouses` held 0 for eight hours
      # while receiving four requests in total. Over that window WB returned no
      # 429, no 500, no stall and no `rate_blocked` anywhere. The old rule
      # (`== 0 for 10m`) fired continuously against a completely healthy
      # service.
      #
      # It also FLAPPED, which is the half that turned a false alert into a
      # pager. The gauge is `livemostrecent` across a prefork pool: when a
      # Celery child is recycled, `_mark_process_dead` removes its file and the
      # series stops existing, so the alert resolves; the next child observes
      # the endpoint and it fires again ten minutes later. A resolved/firing
      # pair every few minutes, each one re-sending the whole group, is what
      # that looks like from the receiving end.
      #
      # Both rules below are built on COUNTERS instead. A counter rate decays
      # to zero by itself, cannot be stale, and cannot flap when a series comes
      # and goes with a worker process — the three properties the gauge lacks.
      # The gauge keeps its Grafana panel, where a last-observation is exactly
      # what a human wants to look at.
      - alert: WbRateBudgetExhausted
        expr: |
          sum by (surface, endpoint) (
            rate(wb_api_requests_total{status="rate_blocked"}[15m])
          ) > 0
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "Наш ограничитель не пускает запрос к WB: {{ $labels.surface }} {{ $labels.endpoint }}."
          description: >-
            `rate_blocked` — это НАШ ограничитель отказывается отправлять
            запрос, потому что токена пришлось бы ждать дольше допустимого.
            Это единственный признак, который прямо говорит: настроенный
            бакет больше не совпадает с бакетом WB. Все прочие симптомы
            (зависание, 500) выглядят так же, как плохой токен или авария на
            стороне WB. Прежде чем что-то менять, сравните
            `wb_analytics_bucket_capacity` / `_refill_seconds` с тем, что
            показывает `x-ratelimit-remaining` на панели в Grafana. Само по
            себе это редко и вспышками: 15m скорости, удержанные 30m,
            означают блокировки, размазанные по получасу, а не один
            невезучий сбор. За семь дней до 2026-09-07 прод дал всего два
            ответа `rate_blocked`, оба на финансах — на таком это правило не
            сработало бы.

      - alert: WbRatePacingPressure
        expr: |
          sum by (surface, endpoint) (
            rate(wb_rate_limit_wait_seconds_total[30m])
          ) > 2
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "Очередь к WB {{ $labels.surface }} {{ $labels.endpoint }}: {{ $value | printf \"%.1f\" }} секунды ожидания на каждую секунду времени."
          description: >-
            Ранний признак, которым должен был стать датчик квоты, но в
            форме, которая не может протухнуть. Значение — это секунды
            ожидания, накопленные за одну секунду реального времени. 1.0
            значит, что ровно один вызов постоянно стоит в очереди. Для
            здорового долгого сбора из бакета на три токена с доливкой ~20s
            это НОРМА, а не поломка. Порог 2 — это примерно вдвое больше
            любого здорового пика, замеренного за сутки на проде 2026-09-07
            (финансы reportDetailByPeriod 1.02, sales-funnel/products 0.94,
            остальное ниже 0.12). Он означает, что на ОДНОЙ ручке постоянно
            стоят минимум два вызова. Рост здесь начинается раньше, чем
            `rate_blocked` — есть запас времени расширить окно или снизить
            параллельность.

      - alert: WbRateBlockEscalating
        expr: |
          sum by (surface, endpoint) (
            increase(wb_rate_limit_block_seconds_sum[6h])
          ) > 7200
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "WB закрывает {{ $labels.surface }} {{ $labels.endpoint }} всё дольше: {{ $value | printf \"%.0f\" }} секунд блокировок за 6 часов."
          description: >-
            Каждая блокировка — это событие с длительностью, которую назвал
            сам WB. Сумма за шесть часов растёт быстро только в одном
            сценарии: мы отправляем запрос внутрь ещё открытого окна, WB
            перезапускает окно длиннее, и цикл повторяется. Ровно так
            17.09.2026 отчёт расчётов ушёл с 28 197 s на 302 940 s за три
            шага, и увидели это только через двое суток, раскапывая логи.
            Порог 7200 — это два часа суммарной блокировки за шесть часов;
            штатный ритм ручки расчётов (одна блокировка ~900 s) до него не
            дотягивает.

            Что делать: НЕ пробовать вручную. Посмотрите
            `histogram_quantile(1, ...)` по этой же метрике — если верхняя
            корзина растёт, значит эскалация идёт, и любой запрос сделает
            хуже. Гейт уже держит блок с запасом и удваивает его при повторе
            (`rate_limit_lua.py`, `PENALISE_LUA`); дождитесь, пока
            `wb_rate_limit_block_seconds_count` перестанет расти.

      - alert: WbErrorRate
        expr: |
          sum(rate(wb_api_requests_total{status!~"2.."}[10m]))
          / clamp_min(sum(rate(wb_api_requests_total[10m])), 0.001) > 0.25
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Больше четверти запросов к WB падает."
          description: >-
            Сюда входят transport_error и rate_blocked, и это намеренно:
            именно так WB тут и ломается, а HTTP-статуса у этих отказов нет.
            Прежде чем решить, что дело в WB, а не в одном перевыпущенном
            токене, разложите по surface и status.

  # -------------------------------------------------------------------------
  - name: saturation
    rules:
      - alert: PostgresPoolExhausted
        expr: postgres_pool_connections_free == 0 and postgres_pool_connections_used > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "В пуле не осталось свободных подключений к базе."
          description: >-
            Такое уже было: утёкшие подключения в состоянии `idle in
            transaction` держали все слоты 22 часа. Из-за этого в
            src/core/database.py и появился
            idle_in_transaction_session_timeout. Если used упёрся в потолок
            при обычном трафике — ищите утечку, а не нагрузку.

      - alert: ApiLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, handler) (rate(http_request_duration_seconds_bucket[10m]))
          ) > 3
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "p95 времени ответа на {{ $labels.handler }} больше 3 секунд."

      - alert: ServerErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[10m]))
          / clamp_min(sum(rate(http_requests_total[10m])), 0.001) > 0.02
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "Больше 2% ответов — это 5xx."

  # -------------------------------------------------------------------------
  # New-organisation history backfill.
  #
  # This group exists because of a failure that produced no alert of any kind.
  # A new org's history arrives as four lanes of self-enqueueing ticks, and a
  # tick that dies before its re-enqueue ends the walk with nothing scheduled
  # to notice: no exception reaches a caller, no work-done counter moves, the
  # lane simply stops. On 2026-09-10 NEVA's P&L lane died on its first tick and
  # sat there for eleven hours until a person happened to look.
  #
  # So these rules alert on the ABSENCE of progress, which is the only shape
  # this failure has, and they distinguish the two cases that need different
  # responses: the system healing itself (stalled, restarted, moving again)
  # from the system failing to (stalled, restarted, still stalled).
  # -------------------------------------------------------------------------
  - name: backfill
    rules:
      - alert: NewOrgBackfillStalled
        # The watchdog sweeps every 15 minutes and a lane is called stalled
        # after 45 minutes without movement, so `for: 1h` means at least two
        # sweeps have seen it and at least one restart has been attempted.
        # Anything shorter alerts on a lane that is about to be healed.
        expr: backfill_lanes_stalled > 0
        for: 1h
        labels:
          severity: page
        annotations:
          summary: "Застрявших полос загрузки истории: {{ $value }}. Данные нового продавца не приходят."
          description: >-
            Полоса перестала двигаться, и перезапуски сторожа её не оживили.
            Продавец видит полупустой продукт, и больше об этом никто не
            сообщит. КТО продавец — в логах, не здесь: метрики не называют
            арендатора. Grafana → Explore → Loki: {service="worker"} |=
            "backfill" — полоса, workspace_id и курсор есть в каждой строке.
            Посмотрите застрявшую строку в `workspaces.workspace_backfill` и
            `backfill_lane_restarts_total` — пытался ли сторож вообще. Если
            курсор не двигается через перезапуски, дело в самом курсоре, а
            не в случайном сбое.

      - alert: NewOrgBackfillRestartLoop
        # Restarts happening AND the stall persisting. The watchdog is doing
        # its job and the job is not working — which is a different incident
        # from a lane nobody restarted, and the one that needs a human.
        expr: |
          increase(backfill_lane_restarts_total[2h]) >= 3
          and on() backfill_lanes_stalled > 0
        # An hour, not fifteen minutes, and WB sets the number. The P&L lane
        # walked an endpoint served once per ~15 minutes and frequently not
        # served at all (finance-api since 2026-09-22 serves one request a
        # minute, but can still refuse); a tick that finds the window shut records its message
        # and waits. When one of those ticks dies before recording, the lane
        # looks stalled for the 45 minutes `STALE_AFTER` allows, the watchdog
        # restarts it — correctly — and the restart counter moves.
        #
        # Measured 2026-09-13: three pages, each firing for exactly ten
        # minutes and clearing itself, against a lane that was walking
        # normally (281 of 759 windows, message "Wildberries не отдал
        # страницу"). A condition that resolves in ten minutes was never one
        # for a person. Restarts that are STILL failing an hour later are.
        for: 1h
        labels:
          severity: page
        annotations:
          summary: "Полосу загрузки {{ $labels.lane }} перезапускают снова и снова, а она снова встаёт."
          description: >-
            Сторож перезапустил её три раза или больше за два часа, а
            движения нет. Значит, перезапуск не помогает. Скорее всего дело
            в испорченном курсоре, в токене, который WB перестал принимать,
            или в строке, которую не получается записать. Прежде чем
            перезапускать руками, прочитайте в логе воркера последнее
            исключение этой полосы — иначе будет то же самое, что и в
            прошлые три раза.

      - alert: NewOrgBackfillFailing
        # The moment of death rather than its consequence. Fires earlier than
        # the stall alert and is the one that says WHY, because the failure
        # counter moves at the exception and the gauge only moves 45 minutes
        # later.
        expr: increase(backfill_lane_failures_total[30m]) >= 2
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Полоса загрузки {{ $labels.lane }} упала несколько раз за последние 30 минут."
          description: >-
            Два тика этой полосы или больше закончились ошибкой вместо шага.
            Сторож продолжит её перезапускать, так что может починиться
            само. Но если полоса падает так часто, дело обычно во входных
            данных, а не в случайности. Исключение лежит в логе воркера
            рядом с workspace_id: {service="worker"} |= "died with".

      - alert: BackfillWatchdogNotRunning
        # The watchdog's own watchdog, and the reason it exists is that every
        # other rule in this group depends on the sweep running. If beat dies,
        # or the task is renamed out from under the schedule, the gauge the
        # other rules read simply stops being written — and a gauge that is
        # never written never crosses a threshold. The whole group would go
        # quiet at exactly the moment it stopped working, which is the failure
        # mode this file exists to refuse.
        #
        # `absent()` is the second half: without it the rule matches nothing
        # when the series has never appeared, which is precisely the "never ran
        # once" case.
        expr: |
          absent(celery_tasks_total{task_name="workspaces.sweep_stalled_backfills"})
          or increase(
            celery_tasks_total{task_name="workspaces.sweep_stalled_backfills"}[2h]
          ) == 0
        for: 30m
        labels:
          severity: page
        annotations:
          summary: "Сторож загрузок не запускался два часа. Застрявшие полосы никто не перезапускает."
          description: >-
            `workspaces.sweep_stalled_backfills` стоит в расписании каждые
            пятнадцать минут и не выполнялся. Все остальные алерты про
            загрузку читают датчик, который пишет только эта задача, так что
            пока это горит — они слепы. Считайте тихую группу загрузки
            неизвестной, а не здоровой. Проверьте, жив ли Celery beat
            (`docker ps`, потом его лог) и осталась ли задача в
            `celery_app.conf.beat_schedule`.

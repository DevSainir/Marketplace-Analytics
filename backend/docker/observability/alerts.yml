# ---------------------------------------------------------------------------
# The rules that page somebody. Real-time alerting on auth failures, 403
# spikes and rate-limit trips was the open half of the logging work, and the
# fields to bind a rule to already existed. These are those rules.
#
# Every alert here obeys two conventions. `for:` is never zero — an alert that
# fires on one bad scrape fires on a deploy, and an alert that fires on a
# deploy is one people mute. And every annotation says what to DO, because the
# person reading it at 03:00 is not the person who wrote it.
# ---------------------------------------------------------------------------

groups:
  # -------------------------------------------------------------------------
  # The alert path itself. `Watchdog` is the one rule meant to be firing: it
  # holds while Alertmanager is scraped, has not failed a Telegram delivery in
  # the last half hour, and the Telegram relay has at least one road that
  # passes its health check. It is sent nowhere. The API's `/healthz/alerts`
  # asks Alertmanager whether it is active, and UptimeRobot polls that from
  # outside the box — so the answer turns red when anything on the path stops:
  # the box, Prometheus, Alertmanager, the relay, or the last hop to Telegram.
  # Silence is the signal, and it is read from outside.
  #
  # The relay's health check is what closed the old gap. Before it, a Telegram
  # outage while nothing else was firing was found at the first page that
  # failed; the road is now tried every ten seconds whether or not anything is
  # waiting to go down it.
  # -------------------------------------------------------------------------
  - name: meta
    rules:
      - alert: Watchdog
        expr: |
          sum(increase(alertmanager_notifications_failed_total{integration="telegram"}[30m])) == 0
          and on() max(up{job="alertmanager"}) == 1
          and on() max(haproxy_backend_active_servers{job="telegram-relay",proxy="telegram"}) > 0
        for: 1m
        labels:
          severity: heartbeat
        annotations:
          summary: "Alerts are getting through: the heartbeat for the outside check."
          description: >-
            This rule always fires and is sent nowhere. /healthz/alerts reads it,
            and UptimeRobot checks that page. If UptimeRobot reports that the page
            does not answer "alerts-ok", alerts are not getting through. Check
            `docker exec marketplace-analytics-observability-alertmanager-1
            wget -qO- localhost:9093/metrics | grep notifications_failed` and the logs of
            `marketplace-analytics-observability-telegram-relay-1`.

      - alert: TelegramRoadDown
        expr: max(haproxy_backend_active_servers{job="telegram-relay",proxy="telegram"}) < 2
        # Six hours, because the roads flap: at one dropped connect in three,
        # a road fails five health checks in a row several times a day and is
        # back ten seconds later. A road that stays down this long is the
        # 149.154.166.110 story again — an address that has stopped answering.
        for: 6h
        labels:
          severity: warn
        annotations:
          summary: "One of the two roads to Telegram has been down for six hours."
          description: >-
            Alerts still arrive over the other road, but there is no spare left. Check
            the logs of `marketplace-analytics-observability-telegram-relay-1`: which server (ipv6
            or ipv4) is DOWN. If a Telegram address has stopped answering,
            find a working one (curl --resolve api.telegram.org:443:<ip>
            https://api.telegram.org/bot0:x/getMe; a 401 means the road works)
            and replace it in backend/docker/telegram-relay/haproxy.cfg.

  # -------------------------------------------------------------------------
  - name: availability
    rules:
      - alert: ApiDown
        expr: up{job="marketplace-api"} == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "API instance {{ $labels.instance }} is not responding."
          description: >-
            nginx retries a refused request on the other instance, so one
            instance down is not an outage yet. First check that the other one
            is alive. Then run `make logs` on the server and look for a failed
            migration step.

      - alert: BothApiInstancesDown
        expr: count(up{job="marketplace-api"} == 1) == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Neither API instance is responding. The site is down."
          description: >-
            No live instance is left in the nginx pool. Users see
            502. Details in docs/monitoring/OBSERVABILITY.md.

      - alert: DependencyDown
        expr: dependency_up == 0
        for: 2m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.dependency }} is failing its health check."
          description: >-
            Without Postgres nothing works. Without Redis the API keeps
            answering, but the sign-in attempt limiter and session revocation
            start letting everything through. This is not just "slower" —
            it is a hole in the defenses.

      - alert: PostgresCrashRecovered
        expr: max(changes(postgres_stats_reset_timestamp_seconds[30m])) > 0
        for: 1m
        labels:
          severity: warn
        annotations:
          summary: "Postgres restarted its processes after a crash."
          description: >-
            Postgres resets its statistics only when it recovers from a crash,
            which is why this value moved. Recovery takes seconds, but every
            connection drops at that moment. Most likely the kernel killed a
            Postgres process at the container's memory limit. On the server run
            `docker logs --since 1h marketplace-analytics-postgres-1 | grep
            "terminated by signal"`, then `dmesg -T | grep oom-kill`. The kernel's
            out-of-memory report shows which process held the memory.

      - alert: WorkerExporterDown
        expr: up{job="marketplace-worker"} == 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: "The Celery worker's metrics exporter is unreachable."
          description: >-
            The worker itself may be running. Before deciding the harvests have
            stopped, check celery_queue_length and the harvest counters. The
            exporter starts on worker_ready and deliberately never takes the worker down.

  # -------------------------------------------------------------------------
  - name: security
    rules:
      # This one should never fire. That is the point of it.
      - alert: RowLevelSecurityViolation
        expr: increase(security_rls_violations_total{reason="tenant_unset"}[10m]) > 0
        for: 0m
        labels:
          severity: page
        annotations:
          summary: "A query reached for tenant data without saying whose it was."
          description: >-
            RLS rejected it. No data left — the control worked. But somewhere
            in the code there is a path to tenant tables that skips
            get_current_workspace_id. That is what the policies were put in for
            (register P2.5). Look in the logs for ERROR from
            src.core.observability.rls_watch — the query is on the same line.
            `for: 0m` is deliberate here: once is enough.

      - alert: SecurityControlDegraded
        expr: security_degraded_controls == 1
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Control {{ $labels.control }} is in fallback mode and lets everything through."
          description: >-
            It fell back because Redis is not answering. While that lasts,
            password guessing is limited only by
            what is still alive. Two of these at once is a correlated failure,
            the one the log was set up to catch.

      - alert: AuthFailureSpike
        expr: sum(rate(security_auth_failures_total[5m])) > 2
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "A sustained stream of failed sign-ins ({{ $value | printf \"%.1f\" }} per second)."
          description: >-
            This is what password guessing looks like. A per-account delay
            (P1.5) and a per-IP limit (P0.1) stand in the way, so it is usually
            a repelled attack, not a successful one. Before doing anything, look
            at security_auth_failures_total by reason and the client_ip field in
            the logs.

  # -------------------------------------------------------------------------
  - name: harvest
    rules:
      # The alert that would have caught the 2026-07-30 incident, in which
      # every harvest reported SUCCESS with funnel_rows: 0 for days.
      #
      # TWO WINDOWS, because "no rows in six hours" is a fault for one harvest
      # and a Tuesday for the other.
      #
      # `monitoring.nightly` sweeps fresh data every night: six hours of
      # nothing means something is broken.
      #
      # `finreports.finance` does not work that way, and reading it as though
      # it did is what produced eight pages and seven repeats between the 13th
      # and 14th of September 2026 with nothing wrong. It ran 21 times a day
      # then (`crontab(hour="0-2,4,8-23")` plus the 03:00 reconcile); today it
      # is gated ticks through the day and the 04:00 reconciliation
      # (`src/core/celery_app.py`) — against a source WB publishes on ITS
      # schedule, the settlement report, weekly. On 2026-09-14 the settlement
      # wrote 0 rows in 24h, and that was correct. So most runs legitimately
      # write nothing, and any six-hour window between publications is red.
      #
      # 26 hours is the same number, and the same reasoning, as
      # `SettlementHistoryHasGaps` below: one full daily cycle plus slack, so
      # the rule cannot fire on a source that is merely waiting for tonight.
      # What keeps the series moving on a day WB publishes nothing is the 04:00
      # reconciliation: for every seller it re-walks the reports held inside
      # `RECONCILE_LOOKBACK_DAYS` and re-writes their rows, so one pass a day
      # writes rows whenever any seller has a report from the last fortnight.
      # The duration half keeps a fleet with nothing to walk quiet rather than
      # red — `harvest_duration_seconds_count` moves only when a seller had a
      # report to walk. Walking for 26 hours with no rows at all is a real fault.
      - alert: HarvestProducingNoRows
        expr: |
          (
            sum by (harvest) (increase(harvest_rows_processed_total{harvest!="finreports.finance"}[6h])) == 0
            and on (harvest)
            (sum by (harvest) (increase(harvest_duration_seconds_count{harvest!="finreports.finance"}[6h])) > 0)
          )
          or
          (
            sum by (harvest) (increase(harvest_rows_processed_total{harvest="finreports.finance"}[26h])) == 0
            and on (harvest)
            (sum by (harvest) (increase(harvest_duration_seconds_count{harvest="finreports.finance"}[26h])) > 0)
          )
        for: 30m
        labels:
          severity: page
        annotations:
          summary: "Harvest {{ $labels.harvest }} is running and writing nothing."
          description: >-
            The second half matters: the harvest RAN and produced zero rows. That
            is not the same as "the harvest did not run". This is what the Redis
            pool failure looked like: tasks succeed, sources are empty. No task
            success metric shows that.

      # The settlement walk gets its own rule, ahead of the general one and at
      # a threshold of ONE. A finance window that stops early is not a degraded
      # source that will heal on the next tick: WB served the old endpoint once
      # per ~917 s (finance-api since 2026-09-22 serves one a minute, and a
      # report is booked only once all of it has landed), so the week was left
      # part-walked, and until 2026-09-08 the
      # harvest's watermark then advanced past the missing days off the report
      # header and nothing ever asked for them again. The general rule below
      # could not see it — three partials spread over three days never reach
      # `> 3` in an hour, and once the days were skipped the counter went quiet,
      # which reads exactly like recovery.
      #
      # `for: 2h` rather than `0m`, and the reason the threshold of ONE stays.
      # When this was written a partial window meant permanent loss: the
      # watermark advanced past the missing days off the report header and
      # nothing asked again. That was fixed on 2026-09-08 — the walk now
      # re-asks from the watermark — so a single partial is a window the NEXT
      # tick recovers, and paging on it says "look at this" about something
      # already healing.
      #
      # What is left is the case the threshold was always for: partials that
      # keep happening. Two consecutive hours of them means the next tick did
      # not recover it, which is the state a person is needed for. Measured on
      # 2026-09-13/14: every real firing lasted 55 minutes and cleared on its
      # own, three pages for contention between one workspace's P&L backfill and the
      # hourly harvest over WB's one-request-per-15-minutes settlement
      # endpoint (retired 2026-09-22). None of them would survive this.
      - alert: SettlementWalkIncomplete
        expr: increase(harvest_partial_total{harvest="finreports.finance",source="finance"}[1h]) > 0
        for: 2h
        labels:
          severity: page
        annotations:
          summary: "At least one seller's report week was only partly read."
          description: >-
            The P&L for those days stays incomplete until the next pass reads
            them. Compare `settled_through` in
            finreports.settlement_watermark with the report headers: the pass
            should re-ask from the watermark. If the watermark moved ahead and
            the skipped days have no rows, the 2026-09-07 failure is back.

      # WB's own forPaySum against ours, taken the moment a report is booked —
      # rows and total from the same fetch, so a gap is ours: a report cut
      # short, or an operation signed the wrong way. The rule behind "ours" is
      # REFUND_DOC_TYPE; it matched all 143 reports of one workspace to the kopeck
      # on 2026-09-24, so anything from a rouble up is news. A report that does
      # not add up is re-fetched every tick (incomplete_report_ids) and is
      # observed again each time, which is what keeps this firing until fixed.
      - alert: SettlementPayoutDisagreesWithWb
        expr: >-
          increase(settlement_payout_divergence_count[6h])
          - increase(settlement_payout_divergence_bucket{le="1.0"}[6h]) > 0
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "A report's payout does not match WB's total."
          description: >-
            The report is booked, but our `ppvz_for_pay` total differs from
            `forPaySum` from `sales-reports/list` by more than a ruble. In the
            worker log look for "totals … here against WB's" — it has the report
            number and the difference. Either the report was not read in full (the
            next tick re-fetches it), or WB has a new operation or document type
            we count with the wrong sign — see docs/finreports/PNL.md, the section
            on the payout sign.

      # A weekly report the seller uploaded by hand disagrees with WB's API —
      # found at upload (we hold the period and it differs; nothing written) or
      # when the API serves the report (its rows replace the file's anyway, so
      # the week is not counted twice). Both are WB's documents, so either is a
      # question for a person, not a number to average away.
      - alert: SettlementUploadDisagreesWithWb
        expr: increase(finreports_settlement_upload_divergence_total[1h]) > 0
        for: 0m
        labels:
          severity: warn
        annotations:
          summary: "A hand-uploaded WB report does not match the report from the API."
          description: >-
            A seller uploaded a weekly report file, and its rows differ from
            what the WB API served. In the worker log look for "uploaded report … differs"
            — it has the report number, the workspace and both payout totals.
            Compare the file with the WB seller portal: the file may have been
            edited, or WB reissued the report. See finreports/services/settlement_upload/.

      # `card-prices` is left out on purpose. Since 2026-09-22 the storefront
      # answers 498 (the wbaas captcha) to every address we hold, so every
      # workspace loses it on every nightly pass — four partials an hour, one
      # page a night, about something nobody can fix from here
      # (integrations/wildberries/clients/card.py). StorefrontPriceBack below
      # says when that changes; put the source back here then.
      - alert: HarvestPartial
        expr: increase(harvest_partial_total{source!="card-prices"}[1h]) > 3
        for: 0m
        labels:
          severity: warn
        annotations:
          summary: "Harvest {{ $labels.harvest }} keeps losing source {{ $labels.source }}."
          description: >-
            One partial harvest is normal: that is how one dead WB endpoint
            does not take down the whole pass. Many partials in a row are not:
            the figures from this source are quietly going stale.

      # The other half of HarvestPartial's exclusion: good news, and the only
      # way anyone learns of it. The nightly pass wrote prices within the last
      # day (so it ran) and not one workspace lost `card-prices` in that day. Both
      # counters move in the same record_harvest_outcome call, so one window
      # covers both, and a worker restart keeps the older samples in range.
      - alert: StorefrontPriceBack
        expr: >-
          sum(increase(harvest_rows_processed_total{harvest="monitoring.nightly",source="price"}[26h])) > 0
          unless
          sum(increase(harvest_partial_total{harvest="monitoring.nightly",source="card-prices"}[26h])) > 0
        for: 1h
        labels:
          severity: warn
        annotations:
          summary: "The WB storefront serves the customer price again."
          description: >-
            For a full day the nightly harvest has not lost the card-prices source.
            Since 2026-09-22 the storefront answered with a captcha (498), and the
            customer price after the WB discount was not collected. Check that it
            is written again, then put card-prices back into the HarvestPartial
            rule and delete this one.

      - alert: CeleryQueueBackingUp
        expr: celery_queue_length{queue_name="celery"} > 50
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} messages have piled up in the Celery queue."
          description: >-
            The worker has four slots. Check whether a task is stuck: if
            celery_queue_length{queue_name="unacked"} stays high while the
            queue itself drains, the work was taken and not finished.

      - alert: TaskFailureRate
        expr: |
          sum by (task_name) (rate(celery_tasks_total{state="failure"}[15m]))
          > 0.05
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "Task {{ $labels.task_name }} keeps failing."

      # The two rules below are about the same failure from opposite ends: the
      # cgroup OOM killer taking a prefork child mid-task. `TaskFailureRate`
      # above cannot see it — three kills in twelve hours is 0.00007/s against
      # a threshold of 0.05 — and until 2026-09-17 nothing else could either:
      # the worker published no memory series at all, so the kills lived only
      # in `dmesg`.
      #
      # `WorkerKilled` is the aftermath and fires on one. That is not a low
      # threshold, it is the right one: the child died with no unwind, the
      # message is acknowledged rather than requeued, and the tasks that had
      # not run yet simply did not happen. On 2026-09-17 the 01:00 finance
      # harvest died on its first seller and the other four waited four hours
      # for the next tick.
      - alert: WorkerKilled
        expr: increase(celery_worker_lost_total[1h]) > 0
        for: 0m
        labels:
          severity: warn
        annotations:
          summary: "Task {{ $labels.task_name }} died together with its worker process."
          description: >-
            The process was killed from outside. The task is not replayed: the
            message is acknowledged, and whatever it had not done stays undone
            until the next tick. First find the signal:
            `docker logs marketplace-analytics-worker-1 | grep "exited with"`.
            signal 9 (SIGKILL) is the kernel acting on memory overuse: look at
            `celery_worker_memory_bytes` for the same hour and
            `dmesg -T | grep -i "killed process"`. The culprit is the baseline, not
            the last task: a Celery child keeps its peak RSS, so the
            same work passes on a fresh worker and fails a few hours later.
            signal 7 (SIGBUS) means the metrics directory
            `/tmp/prometheus-multiproc` (32 MB tmpfs) is full. Then every task
            fails until the worker is restarted; see the
            WorkerMetricsDirFilling alert.

      # The approach, so the kill above stops being the first news. 85% of the
      # ceiling with a fresh pool sitting at ~35% (267 MB of 768 MiB, measured
      # 2026-09-17) is a long way from normal and still leaves room to look.
      # Ten minutes because the growth that matters here is the ratchet across
      # tasks, measured in hours — a task's own spike is not something anyone
      # can act on inside its run.
      - alert: WorkerMemoryNearLimit
        expr: |
          celery_worker_memory_bytes / celery_worker_memory_limit_bytes > 0.85
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "The worker is using {{ $value | humanizePercentage }} of its memory ceiling."
          description: >-
            Not killed yet, but the headroom is running out. A fresh pool
            normally sits at about a third of the ceiling; anything above that is
            the children's accumulated peak plus what the current task holds.
            `--max-memory-per-child` should recycle a child before the kernel
            does, so a figure that stays high means either one task that genuinely
            needs that much, or a parent growing on its own — which it should
            not do.

      # The multiprocess-metrics tmpfs, which fails harder than memory does: a
      # write past its last page is SIGBUS, so the first process to hit it and
      # every one after dies before its task starts. On 2026-10-15 it filled at
      # 04:01 MSK and the worker ran nothing for three hours. Steady state is a
      # few hundred KB; 70% is far from normal and leaves hours, not minutes.
      - alert: WorkerMetricsDirFilling
        expr: |
          celery_worker_metrics_dir_bytes / celery_worker_metrics_dir_size_bytes > 0.7
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "The worker's metrics directory is {{ $value | humanizePercentage }} full."
          description: >-
            When it reaches 100%, every task fails with SIGBUS until the
            worker restarts. Normally it holds a few hundred KB. Check whose
            files are piling up:
            `docker exec marketplace-analytics-worker-1 ls /tmp/prometheus-multiproc`.
            Many `counter_<pid>`/`histogram_<pid>` from different pids mean
            some process imports the app with multiprocess mode on and
            exits. The health check did that until 2026-10-15.
            Urgent: `docker restart marketplace-analytics-worker-1` clears the directory.

  # -------------------------------------------------------------------------
      - alert: SettlementHistoryHasGaps
        expr: finreports_settlement_gap_days > 0
        for: 26h
        labels:
          severity: warn
        annotations:
          summary: "A sales day is not covered by any downloaded report."
          description: >-
            Someone's P&L is missing a day. WB issues one-day supplementary
            reports and starts serving their rows a few days later — by then
            the pass window has moved on. That is how 2026-08-31 went missing
            for all five workspaces, and nobody noticed. The harvest counters do
            not show it: the pass succeeds and writes exactly what it was asked
            for. The only trace is a gap in the report periods. The nightly
            reconciliation takes a workspace with a known gap first, so a
            fixable one closes within a day. Hence `for: 26h`: long enough not
            to fire on a gap that is just waiting for the night, and short
            enough to see a gap the reconciliation cannot reach. WHICH seller
            and WHICH days are in the worker log (`finreports: <name> has N settlement
            day(s) no report covers`); the metric is shared across all of them
            because /metrics may not name a tenant. If it has not cleared
            overnight, the reconciliation cannot reach it: check whether its
            window hit the WB rate limit, and fill the day in by hand with the
            right token.

      - alert: FunnelHistoryHasGaps
        expr: monitoring_funnel_gap_days > 0
        for: 26h
        labels:
          severity: warn
        annotations:
          summary: "A funnel day has sales for a SKU but no WB amounts or cohort."
          description: >-
            Someone's monitoring and heatmap lack the order amount or the
            buyout rate for a day older than the nightly cohort recount window —
            nothing will reread it on its own. That is how 2026-09-07 fell
            between the catch-up load and the nightly pass, and nobody saw it
            for three days. The nightly cohort pass rereads up to two such days
            per workspace a night, so a one-off gap clears by morning; `for: 26h`
            keeps the rule from firing on it. If it fires longer, WB is not
            serving that day: WHO and WHICH days are in the worker log (`monitoring: <name> has N funnel
            day(s)`); the metric is shared across all of them because /metrics
            may not name a tenant.

  - name: wildberries
    rules:
      # `wb_rate_limit_quota_remaining` is deliberately NOT the expression for
      # either rule below, and the reason is worth the paragraph, because the
      # gauge reads like the obvious choice and was the obvious choice until
      # 2026-09-07.
      #
      # That gauge is written only inside `RateGate.observe`, which runs only
      # when a WB response arrives, and nothing ever decays it. WB's bucket
      # refills on a timer; the gauge does not. So the last request of a burst
      # legitimately reports `remaining: 0` — the analytics bucket is three
      # deep, and reaching zero at the end of a burst is pacing WORKING — and
      # that zero then sits there for hours, until the next harvest happens to
      # touch the same endpoint.
      #
      # Measured on prod 2026-09-07: `/adv/v3/fullstats` held 0 for more than
      # 24 hours across 14 requests, every one of which returned 200, and
      # `/api/analytics/v1/stocks-report/wb-warehouses` held 0 for eight hours
      # while receiving four requests in total. Over that window WB returned no
      # 429, no 500, no stall and no `rate_blocked` anywhere. The old rule
      # (`== 0 for 10m`) fired continuously against a completely healthy
      # service.
      #
      # It also FLAPPED, which is the half that turned a false alert into a
      # pager. The gauge is `livemostrecent` across a prefork pool: when a
      # Celery child is recycled, `_mark_process_dead` removes its file and the
      # series stops existing, so the alert resolves; the next child observes
      # the endpoint and it fires again ten minutes later. A resolved/firing
      # pair every few minutes, each one re-sending the whole group, is what
      # that looks like from the receiving end.
      #
      # Both rules below are built on COUNTERS instead. A counter rate decays
      # to zero by itself, cannot be stale, and cannot flap when a series comes
      # and goes with a worker process — the three properties the gauge lacks.
      # The gauge keeps its Grafana panel, where a last-observation is exactly
      # what a human wants to look at.
      - alert: WbRateBudgetExhausted
        expr: |
          sum by (surface, endpoint) (
            rate(wb_api_requests_total{status="rate_blocked"}[15m])
          ) > 0
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "Our limiter is holding back a WB request: {{ $labels.surface }} {{ $labels.endpoint }}."
          description: >-
            `rate_blocked` is OUR limiter refusing to send a request,
            because the token would take longer than allowed to arrive.
            It is the only sign that says outright: the configured
            bucket no longer matches WB's bucket. Every other symptom
            (a stall, a 500) looks the same as a bad token or an outage on
            WB's side. Before changing anything, compare
            `wb_analytics_bucket_capacity` / `_refill_seconds` with what
            `x-ratelimit-remaining` shows on the Grafana panel. On its own
            this is rare and comes in bursts: a 15m rate held for 30m means
            blocks spread over half an hour, not one unlucky harvest. In the
            seven days before 2026-09-07 prod gave only two `rate_blocked`
            answers, both on finance — this rule would not have fired on
            that.

      - alert: WbRatePacingPressure
        expr: |
          sum by (surface, endpoint) (
            rate(wb_rate_limit_wait_seconds_total[30m])
          ) > 2
        for: 30m
        labels:
          severity: warn
        annotations:
          summary: "WB {{ $labels.surface }} {{ $labels.endpoint }} queue: {{ $value | printf \"%.1f\" }} seconds of waiting per second."
          description: >-
            The early warning the quota gauge was meant to be, in a form that
            cannot go stale. The value is seconds of waiting accumulated per
            second of real time. 1.0 means exactly one call is always waiting
            in the queue. For a healthy long harvest from a three-token bucket
            refilling every ~20s that is NORMAL, not a fault. The threshold of 2
            is about twice any healthy peak measured over a day on prod on 2026-09-07
            (finance reportDetailByPeriod 1.02, sales-funnel/products 0.94,
            everything else under 0.12). It means at least two calls are always
            waiting on ONE endpoint. This rises before
            `rate_blocked` does — there is time to widen the window or lower
            the concurrency.

      - alert: WbRateBlockEscalating
        expr: |
          sum by (surface, endpoint) (
            increase(wb_rate_limit_block_seconds_sum[6h])
          ) > 7200
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "WB blocks {{ $labels.surface }} {{ $labels.endpoint }} for longer and longer: {{ $value | printf \"%.0f\" }} seconds of blocks in 6 hours."
          description: >-
            Every block is an event with a duration WB itself named. The
            six-hour sum grows fast in only one scenario: we send a request
            inside a window that is still open, WB restarts the window longer,
            and the cycle repeats. That is exactly how on 2026-09-17 the
            settlement report went from 28,197 s to 302,940 s in three steps,
            and it was seen only two days later, digging through logs.
            The threshold of 7200 is two hours of total blocking in six hours;
            the settlement endpoint's normal rhythm (one block of ~900 s) does
            not reach it.

            What to do: do NOT try by hand. Look at
            `histogram_quantile(1, ...)` over the same metric — if the top
            bucket is growing, the escalation is under way and any request makes
            it worse. The gate already holds the block with a margin and doubles it on a retry
            (`rate_limit_lua.py`, `PENALISE_LUA`); wait until
            `wb_rate_limit_block_seconds_count` stops growing.

      - alert: WbErrorRate
        expr: |
          sum(rate(wb_api_requests_total{status!~"2.."}[10m]))
          / clamp_min(sum(rate(wb_api_requests_total[10m])), 0.001) > 0.25
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "More than a quarter of WB requests are failing."
          description: >-
            This includes transport_error and rate_blocked, deliberately: that
            is exactly how WB breaks here, and these failures have no HTTP status.
            Before deciding the problem is WB rather than one reissued
            token, break it down by surface and status.

  # -------------------------------------------------------------------------
  - name: saturation
    rules:
      - alert: PostgresPoolExhausted
        expr: postgres_pool_connections_free == 0 and postgres_pool_connections_used > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The database pool has no free connections left."
          description: >-
            This has happened before: leaked connections in the `idle in
            transaction` state held every slot for 22 hours. That is why
            src/core/database.py got
            idle_in_transaction_session_timeout. If used hits the ceiling under
            ordinary traffic, look for a leak, not for load.

      - alert: ApiLatencyHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, handler) (rate(http_request_duration_seconds_bucket[10m]))
          ) > 3
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: "p95 response time on {{ $labels.handler }} is over 3 seconds."

      - alert: ServerErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[10m]))
          / clamp_min(sum(rate(http_requests_total[10m])), 0.001) > 0.02
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "More than 2% of responses are 5xx."

      # The share above is blind to one broken page on a quiet service. On
      # 2026-09-29 every SKU card answered 500 for three hours; the first one
      # at 08:30 UTC was a single request in a quiet hour, so the 2 % rule went
      # pending and fell silent again, and it only fired at 10:25 — twelve
      # minutes after users started opening cards, and after one had already
      # written in. Counted per route instead, three 500s on one route in five
      # minutes is a page by itself. `handler` is the route TEMPLATE (unmatched
      # paths are grouped into "none"), so this label is bounded.
      - alert: RouteFailing
        expr: sum by (handler) (increase(http_requests_total{status=~"5.."}[5m])) >= 3
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.handler }} answers 5xx: {{ $value | humanize }} times in 5 minutes."
          description: >-
            One route fails for everyone who opens it. The traceback is in the
            api logs: `docker logs --since 15m marketplace-analytics-api-1 | grep
            "Exception in ASGI"`. If it started with the last deploy, roll the
            release back (backend/scripts/deploy/rollback.sh).

  # -------------------------------------------------------------------------
  # New-organisation history backfill.
  #
  # This group exists because of a failure that produced no alert of any kind.
  # A new org's history arrives as four lanes of self-enqueueing ticks, and a
  # tick that dies before its re-enqueue ends the walk with nothing scheduled
  # to notice: no exception reaches a caller, no work-done counter moves, the
  # lane simply stops. On 2026-09-10 one workspace's P&L lane died on its first tick and
  # sat there for eleven hours until a person happened to look.
  #
  # So these rules alert on the ABSENCE of progress, which is the only shape
  # this failure has, and they distinguish the two cases that need different
  # responses: the system healing itself (stalled, restarted, moving again)
  # from the system failing to (stalled, restarted, still stalled).
  # -------------------------------------------------------------------------
  - name: backfill
    rules:
      - alert: NewOrgBackfillStalled
        # The watchdog sweeps every 15 minutes and a lane is called stalled
        # after 45 minutes without movement, so `for: 1h` means at least two
        # sweeps have seen it and at least one restart has been attempted.
        # Anything shorter alerts on a lane that is about to be healed.
        expr: backfill_lanes_stalled > 0
        for: 1h
        labels:
          severity: page
        annotations:
          summary: "Stalled history backfill lanes: {{ $value }}. A new seller's data is not arriving."
          description: >-
            The lane stopped moving, and the watchdog's restarts did not revive it.
            The seller sees a half-empty product, and nothing else will report
            it. WHO the seller is lives in the logs, not here: metrics do not
            name a tenant. Grafana → Explore → Loki: {service="worker"} |=
            "backfill" — the lane, workspace_id and cursor are on every line.
            Look at the stuck row in `workspaces.workspace_backfill` and at
            `backfill_lane_restarts_total` — whether the watchdog tried at all.
            If the cursor does not move across restarts, the cursor itself is
            the problem, not a random failure.

      - alert: NewOrgBackfillRestartLoop
        # Restarts happening AND the stall persisting. The watchdog is doing
        # its job and the job is not working — which is a different incident
        # from a lane nobody restarted, and the one that needs a human.
        expr: |
          increase(backfill_lane_restarts_total[2h]) >= 3
          and on() backfill_lanes_stalled > 0
        # An hour, not fifteen minutes, and WB sets the number. The P&L lane
        # walked an endpoint served once per ~15 minutes and frequently not
        # served at all (finance-api since 2026-09-22 serves one request a
        # minute, but can still refuse); a tick that finds the window shut records its message
        # and waits. When one of those ticks dies before recording, the lane
        # looks stalled for the 45 minutes `STALE_AFTER` allows, the watchdog
        # restarts it — correctly — and the restart counter moves.
        #
        # Measured 2026-09-13: three pages, each firing for exactly ten
        # minutes and clearing itself, against a lane that was walking
        # normally (281 of 759 windows, message "Wildberries did not serve
        # the page"). A condition that resolves in ten minutes was never one
        # for a person. Restarts that are STILL failing an hour later are.
        for: 1h
        labels:
          severity: page
        annotations:
          summary: "Backfill lane {{ $labels.lane }} is restarted again and again, and stalls again."
          description: >-
            The watchdog restarted it three times or more in two hours, and it
            has not moved. So restarting does not help. The cause is most
            likely a corrupted cursor, a token WB stopped accepting, or a row
            that cannot be written. Before restarting it by hand, read the
            lane's last exception in the worker log — otherwise it goes the
            same way as the last three times.

      - alert: NewOrgBackfillFailing
        # The moment of death rather than its consequence. Fires earlier than
        # the stall alert and is the one that says WHY, because the failure
        # counter moves at the exception and the gauge only moves 45 minutes
        # later.
        expr: increase(backfill_lane_failures_total[30m]) >= 2
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Backfill lane {{ $labels.lane }} failed several times in the last 30 minutes."
          description: >-
            Two or more ticks of this lane ended in an error instead of a step.
            The watchdog keeps restarting it, so it may fix itself. But when
            a lane fails this often, the cause is usually the input data, not
            chance. The exception is in the worker log next to
            workspace_id: {service="worker"} |= "died with".

      - alert: BackfillWatchdogNotRunning
        # The watchdog's own watchdog, and the reason it exists is that every
        # other rule in this group depends on the sweep running. If beat dies,
        # or the task is renamed out from under the schedule, the gauge the
        # other rules read simply stops being written — and a gauge that is
        # never written never crosses a threshold. The whole group would go
        # quiet at exactly the moment it stopped working, which is the failure
        # mode this file exists to refuse.
        #
        # `absent()` is the second half: without it the rule matches nothing
        # when the series has never appeared, which is precisely the "never ran
        # once" case.
        expr: |
          absent(celery_tasks_total{task_name="workspaces.sweep_stalled_backfills"})
          or increase(
            celery_tasks_total{task_name="workspaces.sweep_stalled_backfills"}[2h]
          ) == 0
        for: 30m
        labels:
          severity: page
        annotations:
          summary: "The backfill watchdog has not run for two hours. Nobody restarts stalled lanes."
          description: >-
            `workspaces.sweep_stalled_backfills` is scheduled every fifteen
            minutes and has not run. Every other backfill alert reads a gauge
            only this task writes, so while this fires they are blind. Treat a
            quiet backfill group as unknown, not healthy. Check that Celery beat
            is alive (`docker ps`, then its log) and that the task is still in
            `celery_app.conf.beat_schedule`.

# ---------------------------------------------------------------------------
# Base multi-container topology: the edge (HAProxy, the single entry point) +
# two nginx serving the SPA (frontend, frontend_standby) + FastAPI (api pair)
# + Celery (worker) + PostgreSQL + Redis. The api and worker
# are two `--target`s of ONE Dockerfile (docker/Dockerfile) — same code, same
# resolved dependencies, different entrypoint — sharing the source tree and the
# environment file.
#
# Security posture: this base file publishes ONE service — the edge, on 80
# and 443. nginx, the api, Postgres and Redis are reachable only on the
# internal Docker network; nginx reverse-proxies /api/ to the api container.
# Redis requires a
# password — an open Redis is remote code execution via the Celery broker.
#
# HOW TO RUN IT. From the repository root:
#
#   make up          # build + start          make down     # stop
#   make ps          # status                 make logs     # follow logs
#
# Those wrap `docker compose --project-directory backend -f <this file>`. The
# --project-directory is NOT optional and is the reason the wrappers exist:
# Compose resolves `.env`, `env_file:` and every build context against the
# PROJECT directory, which it infers from the compose file's own location.
# Left to infer, it would look for backend/docker/.env, find nothing, and start
# Postgres and Redis with different passwords than the api and worker read from
# backend/.env — a stack that comes up and then fails to authenticate.
#
# The `${VAR:?...}` forms below make that mistake immediate and self-explaining
# instead: Compose refuses to render the file at all rather than substituting a
# placeholder password.
#
# Local development: docker/docker-compose.override.yml (gitignored; copy it
# from docker-compose.override.yml.example, applied automatically) additionally
# publishes api/Postgres/Redis on loopback for host tooling and the Vite dev
# server.
#
# Production (VPS): the override file does not exist there, so the same
# `make up` runs the closed topology with nothing but the edge's 80 and 443
# exposed.
#
# RESOURCE CEILINGS. Every service caps its memory and CPU because the VPS
# (2 vCPU / 3.8 GB, no swap) hosts more than this stack. Without a cap the
# kernel's OOM killer picks a victim by score, and the victim is as likely to
# be a co-tenant's database as the process that actually ran away. The numbers
# are measured steady-state usage rounded up with headroom — worker 355 MB,
# api 110 MB, postgres 196 MB, beat 110 MB, redis 6 MB, each nginx 6 MB, the
# edge ~12 MB (measured locally, 2026-10-13) — and sum to ~2.5 GB of ceiling
# against ~800 MB of real use. They are ceilings,
# not reservations: nothing is set aside, so deliberate over-subscription of
# the 2 CPUs is fine and intended.
#
# Steady state is not what sizes the worker, though: its ceiling has to clear
# the PEAK of a harvest. That peak used to scale with the seller's history and
# therefore grew on its own over time; it is now bounded by the settlement
# walk's page size. See its `mem_limit` for what happened when it was not.
# ---------------------------------------------------------------------------

name: marketplace-analytic

# ---------------------------------------------------------------------------
# LOG ROTATION, applied to every service below.
#
# The layer that actually protects this disk. A container's stdout is written
# by the Docker daemon, not by the process, so nothing the application does
# can bound it — Python's own RotatingFileHandler (src/core/logging.py) only
# covers a process run OUTSIDE Docker. Left at Docker's default, a json-file
# log grows without limit until the partition is full, and a full partition
# takes Postgres down with it: the noisy day and the outage are the same
# event.
#
# 20 MB x 3 files = 60 MB per service, ~480 MB across the stack at worst. That
# is a ceiling, not a reservation; steady state is a few MB. Sized at the top
# of the 10-20 MB band on purpose — below ~10 MB a single harvest's output can
# rotate away the startup lines that explain it, which is the pairing you most
# want to still have.
#
# Rotation and shipping are independent, and the order matters: Alloy reads
# these same files and forwards to Loki
# (docker-compose.observability.yml), so what is rotated away here has already
# been shipped and is still searchable for Loki's own retention window. What
# stays on disk is the fallback for the case where Loki is the broken thing.
# ---------------------------------------------------------------------------
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 384m
    cpus: 1.0
    # Say WHO in every log line, and log the statements that destroy data.
    #
    # On 2026-09-10 a CI job emptied production's monitoring schema and the
    # database recorded nothing about it — the cause had to be reconstructed
    # from relfilenode numbers and tuple counters. The truncate guard installed
    # after that covers TRUNCATE; `log_statement=ddl` covers the other way a table's
    # contents leave — DROP and ALTER, which fire no trigger. It logs schema
    # changes only, so the cost is a handful of lines per migration rather than
    # one per query.
    #
    # The prefix is what makes those lines answer "who": database role, client
    # address and the application_name the app and the scripts set. `%m` gives
    # the millisecond timestamp that pins an event to a CI job's log.
    command:
      - postgres
      - -c
      - log_statement=ddl
      - -c
      - log_line_prefix=%m [%p] user=%u db=%d app=%a client=%h
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing — run from backend/ via `make up`, or pass --project-directory ..}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketplace}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # No redis `maxmemory` to go with this: Redis is the Celery broker, and an
    # eviction policy there silently drops queued tasks. The container cap is
    # the backstop instead — if Redis ever approaches it, the queue is stuck
    # and we want the crash, not a harvest that quietly loses half its jobs.
    mem_limit: 96m
    cpus: 0.5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?missing — run from backend/ via `make up`, or pass --project-directory ..}
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot migration job: api/worker wait for it to finish successfully.
  # Running migrations here (instead of in every api container's entrypoint)
  # means multiple api replicas can never race each other on DDL.
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    # Same NAME as the api service's image, deliberately. Without it compose
    # tags one image per service, so three services built from `target: api`
    # produced three independent layer sets on disk — and two from
    # `target: worker` produced two. On the containerd image store those layers
    # are extracted, not compressed, which is how 6.9 GB of images became 18 GB
    # of snapshots and eventually a deploy that died on `no space left on
    # device` (2026-09-05).
    image: marketplace-analytic-api:latest
    mem_limit: 384m
    cpus: 1.0
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy

  # Two interchangeable api instances, so a deploy never leaves /api/ unanswered.
  #
  # nginx holds BOTH in one upstream pool and fails a refused request over to the
  # other (../frontend/docker/nginx.conf), and the deploy recreates them one at a
  # time. With a single instance, recreating it took the API down for ~10s
  # (measured 2026-08-17) — longer than the SPA's session bootstrap tolerates, so
  # every deploy threw logged-in users onto /login.
  #
  # `api` carries the definition and `api_standby` merges it, so the two cannot
  # drift: anything that differed between them would make a deploy's behaviour
  # depend on which instance answered.
  api: &api
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    # Shared with `migrate` and, through the anchor, with `api_standby`.
    image: marketplace-analytic-api:latest
    restart: unless-stopped
    logging: *logging
    # Roomier than the 110 MB it idles at: an XLSX export builds the whole
    # workbook in memory before it is sent.
    mem_limit: 512m
    cpus: 1.5
    # How long Docker waits between SIGTERM and SIGKILL. The default is 10s,
    # and it was in force here until 2026-09-10 — which is why a deploy used to
    # cut requests that were mid-flight on the instance being recreated.
    #
    # 30s so uvicorn's own 20s drain always finishes first and the SIGKILL is
    # never reached in practice. What this buys is narrow and worth stating:
    # nginx opens a FRESH connection per proxied request (there is no
    # `upstream{}` block and so no keepalive pool — see
    # frontend/docker/snippets/api-proxy.conf), so the moment uvicorn closes
    # its listener every new request is refused instantly and fails over to the
    # twin. The drain covers only requests already accepted. A request that
    # legitimately runs longer than 20s is still cut.
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      # THE API IS THE ONLY SERVICE THAT MAY RUN AS THE RESTRICTED ROLE.
      #
      # Every service here shares one `.env`, so changing POSTGRES_USER in it
      # would switch `migrate`, `worker` and `beat` too — and both of those
      # legitimately need what the restricted role refuses. `migrate` runs
      # `alembic upgrade head`, which is DDL; the worker's nightly harvests
      # cross every workspace and bind no tenant, so once the row-level
      # security policies are applied their queries would raise. Pointing the
      # shared value at `marketplace_app` would therefore break the next deploy
      # and the next harvest, not just tighten the API.
      #
      # These two overrides are how the API alone changes identity. Unset, they
      # fall through to the shared value and nothing differs — so this is inert
      # until `least_privilege_role.sql` has actually been applied and
      # APP_POSTGRES_USER / APP_POSTGRES_PASSWORD are set in `.env`.
      POSTGRES_USER: ${APP_POSTGRES_USER:-${POSTGRES_USER:-marketplace}}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}
    # --proxy-headers makes request.client reflect X-Forwarded-For from nginx,
    # which is what the request log reports. Trusting any peer is safe here:
    # the port is never published — nginx is the only ingress.
    #
    # Always-trust mode takes the LEFTMOST X-Forwarded-For entry, so this is
    # only sound because proxy-headers.conf sets that header from $remote_addr
    # rather than appending to whatever the client sent. The auth rate limiter
    # does not depend on either: it keys on X-Real-IP via core/client_ip.py, so
    # a mistake in this flag costs log accuracy, not the control.
    # --timeout-graceful-shutdown is half of the drain; `stop_grace_period`
    # below is the other, and the two are only correct as a PAIR. On SIGTERM
    # uvicorn closes the listening socket at once and finishes the requests it
    # already accepted. Without a timeout it would wait for them forever, so a
    # single wedged request would still be holding the process when Docker's
    # grace period ran out — and the SIGKILL that follows drops every
    # connection being drained, which is the failure the drain exists to
    # prevent. The timeout must therefore stay BELOW `stop_grace_period`, and
    # `test_graceful_shutdown.py` fails if that ordering is ever inverted.
    command:
      [
        "uvicorn",
        "main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*",
        "--timeout-graceful-shutdown",
        "20",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The pool's second member. A named service rather than a `--scale` replica:
  # nginx's upstream needs one resolvable name per member, and the deploy has to
  # address them individually to rotate them one at a time.
  api_standby:
    <<: *api

  # THE EDGE: the only service that publishes a port. HAProxy in TCP mode,
  # forwarding :80/:443 to one of the two nginx below so that either can be
  # replaced while the other serves — see docker/edge/haproxy.cfg for why, and
  # the deploy's «THE NGINX ROTATION» for how. TLS is still nginx's.
  edge:
    # Pinned by digest: this is what every stranger talks to. Scanned with the
    # Dockerfiles' base images by .github/workflows/base-image-freshness.yml.
    image: haproxy:3.2.25-alpine@sha256:5d97434a423c2533cfeb42874d45cf6d69a840b60334582dfbfd5008e94c80be
    restart: unless-stopped
    logging: *logging
    # ~35 MB at the config's maxconn; a few MB at real traffic.
    mem_limit: 64m
    cpus: 0.5
    # Internet-facing, so it keeps nothing it could use if subverted: no
    # capabilities (it listens on 8080/8443 inside, so it needs none), no
    # writable filesystem, no privilege gain.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Parameterised ONLY so a throwaway stack can coexist with this one on the
    # same host — the defaults are the production values, so nothing changes
    # here unless something deliberately sets them. Compose MERGES `ports` from
    # an overlay rather than replacing them, so an overlay cannot move these;
    # the variable is the only way for the e2e stack to avoid binding the port
    # production is already serving on.
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:8080"
      - "${FRONTEND_HTTPS_PORT:-443}:8443"
    volumes:
      # The DIRECTORY, not the file. `git pull` replaces a file by writing a
      # new inode, and a single-file bind mount stays on the old one — so a
      # reload after a pull would quietly load the previous config. That is
      # exactly how the Prometheus alert rules went stale once.
      - ./docker/edge:/usr/local/etc/haproxy:ro

  # nginx: serves the built SPA, terminates TLS and reverse-proxies /api/ to
  # the api pair over the internal Docker network (see
  # ../frontend/docker/nginx.conf). Publishes nothing: the edge reaches it on
  # the network, with the client's address in a PROXY protocol header.
  frontend: &frontend
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile
      # NAMED, and it must stay named. An omitted target builds the Dockerfile's
      # LAST stage, which is `e2e` — the self-contained plain-HTTP variant for
      # throwaway stacks. Production would then serve the CI config: no TLS, and
      # a document root pointing at a bundle baked into the image instead of the
      # release directory. It builds and starts cleanly, which is the problem.
      target: runtime
    restart: unless-stopped
    logging: *logging
    mem_limit: 64m
    cpus: 0.5
    # As long as the api's, and for the api's reason. The deploy takes an nginx
    # out of the edge's rotation before replacing it, so no new connection
    # reaches it — but the requests already in flight have nowhere else to go:
    # the edge cannot move an established connection to the twin. This is how
    # long they get to finish (an upload, a slow report) before being cut, and
    # it costs the deploy time, not the site. It was 2 s while this nginx was
    # the only one and every second of stopping was a second of outage.
    stop_grace_period: 30s
    image: marketplace-analytic-frontend:latest
    depends_on:
      # Both members must be up before nginx starts: its upstream block resolves
      # every member's name at load time, and an unresolvable one is a hard
      # config error, not a degraded pool.
      api:
        condition: service_healthy
      api_standby:
        condition: service_healthy
    volumes:
      # The release this nginx serves: the built SPA plus the config that
      # serves it, installed as `releases/<sha>/` with a `current` symlink
      # pointing at one of them (`make frontend-release` stages one locally).
      # Read-only, because nothing in the container writes here — the host
      # does.
      #
      # A host directory rather than a named volume for one reason: the flip is
      # a single atomic rename(2) over the symlink, done from the host where
      # coreutils and python3 are, not from a busybox container. There is no
      # instant at which `current` is missing or half-written.
      #
      # This is what makes a frontend deploy a RELOAD instead of a container
      # recreate. nginx resolves the symlink per request, so new assets are
      # live the moment it flips, and `nginx -s reload` picks up a changed
      # config while finishing in-flight requests on the old workers.
      #
      # Locally, `make frontend-release` stages one — without it nginx has
      # nothing to serve and the container refuses to start.
      - ../.frontend-releases:/srv/frontend:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # The ACME challenge webroot. A HOST directory, because certbot runs on
      # the host and nginx runs in here — a webroot inside the image is one
      # certbot can never write into, which is why renewals were configured
      # `standalone` and would have failed against an nginx already holding
      # port 80. Read-only: nginx serves these files, certbot writes them.
      - /var/www/certbot:/var/www/certbot:ro

  # nginx's twin: the edge's backup, serving everything while `frontend` is
  # out of rotation. The same image, release and certificates — it is merged
  # from the definition above so the two cannot drift apart, as `api_standby`
  # is from `api`.
  frontend_standby:
    <<: *frontend

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    # Shared with `beat`, which runs the same image with a different command.
    image: marketplace-analytic-worker:latest
    restart: unless-stopped
    logging: *logging
    # The largest ceiling in the stack: the harvest prices a settlement window,
    # and this is the only service whose working set is driven by data volume
    # rather than by traffic.
    #
    # Back to 768m, and this time the number stays true. It was raised to 1152m
    # on 2026-08-11 after the cgroup OOM-killed the 08:00 harvest mid-walk
    # (`signal 9`, anon-rss 574 MB in the fork worker alone, plus ~150 MB of
    # parent): `WBFinanceClient.fetch_report` materialised the whole 28-day
    # window as validated rows before anything was ingested, so the peak tracked
    # how much the seller had sold — ~15 KB per settlement row, ~610 MB for that
    # window, and rising on its own with no code change. A raised ceiling only
    # bought time; the same growth would have reached any number written here.
    #
    # The walk is now streamed and ingested a page at a time, so the peak is
    # fixed by `WBFinanceClient._PAGE_LIMIT` instead. (That v5 client is gone
    # since 2026-09-22; `WBFinanceReportsClient` parses its 100 000-row pages
    # as they arrive and commits per batch, so the peak is now set by the
    # batch, `_STREAM_BATCH`, rather than by the page.) Measured over the whole
    # window: +191 / +229 / +226 MB for 20k / 40k / 80k rows — flat, which is
    # the property that makes this ceiling a fact rather than a forecast.
    # 768m clears the ~355 MB steady state plus that peak with room for the
    # content cards held alongside it.
    mem_limit: 768m
    cpus: 1.5
    # Celery treats SIGTERM as a WARM shutdown: it stops fetching new messages
    # and waits for the tasks already running. Docker's default 10s grace was
    # far too short for that to mean anything here, so until 2026-09-10 every
    # deploy SIGKILLed whatever was mid-flight.
    #
    # Killed is not lost — `task_acks_late` means the message was never
    # acknowledged, so Redis hands it back. The catch is WHEN: the broker's
    # `visibility_timeout` decides, it is Celery's default 3600s, and it cannot
    # be lowered to compensate because it must stay above the longest task or
    # Redis redelivers work that is still running. `refresh_buyout_cohorts` is
    # ~1610s measured, so an hour is roughly its floor. A killed task therefore
    # reappeared up to an hour later, which reads as a task that ran twice for
    # no reason.
    #
    # 120s rather than a figure that covers everything: the two long nightly
    # passes (~1610s and the finance walk) would mean a deploy hanging for half
    # an hour against a job with `timeout-minutes: 20`. This covers every
    # interactive task and every harvest tick that found nothing new, and
    # leaves the long nightly ones to the redelivery path they already had.
    # No user traffic touches this container, so the grace costs deploy
    # wall-clock and nothing else.
    stop_grace_period: 120s
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      # The worker is not an ASGI app, so it serves its own Prometheus
      # exposition on :9100 (src/core/observability/celery_runtime.py). NOT
      # published to the host — Prometheus reaches it over this project's
      # internal network, which is the same control that guards the API's
      # /metrics.
      #
      # The prefork pool means the process answering a scrape is not the
      # process that counted the harvest, so the counters live in mmap files
      # both can see. Set here rather than in .env because it is true of the
      # WORKER and false of the api: switching the api into multiprocess mode
      # would make its single process aggregate a directory nothing else
      # writes to, which reads as working and reports subtly different numbers.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
    tmpfs:
      # A tmpfs, and that is the whole staleness control. Counters are
      # cumulative and their files outlive the process, so a container that
      # restarts and finds the previous run's files sums its totals onto
      # them — which Prometheus reads as a traffic spike rather than as a
      # reset. A tmpfs is created EMPTY at container start, so the stale case
      # cannot arise; wiping the directory from Python instead looks
      # equivalent and is not (see `prepare_multiprocess_dir`).
      #
      # RAM-backed and capped: these are a few hundred KB of mmap'd floats,
      # and the cap means a runaway cannot eat into the harvest's 768m.
      - /tmp/prometheus-multiproc:size=32m,mode=1777
      # The healthcheck's count of consecutive failures
      # (`docker/worker_healthcheck.sh`). A tmpfs so the count starts at zero
      # in every container — the restart it triggers must not inherit it.
      - /tmp/healthcheck:size=64k,mode=1777
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Beat scheduler: enqueues the nightly harvest (06:00 MSK). Kept as a
  # single replica so schedules fire exactly once.
  beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    image: marketplace-analytic-worker:latest
    restart: unless-stopped
    logging: *logging
    mem_limit: 192m
    cpus: 0.5
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command:
      - celery
      - -A
      - src.core.celery_app.celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

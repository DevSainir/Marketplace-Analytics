[project]
name = "marketplace-service"
version = "0.1.0"
description = "Marketplace Automation modular monolith (WildBerries harvesting & analytics)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    "passlib>=1.7.4",
    # passlib 1.7.4's bundled bcrypt backend self-test is incompatible with
    # bcrypt >= 4.1 (raises on its internal >72-byte probe). Pin to the last
    # compatible line until passlib ships a fix.
    "bcrypt>=4.0.1,<4.1",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "types-passlib>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "ASYNC", "S", "RUF"]
# B008: FastAPI intentionally calls Query()/Depends() in argument defaults.
# S101: asserts are allowed in tests.
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["N999", "F401"]
# RUF012: SQLAlchemy's __table_args__ dict is a framework-mandated idiom, not a
# mutable class-level default that needs a ClassVar annotation.
"src/modules/**/models.py" = ["RUF012"]
"src/modules/**/models/*.py" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_any_generics = true
warn_redundant_casts = true
mypy_path = "."
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["passlib.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Explicit layout: the importable app is the `src` package plus the top-level
# `main` module. Without this, setuptools auto-discovery fails on the repo's
# multiple top-level directories (src, alembic, scripts, docker).
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

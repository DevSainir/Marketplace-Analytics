[project]
name = "marketplace-analytics"
version = "0.40.0" # x-release-please-version
description = "Analytics for Wildberries sellers: a FastAPI and Celery modular monolith."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # The sync driver Alembic migrates over; the compose `migrate` service
    # runs `alembic upgrade head` inside the app image on every deploy.
    "psycopg[binary]>=3.1",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
    # Outbound mail: email confirmation and password reset.
    # aiosmtplib rather than stdlib smtplib because every I/O path in this
    # backend is async, and a blocking send inside a request handler would
    # stall the whole worker's event loop.
    "aiosmtplib>=3.0",
    # Object storage for A/B variant photos. Not a nicety: the upload happens in
    # the api container and the rotation reads the file back in the WORKER, so a
    # container-local directory means the poller cannot find what the user
    # uploaded — and a named volume would still be wiped by a rebuild. aioboto3
    # rather than boto3 because every I/O path here is async, and a blocking
    # S3 read inside a Celery task body stalls the same loop the WB calls use.
    "aioboto3>=13.0",
    # Spreadsheets (finreports). xlsxwriter (below) does the WRITING — the
    # cost-price workbook export. openpyxl earns its runtime place on the READ
    # side — the cost-price editor accepts an uploaded XLSX back, and
    # xlsxwriter cannot parse. It also reads our own output in tests,
    # verifying with a different library than we write with.
    "openpyxl>=3.1",
    # Reads legacy .xls uploads on the cost-price import (openpyxl only reads the
    # OOXML .xlsx; xlrd 2.0 reads only the old binary .xls — the two cover the
    # spreadsheet a seller might export from an older Excel or 1C).
    "xlrd>=2.0",
    # bcrypt is used directly (src.core.security); passlib was dropped — it is
    # unmaintained and forced an upper pin on bcrypt.
    "bcrypt>=4.0.1",
    "pyjwt>=2.14",
    # Fernet symmetric encryption for per-workspace WB tokens stored in Postgres.
    "cryptography>=42",
    "python-multipart>=0.0.9",
    # Thumbnails for the A/B photos. Measured on production: fourteen variant
    # images are 78.8 MB of PNG, and every surface that shows one draws it at
    # between 24 and 88 CSS pixels. Without a resize the detail page downloads
    # tens of megabytes to paint thumbnails, which is what the reported "takes
    # 10-15 seconds to load" was. Pillow rather than a service: the derivative is
    # made once per image, cached in the same object storage, and never
    # regenerated.
    "pillow>=10.4",
    "xlsxwriter>=3.2",
    # --- Observability ------------------------------
    # structlog is the logging API; stdlib `logging` stays the transport, so
    # uvicorn's, Celery's and SQLAlchemy's own lines go through the SAME
    # processor chain as ours — including the redaction filter. A second
    # pipeline would mean a secret is scrubbed on the lines we write and not
    # on the lines a library writes about the same request.
    "structlog>=24.1",
    # Errors and urgent alerting. The extras are not cosmetic: without them the
    # Celery worker's exceptions arrive with no task context and the API's with
    # no request, which is most of what makes a report actionable.
    "sentry-sdk[celery,fastapi,sqlalchemy]>=2.14",
    # prometheus-client is a direct dependency, not just the instrumentator's:
    # the Celery worker is not an ASGI app and exposes its own exporter through
    # this library's multiprocess mode (the prefork children are separate OS
    # processes and each would otherwise hold its own counters).
    "prometheus-client>=0.20",
    "prometheus-fastapi-instrumentator>=7.0",
    "ijson>=3.5.1",
]

# Development tooling. A PEP 735 dependency-group, not an optional-dependency
# extra: these are not a feature of the published package, they are what you
# need to work ON it. `uv sync` installs them by default; `uv sync --no-dev`
# (and the Docker build) leaves them out entirely.
[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    # Dependency vulnerability audit (CI `quality` gate).
    "pip-audit>=2.7",
    # Writes a legacy .xls in the cost-upload parser tests — xlrd only reads, so
    # the round-trip proof needs a writer. Test-only; never imported by src.
    "xlwt>=1.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "ASYNC", "S", "RUF", "SIM", "RET", "PT", "PTH", "TID"]
# B008: FastAPI intentionally calls Query()/Depends() in argument defaults.
# S101: asserts are allowed in tests.
ignore = ["B008", "S101"]

# Imports are absolute from `src.` (CLAUDE.md). TID252 is what checks it; its
# default only bans `from ..x`, so a sibling `from .x` needs "all". A relative
# import also hides a module boundary from tests/unit/core/test_module_boundaries.py,
# which only recognises the absolute `src.modules.*` spelling.
[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# Every I/O path is async (CLAUDE.md). TID251 is what checks it: the blocking
# client of each service the backend talks to fails lint and names the async
# one. The ASYNC rules above cannot carry this alone — they only look inside an
# `async def` and know nothing of SQLAlchemy or Redis, so a sync helper doing
# the I/O, called from a handler or a task, passed them and would have stalled
# the event loop for its whole round trip. The exceptions are named: Alembic's
# engine and the migration tests (per-file-ignores below), and the sync Redis
# lock the nightly harvest and the scripts that share it take (`# noqa: TID251`
# beside the reason, so the rest of those files stays checked).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sqlalchemy.create_engine".msg = "Blocking engine. Use AsyncSessionLocal from src.core.database."
"sqlalchemy.engine_from_config".msg = "Blocking engine. Use AsyncSessionLocal from src.core.database."
"sqlalchemy.orm.Session".msg = "Blocking session. Use AsyncSession."
"sqlalchemy.orm.sessionmaker".msg = "Blocking session factory. Use async_sessionmaker."
"psycopg".msg = "Blocking driver. Postgres is reached through SQLAlchemy's asyncpg engine."
"psycopg2".msg = "Blocking driver. Postgres is reached through SQLAlchemy's asyncpg engine."
"httpx.Client".msg = "Blocking HTTP client. Use httpx.AsyncClient."
"httpx.request".msg = "Blocking HTTP call. Use httpx.AsyncClient."
"httpx.stream".msg = "Blocking HTTP call. Use httpx.AsyncClient."
"httpx.get".msg = "Blocking HTTP call. Use httpx.AsyncClient."
"httpx.post".msg = "Blocking HTTP call. Use httpx.AsyncClient."
"httpx.put".msg = "Blocking HTTP call. Use httpx.AsyncClient."
"httpx.patch".msg = "Blocking HTTP call. Use httpx.AsyncClient."
"httpx.delete".msg = "Blocking HTTP call. Use httpx.AsyncClient."
"httpx.head".msg = "Blocking HTTP call. Use httpx.AsyncClient."
"httpx.options".msg = "Blocking HTTP call. Use httpx.AsyncClient."
"requests".msg = "Blocking HTTP client. Use httpx.AsyncClient."
"urllib.request".msg = "Blocking HTTP client. Use httpx.AsyncClient."
"redis.Redis".msg = "Blocking Redis client. Use get_redis() from src.core.redis."
"redis.StrictRedis".msg = "Blocking Redis client. Use get_redis() from src.core.redis."
"redis.from_url".msg = "Blocking Redis client. Use get_redis() from src.core.redis."
"boto3".msg = "Blocking S3 client. Use aioboto3."
"smtplib".msg = "Blocking SMTP client. Use aiosmtplib."

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["N999", "F401"]
# TID251: Alembic runs migrations on a sync engine (psycopg); this is where it is built.
"alembic/env.py" = ["TID251"]
# RUF001: the only Cyrillic in the code is the labels WB itself serves in
# Russian, which the code compares character for character, and those files
# are exempted by name — the same list as `_WB_LABELS` in
# tests/unit/core/test_the_repository_is_in_english.py. Anywhere else a
# Cyrillic letter is flagged: it is either untranslated text or a lookalike
# hiding in an English word. Whether a WB label itself is script-pure — that the
# sale label was not typed with one Latin lookalike, which would match nothing
# and drop every sale row — is tests/unit/finreports/test_wb_labels_are_pure_cyrillic.py.
"src/modules/finreports/constants.py" = ["RUF001"]
"src/modules/finreports/services/settlement_upload/workbook.py" = ["RUF001"]
"src/modules/monitoring/models/advertising.py" = ["RUF001"]
"src/core/config/storefront.py" = ["RUF001"]
"alembic/versions/b3d7f18c05ae_pnl_partial_indexes.py" = ["RUF001"]
# RUF012: SQLAlchemy's __table_args__ dict is a framework-mandated idiom, not a
# mutable class-level default that needs a ClassVar annotation.
"src/modules/**/models.py" = ["RUF012"]
"src/modules/**/models/*.py" = ["RUF012"]
# Tests speak their own dialect:
#   S105/S106/S107 — hard-coded "secrets" in tests are fixtures, not credentials.
#   S311           — random is used to shape load, never for cryptography.
#   SLF001         — probing a private helper is legitimate in a unit test.
#   PLR2004        — magic numbers in assertions ARE the expected values.
#   RUF001-003     — WB's Russian labels in tests/support, and Greek letters
#                    where a test proves that a non-Latin alphabet is handled.
#   TID251         — the migration tests drive Alembic, so they build its sync engine.
"tests/**" = [
    "S105", "S106", "S107", "S311", "SLF001", "PLR2004", "RUF001", "RUF002", "RUF003", "TID251",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_any_generics = true
warn_redundant_casts = true
mypy_path = "."
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

# Celery's own process pool, imported for exactly one function: `mem_rss`, the
# high-water RSS figure `--max-memory-per-child` compares after every task. The
# memory histograms read it from here rather than reimplementing it, so that the
# metric and the recycler cannot disagree about what a child weighs.
[[tool.mypy.overrides]]
module = ["billiard.*"]
ignore_missing_imports = true

# The spreadsheet libraries behind the cost-price export and import ship no type stubs.
[[tool.mypy.overrides]]
module = ["openpyxl.*", "xlsxwriter.*", "xlrd.*"]
ignore_missing_imports = true

# Incremental JSON parser, used in exactly one place: streaming WB's settlement
# report so a page's size stops deciding the worker's peak memory. Ships no
# py.typed marker; its surface here is two calls (`sendable_list`, `items_coro`).
[[tool.mypy.overrides]]
module = ["ijson.*"]
ignore_missing_imports = true

# The async S3 client for A/B variant photos ships no py.typed marker. Its
# surface here is three calls (put/get/delete), wrapped behind this repo's own
# MediaStore protocol, so the untyped edge stops at one module.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Every test's directory is its speed tier; tests/conftest.py applies the
# matching marker automatically, so `-m unit` and `-m "not integration"` work
# without anyone decorating a test by hand.
markers = [
    "unit: fast, isolated, no I/O — tests/unit/**",
    "component: real app wiring with persistence faked — tests/component/**",
    "integration: needs a real PostgreSQL/Redis — tests/integration/**",
]
addopts = [
    "--strict-markers",
    "--strict-config",
    # A test that neither asserts nor raises is a false green; surface the
    # slowest ten so the pyramid's shape stays visible.
    "--durations=10",
]
filterwarnings = [
    "error::DeprecationWarning:src.*",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Explicit layout: the importable app is the `src` package plus the top-level
# `main` module. Without this, setuptools auto-discovery fails on the repo's
# multiple top-level directories (src, alembic, scripts, docker).
[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

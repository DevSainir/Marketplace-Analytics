# ---------------------------------------------------------------------------
# Base multi-container topology: nginx SPA (frontend, the single entry point)
# + FastAPI (api) + Celery (worker) + PostgreSQL + Redis. The api and worker
# build from separate Dockerfiles but share the same source tree and
# environment file.
#
# Security posture: this base file publishes ONE host port — frontend:80.
# The api, Postgres and Redis are reachable only on the internal Docker
# network; nginx reverse-proxies /api/ to the api container. Redis requires a
# password — an open Redis is remote code execution via the Celery broker.
#
# Local development: docker-compose.override.yml (gitignored; copy it from
# docker-compose.override.yml.example, applied automatically by `docker
# compose up`) additionally publishes api/Postgres/Redis on loopback for host
# tooling and the Vite dev server.
#
# Production (VPS): the override file does not exist there, so the SAME
# command runs the closed topology with nothing but port 80 exposed —
#   docker compose up -d --build
# ---------------------------------------------------------------------------

name: marketplace-service

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-prod}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marketplace}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis-dev-password}
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot migration job: api/worker wait for it to finish successfully.
  # Running migrations here (instead of in every api container's entrypoint)
  # means multiple api replicas can never race each other on DDL.
  migrate:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Single entry point: nginx serves the built SPA and reverse-proxies /api/
  # to the api container over the internal Docker network (see
  # ../frontend/docker/nginx.conf). Only port published in the base topology.
  frontend:
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/celery.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Beat scheduler: enqueues the nightly harvest (03:00 MSK). Kept as a
  # single replica so schedules fire exactly once.
  beat:
    build:
      context: .
      dockerfile: docker/celery.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command:
      - celery
      - -A
      - src.core.celery_app.celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

# Pre-commit hooks for the marketplace_service monorepo.
#   backend/  -> Python 3.12 (ruff lint+format, mypy strict)
#   frontend/ -> Vue 3 (eslint)
#   commit-msg -> Conventional Commits (commitizen)
#
# Install once after cloning:
#   pre-commit install                 # installs pre-commit + commit-msg hooks
# Run against everything:
#   pre-commit run --all-files

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------- hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: mixed-line-ending
      # Датапак финмодели — 1 МБ измеренных цифр за окно P&L, уже минифицированный
      # и колоночный. Страница /labs/finmodel читает его запросом из public/, так
      # что в бандл он не попадает, но лежать обязан в репозитории: без него
      # страница пустая. Исключение точечное — планка в 500 КБ остаётся для всего
      # остального.
      - id: check-added-large-files
        exclude: ^frontend/public/labs/finmodel/datapack\.json$
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key

  # -------------------------------------------------------- Python: ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        name: ruff (lint + autofix)
        args: [--fix]
        files: ^backend/.*\.py$
      - id: ruff-format
        name: ruff (format)
        files: ^backend/.*\.py$

  # PATH for `language: system` hooks
  # ---------------------------------
  # These hooks shell out to tools (`uv`, `npx`) that live in per-user install
  # dirs. pre-commit runs them under whatever PATH git inherited — and when git
  # is launched from a non-login shell (an IDE's Git integration, a `make`
  # recipe, a cron/agent) that PATH does NOT include ~/.local/bin, where the
  # standalone `uv` installer puts uv. The hook then dies with
  # `exec: uv: not found` and the commit is blocked with a confusing error.
  # Every system hook below therefore prepends the standard tool-install dirs
  # so the tool resolves no matter how git was invoked. Keep this in sync across
  # the three entries.

  # -------------------------------------------------------- Python: mypy
  # Runs from within backend/ so `src.*` absolute imports and the
  # [tool.mypy] block in backend/pyproject.toml resolve correctly.
  #
  # Through `uv run`, so the hook typechecks against the SAME locked
  # environment as CI. It used to carry its own `additional_dependencies` list
  # — a second, hand-maintained copy of the project's dependencies that could
  # (and did) resolve different versions than the lock, making the hook and CI
  # disagree about whether the code typechecks. uv syncs backend/.venv on
  # demand, so this still needs no manual virtualenv.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend, strict)
        language: system
        # main.py and scripts/ are checked too: scripts/ runs against
        # production data, and an unchecked one had a broken import
        # (`_discover_and_harvest`) that only failed when someone ran it.
        entry: bash -c 'export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"; cd backend && exec uv run mypy src main.py scripts'
        pass_filenames: false
        require_serial: true
        files: ^backend/.*\.py$

  # ------------------------------------------------------ Frontend: eslint
  # Uses the frontend's own flat config + node_modules via npx.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        language: system
        entry: bash -c 'export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"; cd frontend && exec npx --no-install eslint src tests'
        pass_filenames: false
        files: ^frontend/(src|tests)/.*\.(vue|js|ts|jsx|tsx|cjs|mjs)$

      # Prettier was configured but run by nothing — not here, not in CI — so
      # seven files had drifted. Rewriting in place (like ruff-format above)
      # rather than --check keeps it out of the way on work in progress.
      - id: prettier
        name: prettier (frontend)
        language: system
        entry: bash -c 'export PATH="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"; cd frontend && exec npx --no-install prettier --write src tests'
        pass_filenames: false
        files: ^frontend/(src|tests)/.*\.(vue|js|ts|jsx|tsx|cjs|mjs|json|css|md)$

  # ------------------------------------------------ Conventional Commits
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.16.4
    hooks:
      - id: commitizen
        name: conventional-commit check
        stages: [commit-msg]

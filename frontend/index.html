<!doctype html>
<html lang="ru" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` lets the canvas run edge to edge under the Dynamic
         Island and the home indicator, which is why the layout must pay for the
         safe areas itself — see `.app-container` / `.pt-safe` / `.pb-safe`
         in src/assets/main.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Design-system typeface: Inter Tight (see design_system.md / tailwind
         fontFamily.sans). Self-hosted from src/assets/fonts/ rather than loaded
         from Google's CDN — the CSP names no third party, no visitor's IP is
         handed to Google on page load, and the page renders when Google is
         unreachable (register P1.8). No preconnect: there is nothing to
         connect to but ourselves. -->
    <title>Аналитика маркетплейса — Wildberries</title>
  </head>
  <body class="h-full">
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

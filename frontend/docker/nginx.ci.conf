# ---------------------------------------------------------------------------
# Plain-HTTP nginx for throwaway stacks: CI's end-to-end job, and any local
# `docker compose up` that has no certificate.
#
# WHY THIS FILE EXISTS. The production config (nginx.conf) terminates TLS for
# example.com and hard-requires the Let's Encrypt key pair mounted from the
# host. Nowhere but the VPS has those files, so nginx does not merely serve the
# wrong thing without them — it refuses to load the configuration at all
# (`nginx -t`: "cannot load certificate ... no such file"), the container
# restart-loops, and every request fails with a connection error that looks like
# a broken application.
#
# The second trap this file avoids: production also answers only to
# `server_name example.com`. A request for `http://localhost/` fell through
# to the port-80 redirect server and was answered `301 https://localhost/` —
# which `curl -sf` reports as SUCCESS (it fails only on >= 400 and does not
# follow redirects), so a health gate could pass against a stack that serves
# nothing. Here the SPA is served directly, on any Host, with no redirect
# anywhere, so a 200 means a 200.
#
# Everything else — the /api/ reverse proxy, the cache policy, the security
# headers — is deliberately identical to production, so the browser tier
# exercises the same behaviour it will meet in the real deployment.
# ---------------------------------------------------------------------------

server {
    listen 80 default_server;
    server_name _;

    # HSTS is absent on purpose: it is meaningless over plain HTTP, and pinning
    # a browser to HTTPS for a host that has no certificate is actively harmful.
    include /etc/nginx/snippets/security-headers.conf;

    root /usr/share/nginx/html;
    index index.html;

    # Request-body ceilings. nginx's default is 1 MB, which was never set here
    # deliberately: it silently capped every endpoint AND made the 32 MB A/B
    # photo upload impossible in production, while the app's own size checks ran
    # only after the whole body had been read into memory.
    #
    # So the limit is small by default and raised only where a large body is the
    # point. The two upload routes are named explicitly rather than lifting the
    # ceiling for the whole API: a 33 MB JSON body reaching pydantic is CPU and
    # memory a caller should not be able to ask for on a 512 MB container.
    client_max_body_size 1m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Container healthcheck target — also what CI polls to decide the stack is up.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same two-backend failover as production, so the browser tier exercises the
    # path a deploy's rotation actually takes. Kept in step deliberately: a
    # difference here would mean e2e proves a proxy nobody runs.
    location /api/ {
        client_max_body_size 4m;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # The two endpoints that legitimately take a large body: the A/B photo (32 MB,
    # the ceiling WB itself enforces) and the cost-price workbook (10 MB, checked
    # again in the app). A regex location is matched BEFORE the /api/ prefix one,
    # so these two win and everything else keeps the tighter ceiling above.
    #
    # 33m rather than 32m: multipart framing adds a boundary and headers around
    # the file, so a file exactly at the app's limit must still fit here or the
    # caller gets nginx's 413 instead of the app's message.
    location ~ ^/api/(?:ab-tests/[^/]+/variants|v1/finreports/cost-prices/import)$ {
        client_max_body_size 33m;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    location @api_twin {
        # See nginx.conf: the size decision is made by the matching location.
        client_max_body_size 33m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_twin http://api_standby:8000;
        proxy_pass $api_twin$request_uri;
        include /etc/nginx/snippets/proxy-headers.conf;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

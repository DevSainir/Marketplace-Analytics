# ---------------------------------------------------------------------------
# Nginx single entry point for the SPA.
#
# - Terminates TLS for example.com on port 443 (Let's Encrypt certs are
#   mounted read-only from the host at /etc/letsencrypt — see docker-compose.yml).
# - Port 80 does nothing but 301-redirect to https, except the ACME challenge
#   path and the container healthcheck.
# - Serves the built Vite `dist`.
# - `try_files ... /index.html` supports the HTML5 History API: deep links
#   (/monitoring, /login) fall back to the SPA shell instead of 404.
# - Everything under /api/ is transparently proxied to the FastAPI container
#   over the internal Docker network. The backend mounts its routers under the
#   same /api prefix, so the URI is passed through UNCHANGED (no rewrite) —
#   `proxy_pass` deliberately carries no path component.
# ---------------------------------------------------------------------------

# Plain HTTP: redirect everything to HTTPS.
server {
    listen 80;
    server_name example.com www.example.com;

    # Container healthcheck (Dockerfile HEALTHCHECK) hits this over plain HTTP,
    # so it must NOT redirect — a 301 to https://localhost would fail cert
    # validation (the cert is for example.com, not localhost).
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Certbot webroot renewals (`certbot renew --webroot -w /usr/share/nginx/html`)
    # must be reachable over HTTP; serve the challenge instead of redirecting.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate TLS and serve the app.
server {
    listen 443 ssl;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Tell browsers to stick to HTTPS for the next two years.
    add_header Strict-Transport-Security "max-age=63072000" always;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses; hashed Vite assets are large enough to matter.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API reverse proxy — `api` resolves via the Docker network. The port is
    # internal only; nothing is published on the host (see docker-compose.yml).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Content-hashed build artifacts are immutable: cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA shell: any unknown path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached, or users keep stale asset manifests
    # after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}

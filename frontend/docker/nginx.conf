# ---------------------------------------------------------------------------
# Nginx single entry point for the SPA.
#
# - Terminates TLS for example.com on port 443 (Let's Encrypt certs are
#   mounted read-only from the host at /etc/letsencrypt — see docker-compose.yml).
# - Port 80 does nothing but 301-redirect to https, except the ACME challenge
#   path and the container healthcheck.
# - Serves the built Vite `dist`.
# - `try_files ... /index.html` supports the HTML5 History API: deep links
#   (/monitoring, /login) fall back to the SPA shell instead of 404.
# - Everything under /api/ is transparently proxied to the FastAPI container
#   over the internal Docker network. The backend mounts its routers under the
#   same /api prefix, so the URI is passed through UNCHANGED (no rewrite).
#   /api/ has two interchangeable backends: a request that cannot reach the
#   first is retried against the second, so one can be recreated mid-deploy
#   without dropping requests — see the /api/ location and @api_twin. When
#   NEITHER can be reached — a host reboot, where both boot together — the
#   request ends at @api_down as a 503 with Retry-After and a JSON body the
#   SPA understands, rather than nginx's stock 502 HTML.
# - Is not reached from the internet directly. The edge (HAProxy, see
#   backend/docker/edge/haproxy.cfg) holds :80/:443 and forwards to one of two
#   copies of this nginx, `frontend` and `frontend_standby`, so either can be
#   replaced while the other serves.
# ---------------------------------------------------------------------------

# THE CLIENT'S ADDRESS. Every connection arrives from the edge, so the peer
# address is the edge's own — for every request. Left alone, that is the
# address X-Real-IP is written from (snippets/proxy-headers.conf), which is
# what the login limiter keys on: every user would share one budget, and one
# stranger's failed logins would lock everybody out (HARDENING P0.1). Every
# `limit_req` here would become global the same way.
#
# So the public listeners below require a PROXY protocol header — the edge
# sends one with the address it accepted the connection from — and this makes
# $remote_addr that address. `set_real_ip_from` is whose header to believe:
# the private ranges, because the edge's address on the Docker network is not
# fixed, and only the Docker network can reach these listeners — no nginx
# publishes a port. The pairing is held by
# backend/tests/unit/core/test_edge_ingress.py.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header proxy_protocol;

# HEALTH, on its own port and WITHOUT a PROXY header — the one listener that
# does not expect one, because neither checker sends it: the edge probes this
# to decide where to route, and the Docker HEALTHCHECK
# (frontend/docker/Dockerfile) to decide whether the container is healthy.
# Answering here says "this nginx is up and has loaded its config", and
# nothing behind it is consulted — a slow database must not take an nginx out
# of rotation. Not published, and it serves nothing else.
server {
    listen 8081;
    access_log off;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}

# Plain HTTP: redirect everything to HTTPS.
server {
    listen 80 default_server proxy_protocol;
    server_name example.com www.example.com grafana.example.com;

    include /etc/nginx/snippets/security-headers.conf;

    # Answered rather than redirected, as it was while the container's own
    # healthcheck probed it here (that moved to :8081 above, because this
    # listener now expects a PROXY header). Kept for anything outside that
    # still asks http://example.com/healthz.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Certbot webroot renewals must be reachable over HTTP; serve the challenge
    # instead of redirecting.
    #
    # `/var/www/certbot` is a HOST directory bind-mounted in read-only (see
    # docker-compose.yml), and that mount is the whole point: certbot runs on
    # the host and nginx runs in a container, so a webroot inside the image is
    # a directory certbot can never write to.
    #
    # This was previously rooted at the image's own html directory while the
    # renewal config said `authenticator = standalone` — a combination in which
    # NEITHER path works. Standalone wants port 80 to itself and nginx holds it,
    # so every automatic renewal would have failed; the certificate issued on
    # 2026-07-14 was heading for expiry on 2026-10-12 with the first failed
    # attempt due around 2026-09-12. Nothing would have reported it until the
    # site stopped loading.
    #
    # ACME validation is performed by Let's Encrypt's servers, which are not
    # browsers and do not honour HSTS, so serving this over plain HTTP works
    # despite the `includeSubDomains` promise below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: terminate TLS and serve the app.
server {
    listen 443 ssl proxy_protocol;
    http2 on;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # The default header set. Locations that declare their own `add_header`
    # must re-include it — nginx drops inherited headers there (see the snippet).
    include /etc/nginx/snippets/tls-headers.conf;

    # /api/ fails over TWICE: the matched location falls to @api_twin, and the
    # twin falls to @api_down. nginx follows only ONE error_page redirect unless
    # this is on, so without it the second hop is silently skipped and a
    # both-down request still ends as a raw 502 — the exact thing @api_down
    # exists to replace. Bounded at 10 redirects by nginx; this chain is 2.
    recursive_error_pages on;

    root /srv/frontend/current/html;
    index index.html;

    # Request-body ceilings. nginx's default is 1 MB, which was never set here
    # deliberately: it silently capped every endpoint AND made the 32 MB A/B
    # photo upload impossible in production, while the app's own size checks ran
    # only after the whole body had been read into memory.
    #
    # So the limit is small by default and raised only where a large body is the
    # point. The two upload routes are named explicitly rather than lifting the
    # ceiling for the whole API: a 33 MB JSON body reaching pydantic is CPU and
    # memory a caller should not be able to ask for on a 512 MB container.
    client_max_body_size 1m;

    # Compress text responses; hashed Vite assets are large enough to matter.
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # The READINESS probe, for the external uptime checker (Better Stack).
    #
    # Three health endpoints exist and they are not interchangeable:
    #
    #   * the `/healthz` on the port-80 server above — nginx's own, a static
    #     "ok" for the frontend container's Docker HEALTHCHECK. Nothing behind
    #     nginx is consulted, which is correct there: it answers "is nginx
    #     serving", and a 301 to https would fail the container's own probe.
    #   * `/health` on the api — static liveness. Docker restarts a container
    #     that fails it, which is exactly why it must NOT touch a database:
    #     a Postgres outage would otherwise restart every healthy API process.
    #   * this one — readiness. It pings Postgres and Redis and answers 503 if
    #     either is unreachable, which is the fact an external checker exists
    #     to notice.
    #
    # Proxied WITHOUT the /api/ prefix because that is the URL an uptime
    # checker is given, and because the same failover applies: a request that
    # cannot reach the primary is retried against the twin, so a deploy's
    # rotation does not read as an outage in somebody else's dashboard.
    #
    # `access_log off`: polled every 30 s forever, and its own line in the
    # nginx log would be most of the nginx log.
    location = /healthz {
        access_log off;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # API reverse proxy. Neither api port is published on the host; nginx is the
    # only ingress (see docker-compose.yml). The proxy body itself lives in
    # snippets/api-proxy.conf, shared with the upload location below.
    #
    # This replaced a per-request `resolver` + variable form whose purpose was to
    # survive the api container getting a new IP. The pool solves that better: it
    # has somewhere to fail over TO, so a recreated instance costs a retry
    # instead of 502-ing every request until nginx restarted.
    location /api/ {
        # JSON bodies only. The widest legitimate one is a matrix working copy
        # (a year of day columns), which is well under a megabyte.
        client_max_body_size 4m;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # The two endpoints that legitimately take a large body: the A/B photo (32 MB,
    # the ceiling WB itself enforces) and the cost-price workbook (10 MB, checked
    # again in the app). A regex location is matched BEFORE the /api/ prefix one,
    # so these two win and everything else keeps the tighter ceiling above.
    #
    # 33m rather than 32m: multipart framing adds a boundary and headers around
    # the file, so a file exactly at the app's limit must still fit here or the
    # caller gets nginx's 413 instead of the app's message.
    location ~ ^/api/(?:ab-tests/[^/]+/variants|v1/finreports/cost-prices/import)$ {
        client_max_body_size 33m;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # WB's weekly report, uploaded by hand: the zip WB hands out is stored, not
    # compressed, at about half a kilobyte a row, and NEVA's largest week (71 539
    # rows) is ~36 MB. The app refuses past 48 MB; 49m for the multipart framing.
    location = /api/v1/finreports/settlement-uploads {
        client_max_body_size 49m;
        include /etc/nginx/snippets/api-proxy.conf;
    }

    # The other instance, reached the same way. Kept as a named location rather
    # than an `upstream` pool because an upstream member's name is resolved when
    # the CONFIG LOADS: with a pool, an api container that failed to start would
    # stop nginx from starting at all — the whole site down instead of degraded,
    # on a 2 GB host where a failed start is a real possibility. Verified: nginx
    # refuses to load with `host not found in upstream`. Here an unresolvable name
    # costs one request, not the site.
    location @api_twin {
        # Permissive on purpose, and not a hole: the body is read — and any
        # oversized one rejected — in the location that MATCHED the request,
        # before nginx ever connects upstream. A failover cannot revisit a
        # decision already made, and a tight value here would only risk
        # rejecting an upload the matching location had already accepted.
        client_max_body_size 49m;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_twin http://api_standby:8000;
        proxy_pass $api_twin$request_uri;
        include /etc/nginx/snippets/proxy-headers.conf;

        # Both instances refused the connection; there is nothing left to try.
        # Answer in the SPA's own dialect instead of nginx's stock 502 — see
        # @api_down for what that buys and why it is not cosmetic.
        error_page 502 503 = @api_down;
    }

    # The end of the line: primary unreachable AND twin unreachable.
    #
    # The two-instance pool survives a DEPLOY, where the instances are recreated
    # one at a time and one is always serving. It cannot survive a HOST reboot:
    # `api` and `api_standby` share one startup gate in docker-compose.yml
    # (migrate completed, postgres and redis healthy), so they become ready
    # within milliseconds of each other and the failover has nowhere to land.
    # Measured on 2026-09-07, on a kernel-upgrade reboot: ~48 s with both
    # refusing, on top of ~90 s of host and Docker boot.
    #
    # For that window nginx used to emit its stock 502 HTML page. Three things
    # were wrong with it, none of them cosmetic:
    #
    # * 502 means "the upstream answered with garbage" — a server fault, and one
    #   an uptime checker is right to wake somebody for. 503 means "not right
    #   now, come back", which is what is actually true while a container boots.
    # * the body was HTML. Every caller that gets here is the SPA's Axios
    #   client, and extractErrorMessage() looks for the `{error: {code, message}}`
    #   envelope — given markup it falls through to a generic string. Answering
    #   in the envelope means the user reads a sentence about a restart rather
    #   than «Непредвиденная ошибка».
    # * nothing said when to come back. Retry-After is exactly that, in the form
    #   a machine can read.
    #
    # This does not shorten the outage; it stops the outage from looking like a
    # broken application. The auth store already treats any non-401/403 failure
    # as transient and retries the session bootstrap for ~28 s
    # (src/modules/auth/store.js), so the first half of a reboot becomes a
    # spinner instead of a bounce to /login.
    location @api_down {
        # nginx drops inherited headers in any location that adds its own.
        include /etc/nginx/snippets/tls-headers.conf;
        add_header Retry-After 15 always;
        add_header Cache-Control "no-store" always;
        default_type application/json;
        return 503 '{"error":{"code":"service_starting","message":"Сервис перезапускается. Повторите попытку через несколько секунд."}}';
    }

    # Content-hashed build artifacts are immutable: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/tls-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # SPA shell: any unknown path is a client-side route, served by index.html.
    #
    # The no-cache header lives HERE, not in a `location = /index.html`, because
    # a `try_files` file fallback is served from within the SAME location — it
    # never re-enters an exact-match block. With the header over there, every
    # deep link (/monitoring, /login) — i.e. every URL a user actually visits —
    # was served cacheable, so a browser could keep a stale asset manifest after
    # a deploy and load JS chunks that no longer exist. That is precisely the
    # failure the directive exists to prevent.
    #
    # Applying it to the whole location also covers the few unhashed root files
    # (favicon.svg, robots.txt), which should revalidate anyway. Hashed assets
    # keep their year-long cache in the /assets/ block above.
    location / {
        include /etc/nginx/snippets/tls-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# Grafana, on its own host.
#
# A SUBDOMAIN rather than a path under the app, and the reason is the cookie
# jar. Served as `example.com/grafana/`, Grafana would share an origin
# with the customer-facing SPA — so a flaw in Grafana would sit inside the same
# origin as the session that authenticates real sellers, and the app's CSP
# would have to be loosened to let Grafana's own bundle run. A separate host
# costs one DNS record and one name on the certificate, and buys a boundary
# the browser enforces for us.
#
# What is NOT exposed here: Prometheus, Loki, Alertmanager and the worker's
# exporter stay on the internal Docker network with no ingress at all. Grafana
# is the only one a person needs, and it is the only one published.
# ---------------------------------------------------------------------------

# Grafana Live (log tailing, streaming panels) upgrades to a WebSocket. Without
# this map the connection is proxied as a plain request and the tail silently
# never updates — which looks like "there are no logs", the exact confusion
# this whole dashboard has already caused once.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Password guessing, bounded. Grafana is reachable from the internet now, so
# its login endpoint is a brute-force surface in a way it was not behind an SSH
# tunnel. One request per second with a small burst is far above what a person
# does and far below what a script needs; the zone is 1 MB, which holds roughly
# 16k addresses.
limit_req_zone $binary_remote_addr zone=grafana_login:1m rate=1r/s;

# 429, not nginx's default 503. A 503 says "this server is broken", which is
# what a monitoring tool answering 503 would have somebody investigating the
# monitoring; 429 says "you are going too fast", which is true and actionable.
# It also keeps the meaning consistent with the API's own throttle (P0.1).
limit_req_status 429;

server {
    listen 443 ssl proxy_protocol;
    http2 on;
    server_name grafana.example.com;

    # The same certificate as the apex — one cert covering every host this
    # deployment serves, so there is one thing to renew rather than several
    # things to forget.
    #
    # THAT CERTIFICATE MUST ACTUALLY CARRY THIS NAME. It is a separate act from
    # writing this server block, and the two drifted: as of 2026-09-07 the cert
    # held `example.com` and `www.example.com` only, so this block was
    # serving a certificate that does not match its own server_name. A browser
    # rejects that outright, and HSTS `includeSubDomains` (tls-headers.conf) is
    # already promised for the apex — so the warning is not click-through-able
    # and the subdomain is hard-broken rather than degraded until the cert is
    # expanded:
    #
    #     certbot certonly --webroot -w /var/www/certbot --expand \
    #       -d example.com -d www.example.com -d grafana.example.com
    #
    # DNS for the name has to resolve BEFORE that runs — HTTP-01 validation
    # reaches the host by resolving it, so requesting the cert first simply
    # fails. See docs/monitoring/OBSERVABILITY.md for the ordered procedure.
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/snippets/grafana-headers.conf;

    # Dashboards and datasource queries are small; nothing here uploads.
    client_max_body_size 2m;

    # The login form, throttled. A separate location purely so the rate limit
    # applies to the credential check and not to the dashboard traffic of
    # somebody already signed in — a limit on `/` would throttle a legitimate
    # session refreshing panels every 30s.
    location /login {
        limit_req zone=grafana_login burst=5 nodelay;
        include /etc/nginx/snippets/grafana-headers.conf;
        include /etc/nginx/snippets/grafana-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/grafana-proxy.conf;
    }
}

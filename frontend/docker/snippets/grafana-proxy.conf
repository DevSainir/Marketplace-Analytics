# The proxy hop to Grafana, shared by the login location and the catch-all so
# the two cannot drift.
#
# `resolver` + a variable, never a bare `proxy_pass http://grafana:3000`, and
# this is the important line in the file. nginx resolves an upstream named
# directly in `proxy_pass` when the CONFIG LOADS — so with Grafana stopped,
# nginx would refuse to start with "host not found in upstream" and take the
# customer-facing site down with it. The monitoring must never be able to do
# that. Resolved per request instead, an absent Grafana costs a 502 on this
# host and nothing else. Same pattern, same reason, as @api_twin above.
#
# Grafana also lives in a DIFFERENT compose project now
# (`marketplace-analytic-observability`), joined to this network from outside. Compose
# gives every container a network alias equal to its service name and Docker's
# embedded DNS resolves those across projects, so `grafana` still answers here.
resolver 127.0.0.11 valid=10s ipv6=off;
set $grafana_upstream http://grafana:3000;
proxy_pass $grafana_upstream$request_uri;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Grafana Live tails logs over a WebSocket; without the upgrade headers the
# stream is proxied as an ordinary request and simply never delivers anything.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Long enough for a slow Loki range query over 14 days of logs, short enough
# that a wedged backend is not held open forever.
proxy_connect_timeout 5s;
proxy_read_timeout 120s;

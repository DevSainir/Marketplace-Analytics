# ---------------------------------------------------------------------------
# The full header set for the TLS server: everything in security-headers.conf
# plus HSTS.
#
# Included at server level AND in every location that declares its own
# `add_header` — see the explanation in security-headers.conf for why nginx
# forces that repetition.
# ---------------------------------------------------------------------------

include /etc/nginx/snippets/security-headers.conf;

# Tell browsers to stick to HTTPS for the next two years.
add_header Strict-Transport-Security "max-age=63072000" always;

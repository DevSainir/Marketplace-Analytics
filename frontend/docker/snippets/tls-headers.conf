# ---------------------------------------------------------------------------
# The full header set for the TLS server: everything in security-headers.conf
# plus HSTS.
#
# Included at server level AND in every location that declares its own
# `add_header` — see the explanation in security-headers.conf for why nginx
# forces that repetition.
# ---------------------------------------------------------------------------

include /etc/nginx/snippets/security-headers.conf;

# Tell browsers to stick to HTTPS for the next two years, for this host AND
# every subdomain of it.
#
# `includeSubDomains` is the half that is hard to take back: a browser that has
# seen this header will refuse plain HTTP for *.example.com for the full
# max-age, and there is no way to reach a client and tell it otherwise. So the
# standing requirement is that every subdomain — including ones added later —
# is served over TLS. Verified before switching on (2026-08-29): the apex and
# `www` were the only hosts served, both terminate TLS here, and both already
# 301 plain HTTP.
#
# `grafana.example.com` joined them since, and it is the worked example of
# why this paragraph is a REQUIREMENT rather than a note. Adding a subdomain is
# three separate acts — a DNS record, a name on the certificate, and a server
# block — and this header decides what a browser does when they are out of
# step. Without HSTS a name-mismatched certificate is a warning somebody can
# click through; with it the browser refuses, and there is no plain-HTTP
# fallback to limp along on either. HTTP-01 validation forces DNS to come
# first, so the name IS hard down for the minutes between the record resolving
# and the certificate being expanded. Plan for that gap; never publish a
# subdomain here intending to fix its certificate at leisure.
#
# `preload` is deliberately NOT set. It hands the same promise to browser
# vendors' built-in lists, where removal takes months rather than a max-age, and
# it is not worth that for the one subdomain this deployment has.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# ---------------------------------------------------------------------------
# Response security headers, safe on both the TLS and plain-HTTP servers.
#
# WHY THIS IS AN INCLUDE AND NOT A SERVER-LEVEL BLOCK:
# nginx's `add_header` is not additive across levels — a `location` that
# declares ANY `add_header` of its own discards every one inherited from the
# server block. So a server-level list silently vanishes from exactly the
# locations that set their own cache headers. Every such location includes this
# file instead, which is the only way to keep the set complete.
#
# HSTS is deliberately NOT here: it belongs only to the TLS server (sending it
# over plain HTTP is meaningless and the CI overlay has no certificate). See
# tls-headers.conf.
#
# The CSP is derived from what the built bundle actually loads:
#   * script-src 'self'        — Vite pre-compiles templates, so no eval and no
#                                inline script survives the build (verified: the
#                                emitted index.html carries only a module src).
#   * style-src  'unsafe-inline' + fonts.googleapis.com
#                              — PrimeVue injects theme <style> elements at
#                                runtime, and index.html pulls the Inter Tight
#                                stylesheet from Google Fonts.
#   * font-src   fonts.gstatic.com + data: — where that stylesheet fetches from.
#   * connect-src 'self'       — the API is same-origin through /api/.
# Adding an external host to the app means adding it here too, or the browser
# blocks it.
# ---------------------------------------------------------------------------

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

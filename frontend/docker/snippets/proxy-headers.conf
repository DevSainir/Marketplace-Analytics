# Headers every /api/ proxy hop sets, shared so the primary and its twin cannot
# drift. X-Forwarded-For is what the backend's per-IP auth rate limiter keys on
# (uvicorn runs with --proxy-headers), so a hop that forgot it would put every
# user on one shared budget.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Connect fast so a failover costs about a second rather than a minute.
proxy_connect_timeout 2s;

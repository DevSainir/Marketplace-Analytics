# Headers every /api/ proxy hop sets, shared so the primary and its twin cannot
# drift. X-Real-IP is what the backend's per-IP auth rate limiter keys on, so a
# hop that forgot it would put every user on one shared budget.
#
# Both address headers are set from $remote_addr, never from what arrived:
# `proxy_set_header` REPLACES the client's value, whereas the
# $proxy_add_x_forwarded_for used here previously APPENDED to it. uvicorn runs
# with --forwarded-allow-ips "*", and in that always-trust mode it reads the
# LEFTMOST X-Forwarded-For entry — so an appended chain let any client pick its
# own request.client.host, and with it its own rate-limit bucket.
#
# When a CDN is put in front of this (register item P2.3), do not reintroduce
# the chain: give nginx `set_real_ip_from <cdn ranges>` and `real_ip_header`, so
# $remote_addr itself becomes the true client and everything below still holds.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Connect fast so a failover costs about a second rather than a minute.
proxy_connect_timeout 2s;

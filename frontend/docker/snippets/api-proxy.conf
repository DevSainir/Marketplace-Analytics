# The /api/ reverse proxy, shared by the prefix location and the upload location
# so the two cannot drift. Included from a location; the caller sets
# `client_max_body_size` first, which is the only thing that differs between them.
#
# `proxy_pass` to a pool NAME with no path, so the original URI and query string
# pass through unchanged — the backend mounts its routers under the same /api
# prefix.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_primary http://api:8000;
proxy_pass $api_primary$request_uri;
include /etc/nginx/snippets/proxy-headers.conf;

# Fail over to the twin when the primary cannot be REACHED, which is what a
# deploy's rotation looks like from here. Two things make this safe:
#
# * `proxy_intercept_errors` stays OFF, so a 502 the application itself returns
#   is passed to the client untouched; only nginx's own connect-level failures
#   land here.
# * 504 is deliberately absent. A timeout may mean the request WAS applied and
#   the answer was slow, and replaying a POST that already ran is worse than
#   reporting the error.
error_page 502 503 = @api_twin;

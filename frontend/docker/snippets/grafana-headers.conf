# ---------------------------------------------------------------------------
# Response headers for the Grafana host. Deliberately NOT the app's set.
#
# `security-headers.conf` carries a CSP written for the built SPA —
# `script-src 'self'`, no inline script — and Grafana does not run under it:
# it injects inline bootstrap script and builds its panels at runtime. Applying
# the app's policy here would produce a blank page, and the "fix" somebody
# would reach for is loosening the SHARED snippet, which would quietly weaken
# the customer-facing site to make a dashboard load.
#
# So Grafana sets its own CSP instead (GF_SECURITY_CONTENT_SECURITY_POLICY),
# which is maintained against its own bundle by the people who ship it. This
# file carries only the headers that are true of any host.
#
# X-Frame-Options is absent for the same reason: Grafana emits its own
# (`allow_embedding = false`), and two conflicting values are worse than one —
# some browsers ignore both.
# ---------------------------------------------------------------------------

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The apex sends HSTS with `includeSubDomains`, which is a promise that binds
# THIS host too: a browser that has seen the apex will refuse plain HTTP here
# for two years, with no click-through. Repeating the header from the subdomain
# keeps the promise self-consistent for a client that reaches Grafana first.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# ---------------------------------------------------------------------------
# The k6 load profiles, on their own schedule and their own runner.
#
# WHY THIS IS NOT IN tests.yml. Not tidiness: `tests` gates the deploy. A red
# load profile means "the service got slower", which is worth waking up to and
# is NOT a reason to stop shipping — wiring it into the gate would eventually
# get the gate ignored.
#
# WHY NOT ON THE VPS RUNNER. Everything else in this repository moved onto the
# production box to stop burning hosted minutes. These profiles must not
# follow, and the reason is in what they are: `matrix-spike` drives 120
# concurrent users and `auth-flood` 60 requests a second, deliberately trying
# to overload whatever they are aimed at. A box serving production is the most
# shared thing available. A step below asserts the runner is a hosted one, so
# a future `runs-on:` edit fails loudly instead of DDoSing the live API.
#
# THE BUDGET, since hosted minutes are what forced all of this. The profiles
# are about nine billed minutes a day — some 270 a month against a 2000-minute
# allowance.
# ---------------------------------------------------------------------------

name: load

on:
  schedule:
    # Every day.
    - cron: '0 2 * * *'
  workflow_dispatch:

# Never two at once, and never cancelled half-way: a cancelled run leaves a
# compose stack behind on the runner, and the teardown step is what removes it.
concurrency:
  group: load
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: marketplace-load
  FRONTEND_HTTP_PORT: '8080'
  FRONTEND_HTTPS_PORT: '8443'
  PERF_API_URL: http://localhost:8000
  SEED_PG_CONTAINER: marketplace-load-postgres-1
  # Pinned with its checksum, the way every action in this repository is pinned
  # by SHA. A load runner that fetches "latest" is a load runner whose results
  # change for reasons nobody committed.
  K6_VERSION: v2.1.0
  K6_SHA256: 295d961ebfca306f295f1133068dcd403a8171c87f387928f5f30b0fbcff858a

jobs:
  k6:
    name: load profiles
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The guard that matters most in this file. `runs-on` above is a hosted
      # label today; this fails the run if it ever stops being one, before a
      # single request is generated.
      - name: Refuse to generate load from the production box
        run: |
          set -euo pipefail
          if [ "${RUNNER_ENVIRONMENT:-}" != "github-hosted" ]; then
            echo "::error::This job generates overload traffic and must run on a hosted runner." >&2
            echo "::error::RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT:-unset}. Refusing." >&2
            exit 1
          fi
          if [ "${SEED_PG_CONTAINER}" = "marketplace-service-postgres-1" ]; then
            echo "::error::SEED_PG_CONTAINER names production's database. Refusing." >&2
            exit 1
          fi
          echo "Hosted runner, throwaway project ${COMPOSE_PROJECT_NAME}. Proceeding."

      - name: Prepare the backend environment
        working-directory: backend
        run: |
          set -euo pipefail
          cp .env.example .env
          printf 'FERNET_SECRET_KEY=%s\n' "$(openssl rand 32 | base64 | tr '+/' '-_')" >> .env

      # Three overlays, in order: the real topology, the throwaway isolation
      # (plain-HTTP nginx, `:e2e` tags, memory caps), and the load overlay that
      # publishes the API on loopback and lifts the CPU caps.
      - name: Start the stack
        run: >-
          docker compose --project-directory backend
          -f backend/docker/docker-compose.yml
          -f backend/docker/docker-compose.e2e.yml
          -f backend/docker/docker-compose.load.yml
          up -d --build

      - name: Wait for the API to answer
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "${PERF_API_URL}/health" || true)
            if [ "$code" = "200" ]; then
              echo "API is serving (HTTP $code)."
              exit 0
            fi
            echo "waiting… (HTTP ${code:-none})"
            sleep 5
          done
          echo "::error::The stack did not become healthy in time." >&2
          exit 1

      # The profiles read reports from the database, so they need a catalogue and an account
      # — the same two things the browser tier needs, seeded the same way.
      - name: Load the catalogue seed
        working-directory: backend
        run: ./scripts/load_seed.sh

      - name: Seed the load-test account and workspaces
        run: >-
          docker compose --project-directory backend
          -f backend/docker/docker-compose.yml
          -f backend/docker/docker-compose.e2e.yml
          -f backend/docker/docker-compose.load.yml
          exec -T api python -m scripts.seed_e2e_fixtures

      - name: Install k6
        run: |
          set -euo pipefail
          url="https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz"
          curl -fsSL "$url" -o /tmp/k6.tar.gz
          echo "${K6_SHA256}  /tmp/k6.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo install "/tmp/k6-${K6_VERSION}-linux-amd64/k6" /usr/local/bin/k6
          k6 version

      # Steady state, then spike-and-recover, then the auth flood. Sequential
      # on purpose: run together they would measure each other.
      - name: Steady-state load
        working-directory: tests
        run: k6 run performance/monitoring/summary-load.js

      - name: Spike and recovery
        working-directory: tests
        run: k6 run performance/monitoring/matrix-spike.js

      - name: Credential-stuffing flood
        working-directory: tests
        run: k6 run performance/users/auth-flood.js

      - name: Stack logs on failure
        if: failure()
        run: >-
          docker compose --project-directory backend
          -f backend/docker/docker-compose.yml
          -f backend/docker/docker-compose.e2e.yml
          -f backend/docker/docker-compose.load.yml
          logs --tail=200

      - name: Tear the stack down
        if: always()
        run: >-
          docker compose --project-directory backend
          -f backend/docker/docker-compose.yml
          -f backend/docker/docker-compose.e2e.yml
          -f backend/docker/docker-compose.load.yml
          down -v --remove-orphans

# The other half of pinning by digest (register P1.8).
#
# Pinning made the build reproducible and, in the same stroke, opted out of the
# security patches a floating tag delivers for free. `python:3.12-slim` is
# re-pushed on every patch release; a digest never moves, so a pinned image
# quietly ages until somebody remembers it exists. Nobody remembers.
#
# So this asks the registry, once a week, what each pinned tag resolves to now
# and fails when it no longer matches what the Dockerfiles hold. A red weekly
# run is the reminder. Refreshing is then a deliberate act with a diff and a
# review — which is the whole point of pinning — rather than an accident of
# whenever a build happened to run.
#
# It reads the digests out of the Dockerfiles rather than keeping its own list.
# A second list would drift from the first, and the failure mode of a drifted
# freshness check is the worst available: a green tick that means nothing.
#
# The second job answers the question the first one cannot (register P2.7). "Has
# this tag moved?" and "is what we pinned known-vulnerable?" are different
# facts, and a pin can be perfectly current while carrying a CVE published
# yesterday — nothing upstream has to move for our image to become a problem. So
# Trivy scans those digests too, and the two jobs report independently rather
# than one gating the other: a stale pin and a vulnerable pin want different
# responses from whoever reads the run.
#
# THE TWO JOBS DO NOT COVER THE SAME LIST, and the difference is deliberate.
# Freshness looks at every pinned image, because a stale builder is still a
# reproducibility problem worth a diff. The CVE scan looks only at the images
# that reach a running container: a finding in a stage whose output is a
# directory we copy out is not a finding anybody can be asked to act on, and a
# gate that is red for reasons nobody can act on is a gate that gets muted —
# the same failure `--ignore-unfixed` below was written to avoid, arriving from
# the other direction. `# build-only` above a pinned reference is what excludes
# it; unmarked means scanned.

name: base images

on:
  schedule:
    # 06:00 UTC on Mondays — a working morning in Moscow (09:00), so a failure
    # is seen on the day it fires rather than over a weekend.
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A weekly check that opens an issue. Two of them racing would file the same
# issue twice, and cancelling the older one loses nothing — the newer run reads
# the same registry.
concurrency:
  group: base-image-freshness
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: pinned digests still current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compare every pinned digest against its tag
        run: |
          set -uo pipefail

          # Resolve the current digest of a tag, anonymously.
          #   $1 = registry host, $2 = repository, $3 = tag
          current_digest() {
            local host=$1 repo=$2 tag=$3 realm token
            case "$host" in
              docker.io) realm="https://auth.docker.io/token?service=registry.docker.io&scope=repository:${repo}:pull"; host=registry-1.docker.io ;;
              ghcr.io)   realm="https://ghcr.io/token?scope=repository:${repo}:pull" ;;
              *) echo "unknown registry ${host}" >&2; return 1 ;;
            esac
            token=$(curl -fsS "$realm" | jq -r '.token')
            curl -fsSI \
              -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.list.v2+json' \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "https://${host}/v2/${repo}/manifests/${tag}" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="docker-content-digest"{print $2}'
          }

          stale=0
          # Every `image:tag@sha256:...` in either Dockerfile, deduplicated.
          refs=$(grep -rhoE '[a-z0-9./-]+:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}' \
                   backend/docker/Dockerfile frontend/docker/Dockerfile | sort -u)
          if [ -z "$refs" ]; then
            echo "::error::No digest-pinned images found — the grep or the Dockerfiles changed shape."
            exit 1
          fi

          for ref in $refs; do
            pinned="${ref##*@}"
            name="${ref%@*}"
            tag="${name##*:}"
            repo="${name%:*}"
            case "$repo" in
              */*/*|ghcr.io/*) host="${repo%%/*}"; repo="${repo#*/}" ;;
              */*)             host=docker.io ;;
              *)               host=docker.io; repo="library/${repo}" ;;
            esac
            [ "$host" = "docker.io" ] && case "$repo" in */*) : ;; *) repo="library/${repo}" ;; esac

            now=$(current_digest "$host" "$repo" "$tag") || {
              echo "::warning::Could not resolve ${host}/${repo}:${tag}; skipping."
              continue
            }
            if [ "$now" = "$pinned" ]; then
              echo "ok       ${host}/${repo}:${tag}"
            else
              stale=1
              echo "::error::${host}/${repo}:${tag} has moved."
              echo "  pinned:  ${pinned}"
              echo "  current: ${now}"
            fi
          done

          if [ "$stale" -ne 0 ]; then
            echo
            echo "A base image has been rebuilt upstream — usually a security patch."
            echo "Update the digest in the Dockerfile, then let the test suite decide."
            exit 1
          fi
          echo "Every pinned base image is current."

  scan:
    name: pinned digests carry no fixable CVE
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The images to scan come from the Dockerfiles, for the same reason the
      # freshness job reads them there: one list, or the two drift apart.
      #
      # But not ALL of them — only the ones that reach a running container.
      # A `# build-only` comment above a pinned reference excludes it, and the
      # comment sits next to the stage it describes rather than in a list here,
      # for the same one-list reason. UNMARKED MEANS SCANNED: a new pin nobody
      # classified is a pin this job looks at, so forgetting the marker costs a
      # false alarm rather than a blind spot.
      #
      # What is skipped is printed, because a coverage bound nobody states
      # reads as full coverage the moment the person who set it moves on.
      - name: Collect the pinned images that reach production
        id: images
        run: |
          set -euo pipefail
          classify() {
            awk '
              /^[[:space:]]*#[[:space:]]*build-only([[:space:]]|:|$)/ { mark = 1; next }
              {
                if (match($0, /[a-z0-9.\/-]+:[A-Za-z0-9._-]+@sha256:[0-9a-f]{64}/)) {
                  print (mark ? "build-only" : "shipped") "\t" substr($0, RSTART, RLENGTH)
                  mark = 0
                  next
                }
                if ($0 !~ /^[[:space:]]*(#|$)/) mark = 0
              }
            ' backend/docker/Dockerfile frontend/docker/Dockerfile | sort -u
          }
          all=$(classify)
          if [ -z "$all" ]; then
            echo "::error::No digest-pinned images found — the awk or the Dockerfiles changed shape."
            exit 1
          fi
          refs=$(printf '%s\n' "$all" | awk -F'\t' '$1 == "shipped" { print $2 }')
          skipped=$(printf '%s\n' "$all" | awk -F'\t' '$1 == "build-only" { print $2 }')
          if [ -z "$refs" ]; then
            echo "::error::Every pinned image is marked build-only — this run would prove nothing."
            exit 1
          fi
          echo "Scanning:"
          printf '  %s\n' $refs
          if [ -n "$skipped" ]; then
            echo "Not scanned, marked build-only in the Dockerfile:"
            printf '  %s\n' $skipped
            echo "::notice::This run says nothing about $(printf '%s\n' "$skipped" | wc -l | tr -d ' ') build-only image(s)."
          fi
          {
            echo 'refs<<EOF'
            echo "$refs"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # --ignore-unfixed is the difference between a gate people act on and one
      # they mute. A base image always carries open CVEs that Debian has not
      # patched; we cannot fix those and neither can a rebuild, so failing on
      # them would make this red permanently and therefore meaningless. A
      # finding WITH a fix available is actionable by exactly one action —
      # refresh the digest — which is what the other job already tells us how
      # to do.
      - name: Scan each pinned base image
        env:
          REFS: ${{ steps.images.outputs.refs }}
          TRIVY: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
        run: |
          set -uo pipefail
          vulnerable=0
          broken=0
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            echo "::group::${ref}"
            docker run --rm -v /tmp/trivy-cache:/root/.cache/ "$TRIVY" \
              image --quiet --scanners vuln --ignore-unfixed \
              --severity HIGH,CRITICAL --exit-code 1 "$ref"
            status=$?
            echo "::endgroup::"
            # `--exit-code 1` makes 1 mean "findings". ANY OTHER non-zero means
            # Trivy itself could not run — a failed pull, an unreachable
            # vulnerability database, a registry rate limit. Those are opposite
            # conclusions and must not share a branch: reporting a tool failure
            # as "vulnerable" sends somebody hunting a CVE nobody reported, and
            # reporting it as "clean" is worse — it is a green tick over an
            # image that was never looked at.
            case "$status" in
              0) echo "clean    ${ref}" ;;
              1) vulnerable=1; echo "::error::${ref} has a fixable HIGH/CRITICAL vulnerability." ;;
              *) broken=1;     echo "::error::Trivy exited ${status} on ${ref} — the scan did not run." ;;
            esac
          done <<< "$REFS"
          if [ "$vulnerable" -ne 0 ]; then
            echo "Refresh that digest in the Dockerfile — the fix is already published upstream."
          fi
          if [ "$broken" -ne 0 ]; then
            echo "At least one image was never scanned; this run proves nothing about it."
          fi
          if [ "$vulnerable" -ne 0 ] || [ "$broken" -ne 0 ]; then
            exit 1
          fi
          echo "No fixable HIGH/CRITICAL findings in any pinned base image."

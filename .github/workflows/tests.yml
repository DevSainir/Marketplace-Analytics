# CI staged by the testing pyramid.
#
# Jobs are ordered by cost and gated on each other, so a broken unit test stops
# the pipeline in ~30 seconds instead of after a ten-minute browser run. That
# ordering IS the pyramid: cheap feedback first, expensive confirmation last.
#
# The end-to-end tier is deliberately not on every push — it needs the full
# stack and a browser, and running it per-commit would make the pipeline the
# slowest part of the working day.
#
# The k6 load profiles under tests/performance/*.js are not here at all, by
# their own contract: they exist to overload what they point at, so they are
# run deliberately, by hand, against something nobody else is using. Only the
# pytest half of that directory — tests/performance/resilience — is in CI.

name: tests

# NOT on `pull_request`, and dropping it is the fix for a red ✗ on every
# release. The trigger looked free and was not.
#
# Development here is trunk-based (see the `git-workflow` skill): work goes
# straight to `main` and no PR is opened for it. The only pull request this
# repository ever sees is the one Release Please opens — and a PR opened by
# GITHUB_TOKEN has its workflow runs HELD at `action_required` until a human
# clicks «Approve and run». Nobody ever does: `release` merges that PR seconds
# later, deliberately, without waiting for it.
#
# An unapproved run does not stay politely pending. GitHub EXPIRES it the
# moment it is superseded — release-please pushes twice, the version bump and
# then the uv.lock sync — or the PR closes, and an expired run's conclusion is
# `failure`: twelve seconds, zero jobs, and the banner "This run likely failed
# because of a workflow file issue", which points at this file and is a lie.
# The annotation underneath is the true one: "This workflow run required
# approval but was not approved before it expired."
#
# So every release cut two red checks beside a release that was fine. Nothing
# was ever broken by it — `deploy` gates on the `main` run, not the PR's — but
# a red build that everyone is told to ignore is a red build nobody reads, and
# that is the part worth fixing.
#
# Nothing is lost. The release PR's contents land on `main` in the merge commit
# seconds later and are tested there in full, before anything deploys. To test
# a branch by hand, dispatch this workflow against it — which also offers
# `run_slow_tiers`, more than a PR run ever gave.
#
# The head branch cannot be filtered out instead: `pull_request.branches`
# matches the BASE branch, and the approval is held at run level, so no job-
# level `if:` is ever reached to decline the work.
on:
  push:
    branches: [main]
  # The browser tier, nightly. The hour is MEASURED, not assumed: four days of
  # Prometheus history bucketed by hour of day put the trough at 21:00-02:00
  # UTC (00:00-05:00 MSK), where total process CPU sits at a p95 of 0.007 core
  # against 0.027 at the 11:00 MSK peak, and HTTP traffic is flat zero. Any
  # hour in that band is equally quiet, so the beat schedule breaks the tie.
  #
  # 23:30 UTC = 02:30 MSK sits in the widest gap in that schedule
  # (src/core/celery_app.py, whose crontabs are Europe/Moscow):
  #
  #   02:00 MSK  finreports.harvest_finance  — hourly at :00, MSK 0-4 and 8-23
  #   [ 02:30 MSK — this run, 30 minutes clear on either side ]
  #   03:00 MSK  finreports.harvest_finance
  #   04:30 MSK  auth.purge_expired_refresh_tokens
  #   06:00 MSK  monitoring.harvest_all        — the heavy one
  #   07:00 MSK  monitoring.refresh_buyout_cohorts
  #
  # Only ab_tests.poll_rotations (every 5 minutes, sub-second) overlaps at all,
  # and the job is capped below so that even an overrun cannot reach the 06:00
  # harvest with anything the kernel has not already bounded.
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      run_slow_tiers:
        description: 'Also run the end-to-end tier'
        type: boolean
        default: false

# The event is part of the KEY, and leaving it out cancelled a run on every
# single push to main. `release` merges its PR with GITHUB_TOKEN, which triggers
# no workflow, so it dispatches this one by hand — and a dispatched run on main
# landed in the same group as the push run already going and killed it. Every
# push therefore ended in a red "cancelled" that meant nothing was wrong, which
# is exactly the kind of red this repository has spent several commits removing.
#
# Splitting by event keeps what the cancellation is FOR — a second push
# superseding the first, a re-dispatch superseding an earlier dispatch — and
# drops only the cross-event collision, which was never anything but collateral.
# Two runs can now overlap; the VPS runner is single, so they queue rather than
# compete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# CI only reads the repository; nothing here pushes, comments, or releases.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  # Pinned so the resolver itself is reproducible, not just what it resolves.
  UV_VERSION: '0.11.32'

jobs:
  # ------------------------------------------------------------------ #
  # WHERE THESE JOBS RUN
  #
  # Every job runs on the self-hosted runner on the production VPS (label
  # `prod-vps`). There is exactly ONE runner, and that is
  # a resource decision rather than an oversight: two vCPUs are shared with the
  # live API and the Celery worker, so jobs QUEUE instead of competing. The
  # systemd unit caps the runner at 130% CPU and 1400 MiB, runs it at Nice=10,
  # and gives it best-effort I/O at the lowest priority — not the idle class,
  # which was tried first and starved a checkout outright when a large prune
  # ran beside it (2026-09-09).
  #
  # The performance DIRECTORY splits in two here, and the split is the whole
  # reason its pytest half could move onto this box while it ran hosted for
  # months. `resilience/` exhausts pools and engines IT OWNS, against the
  # integration tier's throwaway database — the load never leaves the test
  # process, so "must never run against anything shared" does not describe it.
  # The k6 profiles beside it are the half that sentence was written for: 120
  # concurrent VUs and 60 requests a second aimed at a real API. Those are not
  # in this file and must not be, because a box serving production is the most
  # shared thing available.
  #
  # `end-to-end` DOES run here, but only on the nightly schedule and only
  # behind the isolation in docker-compose.e2e.yml — a separate compose
  # project, `:e2e` image tags and ports 8080/8443, because the base file names
  # the production project and a careless invocation would recreate the live
  # stack. A `docker build` also escapes this runner's cgroup (it runs under
  # dockerd), which is why that job's limits are enforced by Compose instead.
  # ------------------------------------------------------------------ #
  # Gates 0-2 — style, types, the fast tiers and integration, in ONE job.
  #
  # These were three jobs — `quality`, `fast`, `integration` — ordered so that a
  # lint failure stopped the pipeline before the slower tests ran. That ordering
  # bought nothing once CI moved to a single self-hosted runner: they already
  # serialised, so the "cheap feedback first" property now comes from step ORDER
  # inside this job, which is the same guarantee for free. What the split did
  # still cost was real — a repeated checkout, `uv sync` and `npm ci`, plus a
  # ~25s gap between each pair, roughly 85s of a 7m31s run (measured 2026-09-09)
  # spent setting the same machine up three times.
  #
  # Steps stay ordered cheapest-first for the reason the jobs used to be: ruff
  # answers in seconds, then mypy, then the fast tiers, and integration — which
  # needs Postgres and Redis — last.
  #
  # The cost of merging is granularity: one red X now covers lint, types and
  # every tier below e2e, so the step name is what tells you which gate failed.
  # ------------------------------------------------------------------ #
  verify:
    name: lint + types + fast + integration + resilience
    runs-on: [self-hosted, prod-vps]
    timeout-minutes: 30

    # Hoisted from the integration job this absorbed. They idle through the
    # lint and fast steps, which costs a few tens of MB and saves starting them
    # in a second job — along with that job's checkout, its `uv sync` and the
    # ~25s gap between the two.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marketplace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Persistent, and outside `_work` so a job cleanup cannot take them.
      # These are the whole point of a long-lived runner: the second run
      # resolves nothing and downloads nothing.
      #
      # `_work` is not a safe place for any of it. `actions/checkout` defaults
      # to `clean: true`, which runs `git clean -ffdx` — and that removes
      # IGNORED files too, so `.venv`, `node_modules` and `.mypy_cache` are
      # deleted before every run. That is why mypy was always doing a cold
      # check: measured locally 2026-09-09, `mypy --strict` over this tree is
      # 8.1s cold and 0.35s incremental, and CI paid the cold price every time.
      # mypy validates its cache against file contents, so a stale entry is
      # re-checked rather than trusted.
      UV_CACHE_DIR: /home/gha/.cache/uv
      npm_config_cache: /home/gha/.cache/npm
      # The resolved virtualenv itself, not just the package cache. `uv sync`
      # then relinks an existing environment instead of building one.
      UV_PROJECT_ENVIRONMENT: /home/gha/.venvs/marketplace-backend
      # Two caches, not one: the backend is checked under the settings in
      # backend/pyproject.toml and the CI scripts under an explicit `--strict`.
      # Sharing a directory between two option sets makes mypy invalidate one
      # with the other and quietly hands back the cold time this is here to
      # avoid.
      MYPY_CACHE_BACKEND: /home/gha/.cache/mypy/backend
      MYPY_CACHE_CI: /home/gha/.cache/mypy/ci-scripts

    steps:
      # A persistent runner accumulates what a hosted one throws away. This box
      # has 48 GB shared with production, and a full disk has already taken it
      # down once.
      #
      # BEFORE the work, not after: a job that fails or is cancelled never
      # reaches an "after" step, and the next run is exactly when the space is
      # needed. Only build cache and DANGLING images are touched — a plain
      # `prune -a` would be judged against running containers alone, and this
      # host keeps images (the migrate one) whose container has legitimately
      # exited.
      - name: Reclaim disk if it is tight
        run: |
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "${avail}G available on /."
          if [ "${avail:-99}" -lt 8 ]; then
            echo "Below the 8G floor — reclaiming."
            docker builder prune -af || true
            docker image prune -f || true
            df -h /
          fi

      # Unconditional, unlike the step above: what it removes is never wanted.
      # The postgres and redis images each declare a VOLUME, so every run's
      # service containers get two anonymous volumes, and the runner removes
      # the containers but not those. 628 of them (22.8 GB) filled the disk
      # and failed the nightly backup on 2026-10-07 and 10-08. Since Docker 23
      # a plain `volume prune` takes only ANONYMOUS volumes no container holds:
      # production's named ones are out of its reach without `-a`, and this
      # run's own service volumes are held by their running containers.
      - name: Remove volumes earlier runs' service containers left behind
        run: docker volume prune -f || true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          # No `enable-cache`: that round-trips the cache through GitHub's
          # cache service every run, and this runner's disk persists. But
          # dropping it is NOT sufficient on its own — setup-uv then points
          # UV_CACHE_DIR at `_work/_temp/setup-uv-cache`, which the runner
          # clears per job, so the cache was simply gone rather than local.
          # `UV_CACHE_DIR` in the job env above is what actually makes it
          # persist.

      # `--locked` fails rather than silently re-resolving, so CI can never
      # install a dependency set the committed uv.lock does not describe.
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      # Every importable path, not just src/tests: main.py is the ASGI
      # entrypoint, alembic/ holds hand-edited migrations, and scripts/ is run
      # against production data. Leaving them unchecked was a silent gap —
      # formatting had already drifted in alembic/versions/.
      - name: Ruff (backend)
        working-directory: backend
        run: |
          uv run ruff check src tests main.py alembic scripts
          uv run ruff format --check src tests main.py alembic scripts

      # Run from the REPO ROOT, not from backend/. ruff resolves the
      # per-file-ignores patterns (`tests/**`) relative to the config file's
      # directory, so linting `../tests/performance` from inside backend/ makes
      # them stop matching and the tier fails on ignores it is meant to have.
      - name: Ruff (cross-stack performance tier)
        run: |
          uv run --project backend ruff check --config backend/pyproject.toml tests/performance
          uv run --project backend ruff format --check --config backend/pyproject.toml tests/performance

      - name: mypy (strict)
        working-directory: backend
        run: uv run mypy --cache-dir "$MYPY_CACHE_BACKEND" src main.py scripts

      # Audits the RUNTIME set only — what actually ships. `--disable-pip`
      # because the export is fully pinned, so pip-audit has nothing to resolve.
      #
      # Stays on EVERY push while its informational twin moved to the nightly
      # run. The two are not the same kind of check: this one gates, and the
      # eight seconds it costs are the price of not shipping a known CVE in
      # something that runs on the server. Cadence is a security control, so it
      # is not traded for pipeline time.
      - name: pip-audit (runtime dependencies)
        working-directory: backend
        timeout-minutes: 5
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/runtime.txt
          uv run pip-audit --requirement /tmp/runtime.txt --strict --disable-pip

      # The dev set too, but informational — these packages never reach a
      # server, yet they DO execute on a runner holding a checkout and a token,
      # so "nobody looks at them" is the wrong answer; blocking every push on an
      # advisory in a tool's own transitive (today: `pip`, pulled in by
      # pip-audit itself) is the other wrong answer.
      #
      # NIGHTLY, since 2026-09-09. Nothing is gated on it, so running it on
      # every push only spent budget to tell us the same thing four times a day.
      - name: pip-audit (dev dependencies, informational)
        if: github.event_name == 'schedule' || inputs.run_slow_tiers
        working-directory: backend
        continue-on-error: true
        timeout-minutes: 2
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o /tmp/all.txt
          uv run pip-audit --requirement /tmp/all.txt --strict --disable-pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          # Same reasoning as uv above: the npm cache persists between runs
          # here, and `npm_config_cache` in the job env pins where.

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier
        working-directory: frontend
        run: npm run format:check

      # Gate on what actually SHIPS. The dev tree carries advisories with no
      # fixed version available (js-yaml via @redocly/openapi-core, js-beautify
      # via @vue/test-utils — both already on their latest release), and
      # blocking every push on an unfixable finding just teaches people to
      # ignore the gate. The production tree is audited strictly.
      #
      # Kept on every push for the same reason as the runtime pip-audit: it
      # gates, and with the flags below it answers in about two seconds.
      #
      # The `--fetch-*` flags and the timeouts are not tidiness; they are the
      # fix for a deploy this repository actually lost on 2026-09-04.
      #
      # `--omit=dev` puts npm on the LEGACY quick-audit endpoint
      # (`/-/npm/v1/security/audits/quick`), which npm's own output says is
      # being retired and which was intermittently answering 503 that day. npm
      # defaults `fetch-timeout` to FIVE MINUTES and retries twice, so one
      # degraded endpoint costs up to fifteen minutes — the whole job budget.
      # Measured on the same tree that afternoon: the stock command took 7m01s
      # to fail, the same audit with the flags below answered correctly in 2.6s.
      #
      # When the budget ran out GitHub CANCELLED the job, and a cancelled job
      # makes the run `cancelled` — which the deploy would not ship, because it
      # required `success`. So an advisory lookup nobody was gated on quietly
      # held a release. `continue-on-error` never covered that: it
      # swallows a non-zero exit and says nothing about a process that does not
      # return. A step that outlives its OWN timeout fails instead, and
      # `continue-on-error` absorbs that — which is what "informational" always
      # meant to say.
      #
      # The gating audit also refuses to turn npm's uptime into our release
      # gate: a report showing vulnerabilities fails the build, an endpoint that
      # will not answer is a warning. Fail closed on findings, not on weather.
      - name: npm audit (production dependencies)
        working-directory: frontend
        timeout-minutes: 5
        run: |
          set -uo pipefail
          report=$(npm audit --omit=dev --audit-level=high --json \
            --fetch-timeout=15000 --fetch-retries=2 2>/tmp/npm-audit.err) && rc=0 || rc=$?
          if ! printf '%s' "$report" | jq -e 'has("auditReportVersion")' >/dev/null 2>&1; then
            echo "::warning title=Production npm audit did not run::The advisory endpoint did not answer, so the production tree was not audited. This is npm's availability, not a finding."
            sed -n '1,20p' /tmp/npm-audit.err || true
            exit 0
          fi
          printf '%s' "$report" | jq '.metadata.vulnerabilities'
          exit "$rc"

      # Nightly, for the same reason as the dev pip-audit: informational.
      - name: npm audit (dev dependencies, informational)
        if: github.event_name == 'schedule' || inputs.run_slow_tiers
        working-directory: frontend
        continue-on-error: true
        timeout-minutes: 2
        run: npm audit --audit-level=high --fetch-timeout=15000 --fetch-retries=2

      # Coverage is measured on the NIGHTLY run now, not on every push.
      # Instrumentation is most of the difference between this tier taking ~21s
      # on a developer's machine and 91s here (measured 2026-09-09), which on a
      # two-core box shared with production is a large slice of the whole
      # push-to-deploy budget spent computing a number that moves a few times a
      # month.
      #
      # The floor is UNCHANGED and still a ratchet — 68% today, raise it as the
      # suite grows, never lower it to make a red build green. It is simply
      # enforced by the 23:30 UTC run, so a coverage regression is caught the
      # next morning rather than at push. Everything about which tiers carry
      # the pyramid's weight is unaffected: the same tests run either way.
      - name: Backend unit + component tiers
        working-directory: backend
        env:
          COVERAGE: >-
            ${{ (github.event_name == 'schedule' || inputs.run_slow_tiers)
            && '--cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=68'
            || '' }}
        run: uv run pytest tests/unit tests/component -m "unit or component" ${COVERAGE}

      - name: Upload the coverage report
        if: always() && (github.event_name == 'schedule' || inputs.run_slow_tiers)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

      - name: Frontend unit + integration specs
        working-directory: frontend
        run: npm run test

      # The SPA build is part of the product, so a build break is a red
      # pipeline — not a surprise during the next deploy. Seconds to run, and
      # it is the only gate that compiles every template and resolves every
      # import for real.
      - name: Build the SPA
        working-directory: frontend
        run: npm run build

      # ---------------------------------------------------------------- #
      # The integration tier, formerly its own job.
      #
      # Its environment is declared per STEP rather than on the job, and that
      # is the point of the merge rather than an afterthought: hoisting
      # ENVIRONMENT, the POSTGRES_*/REDIS_* pair and a JWT signing key to job
      # level would hand them to the unit and component tiers too, which have
      # never run with them. Those tiers are supposed to be unable to reach a
      # database; giving them the credentials for one is how a unit test
      # quietly starts depending on Postgres and nobody notices for a month.
      # ---------------------------------------------------------------- #
      - name: Generate an ephemeral encryption key
        run: |
          printf 'FERNET_SECRET_KEY=%s\n' "$(openssl rand 32 | base64 | tr '+/' '-_')" >> "$GITHUB_ENV"

      - name: Integration tier
        working-directory: backend
        env:
          ENVIRONMENT: local
          DEBUG: 'false'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci-password
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ''
          JWT_SECRET_KEY: ci-only-signing-key-not-used-anywhere-else
        run: uv run pytest tests/integration -m integration

      # ---------------------------------------------------------------- #
      # The resilience tier — the pytest half of tests/performance.
      #
      # Here rather than in a job of its own, and AFTER the integration tier,
      # because that is what its own conftest asks for: it runs against
      # `marketplace_test`, the throwaway database the integration tier
      # creates, and skips with "run the integration tier once to create it"
      # when that database is missing. As a separate job it had to re-create
      # the database by running one migration test first — two minutes of
      # setup around eleven tests that finish in four and a half seconds.
      #
      # It ran hosted, gated behind `run_slow_tiers`, and that flag is not set
      # by the nightly schedule — so across the 200 most recent runs it had
      # never once executed. A tier that guards pool exhaustion, reclaimed
      # transactions and write races is worth more than that, and at five
      # seconds it is cheaper than deciding when to run it.
      #
      # Repository root, not `backend/`: this tier is cross-stack and takes its
      # config from tests/pytest.ini.
      # ---------------------------------------------------------------- #
      - name: Resilience tier (pool exhaustion, reclaimed transactions, write races)
        env:
          ENVIRONMENT: local
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci-password
          JWT_SECRET_KEY: ci-only-signing-key-not-used-anywhere-else
        run: uv run --project backend pytest -c tests/pytest.ini tests/performance

  # ------------------------------------------------------------------ #
  # Gate 3 — end-to-end. Full stack + a real browser. Manual / main only.
  # ------------------------------------------------------------------ #
  end-to-end:
    name: end-to-end
    runs-on: [self-hosted, prod-vps]
    timeout-minutes: 30
    needs: verify
    # No longer on every push to main. It ran there for the reassurance rather
    # than the gate — it fires AFTER the code is already on main, and deploy
    # keys off the run's conclusion — and each run now costs the production
    # box's own capacity rather than a hosted runner's. Nightly in the measured
    # trough gives the same signal at a time when nothing is competing for it.
    if: github.event_name == 'schedule' || inputs.run_slow_tiers

    # THE THREE FACTS THAT KEEP THIS OFF PRODUCTION'S TOES. The base compose
    # file declares `name: marketplace-analytic`, so a bare `docker compose -f
    # ... up --build` on this host targets the LIVE project: it would recreate
    # the running containers with the plain-HTTP CI nginx config, aimed at a
    # throwaway database. Hence:
    #
    #   COMPOSE_PROJECT_NAME  a separate project — separate containers,
    #                         networks and volumes
    #   FRONTEND_HTTP_PORT    8080/8443, because production is serving on
    #                         80/443 and Compose merges `ports` rather than
    #                         replacing them
    #   (and docker-compose.e2e.yml retags every built image `:e2e`, because
    #    image tags are global to the daemon and would otherwise overwrite the
    #    image production restarts from)
    #
    # The guard step below fails the job if the first of these is ever lost.
    env:
      COMPOSE_PROJECT_NAME: marketplace-analytic-e2e
      FRONTEND_HTTP_PORT: '8080'
      FRONTEND_HTTPS_PORT: '8443'
      E2E_BASE_URL: http://localhost:8080
      # A FOURTH fact, learned the hard way on 2026-09-10. The three above
      # isolate everything that goes through Compose; `scripts/load_seed.sh`
      # does not — it reaches for a postgres container BY NAME, and its old
      # default was production's. The first (and only) nightly run of this job
      # truncated production's monitoring schema. The script now derives the
      # name from COMPOSE_PROJECT_NAME and refuses any stack whose api declares
      # ENVIRONMENT=production; naming it here as well makes the target visible
      # in the log rather than implied.
      SEED_PG_CONTAINER: marketplace-analytic-e2e-postgres-1

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Prepare the backend environment
        working-directory: backend
        run: |
          set -euo pipefail
          cp .env.example .env
          # openssl, not python+cryptography: this job installs no Python
          # dependencies, and the runner's system python has no `cryptography`.
          # A Fernet key is just 32 random bytes in urlsafe base64.
          printf 'FERNET_SECRET_KEY=%s\n' "$(openssl rand 32 | base64 | tr '+/' '-_')" >> .env

      # Belt and braces, because the failure mode here is an OUTAGE rather than
      # a red build: ask Compose what it actually resolved, and refuse to
      # continue if it names the production project or the production port.
      # Placed after the step above because `config` interpolates backend/.env
      # and cannot resolve anything until it exists.
      - name: Refuse to run against the production project
        run: |
          set -euo pipefail
          cfg=$(docker compose --project-directory backend \
            -f backend/docker/docker-compose.yml -f backend/docker/docker-compose.e2e.yml \
            config --format json)
          resolved=$(printf '%s' "$cfg" | jq -r '.name')
          echo "Compose resolved the project to: ${resolved}"
          # The edge holds the public ports since 2026-10; no nginx publishes one.
          printf '%s' "$cfg" | jq -r '.services.edge.ports[] | "  edge publishes \(.published) -> \(.target)"'
          if [ "$resolved" != "marketplace-analytic-e2e" ]; then
            echo "::error::Refusing to start: this would target '${resolved}', not marketplace-analytic-e2e." >&2
            exit 1
          fi
          if printf '%s' "$cfg" | jq -e '[.services[] | (.ports // [])[] | select((.published|tostring) == "80" or (.published|tostring) == "443")] | length > 0' >/dev/null; then
            echo "::error::Refusing to start: the e2e stack would bind port 80 or 443, which production serves on." >&2
            exit 1
          fi
          # The seed target is checked here too, because it is the one thing in
          # this job that Compose does not resolve — `config` above cannot see
          # it, and it is what actually reached production.
          seed_pg=$(printf '%s' "$cfg" | jq -r '.services.postgres.container_name // "marketplace-analytic-e2e-postgres-1"')
          if [ "${SEED_PG_CONTAINER}" = "marketplace-analytic-postgres-1" ]; then
            echo "::error::Refusing to start: SEED_PG_CONTAINER names production's database." >&2
            exit 1
          fi
          echo "Seed will target: ${SEED_PG_CONTAINER} (compose postgres: ${seed_pg})"
          echo "Isolation checks passed."

      # BEFORE the work, for the same reason the disk reclaim in `verify` is:
      # the teardown at the bottom of this job is `if: always()`, and
      # `always()` is a promise the runner can only keep while it is alive. On
      # 2026-09-19 it was not — the box ran out of memory mid-tier, the runner
      # lost communication, and no further step of any kind executed. The
      # throwaway stack was left running, `restart: unless-stopped` (since
      # fixed in docker-compose.e2e.yml) brought it back on every boot, and
      # 1.5 GB of test containers sat on a 3.9 GB box with no swap beside the
      # live service until somebody rebooted and removed them by hand.
      #
      # So the invariant is established here rather than only promised at the
      # end: whatever the last run left behind, this one starts from nothing.
      # Scoped by project name alone — never `-f`, which would resolve the
      # base file and name the PRODUCTION project — and `|| true` because the
      # overwhelmingly common case is that there is nothing to remove.
      - name: Remove any stack a previous run left behind
        run: |
          set -euo pipefail
          if [ "${COMPOSE_PROJECT_NAME}" != "marketplace-analytic-e2e" ]; then
            echo "::error::Refusing to clean up: project is '${COMPOSE_PROJECT_NAME}'." >&2
            exit 1
          fi
          leftover=$(docker ps -aq --filter "label=com.docker.compose.project=marketplace-analytic-e2e" | wc -l)
          echo "${leftover} leftover marketplace-analytic-e2e container(s)."
          if [ "${leftover}" -gt 0 ]; then
            echo "::warning::A previous run did not tear its stack down; removing it."
          fi
          docker compose -p marketplace-analytic-e2e down -v --remove-orphans || true

      # The e2e overlay builds the frontend's self-contained `e2e` target,
      # which carries a plain-HTTP config and its own copy of the bundle.
      # Without it nginx cannot load its config at all — the production one
      # hard-requires the Let's Encrypt key pair, which no runner has — so the
      # container restart-loops and nothing is ever served. Production's
      # frontend instead reads its config and bundle from a release directory
      # the deploy installs on the host, which is why this needs a distinct
      # image rather than a mounted config file.
      - name: Start the stack
        run: >-
          docker compose --project-directory backend
          -f backend/docker/docker-compose.yml -f backend/docker/docker-compose.e2e.yml
          up -d --build

      # Assert a real 200. The previous gate used `curl -sf`, which treats a
      # redirect as success and does not follow it — so it passed against a
      # stack that served only "301 https://localhost/".
      - name: Wait for the stack to serve the SPA
        working-directory: backend
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "${E2E_BASE_URL}/" || true)
            if [ "$code" = "200" ]; then
              echo "Stack is serving (HTTP $code)."
              exit 0
            fi
            echo "waiting… (HTTP ${code:-none})"
            sleep 5
          done
          echo "The stack did not become healthy in time." >&2
          docker compose --project-directory backend \
            -f backend/docker/docker-compose.yml -f backend/docker/docker-compose.e2e.yml \
            logs --tail=100
          exit 1

      # The browser tier needs three things no migration supplies: an account
      # (the auth schema is deliberately never dumped), a second workspace to
      # switch to, and — the subtle one — a catalogue the workspace can SEE.
      # The committed dump predates multi-tenancy, so every product_card lands
      # with workspace_id NULL and is filtered out of every query.
      - name: Load the catalogue seed
        working-directory: backend
        run: ./scripts/load_seed.sh

      - name: Seed the end-to-end account and workspaces
        run: >-
          docker compose --project-directory backend
          -f backend/docker/docker-compose.yml -f backend/docker/docker-compose.e2e.yml
          exec -T api python -m scripts.seed_e2e_fixtures

      # No `--with-deps`. That flag shells out to apt, which the unprivileged
      # runner user cannot do; the system libraries were installed once, by
      # hand, when the runner was provisioned. The browser download itself is
      # cached in ~/.cache/ms-playwright and persists between runs here, so
      # this is a no-op after the first night.
      - name: Install Playwright and its browser
        working-directory: tests
        run: |
          npm ci
          npx playwright install chromium

      # `E2E_BASE_URL` comes from the job env now; repeating it here with the
      # production port is exactly the sort of drift the guard step exists for.
      # `--workers=1` is already the config's default (see playwright.config.js
      # for why serial is both cheaper and more correct), so nothing is passed.
      - name: End-to-end tier
        working-directory: tests
        run: npm run test:e2e

      - name: Upload traces and video on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            tests/.report
            tests/.artifacts
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: >-
          docker compose --project-directory backend
          -f backend/docker/docker-compose.yml -f backend/docker/docker-compose.e2e.yml
          logs --tail=200

      # ALWAYS, and this step did not need to exist on a hosted runner because
      # the whole machine was thrown away afterwards. Here the box keeps
      # running: a stack left up would hold ~1 GB and two published ports until
      # somebody noticed, and the next night's run would find its own volumes
      # already populated. `-v` because the throwaway database is the point.
      - name: Tear the stack down
        if: always()
        run: >-
          docker compose --project-directory backend
          -f backend/docker/docker-compose.yml -f backend/docker/docker-compose.e2e.yml
          down -v --remove-orphans

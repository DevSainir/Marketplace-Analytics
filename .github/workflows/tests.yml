# CI staged by the testing pyramid.
#
# Jobs are ordered by cost and gated on each other, so a broken unit test stops
# the pipeline in ~30 seconds instead of after a ten-minute browser run. That
# ordering IS the pyramid: cheap feedback first, expensive confirmation last.
#
# The end-to-end tier is deliberately not on every push — it needs the full
# stack and a browser, and running it per-commit would make the pipeline the
# slowest part of the working day.
#
# The k6 load profiles under tests/performance/*.js are not here at all, by
# their own contract: they exist to overload what they point at, so they run
# in `load.yml`, nightly, against a stack of their own. Only the pytest half of
# that directory — tests/performance/resilience — is in this file.
#
# Every job runs on a GitHub-hosted `ubuntu-latest` runner: a fresh VM per
# job, with Postgres and Redis as service containers. Nothing survives a run,
# so nothing has to be cleaned up after one, and the dependency caches go
# through GitHub's cache service (setup-uv, setup-node).

name: tests

# NOT on `pull_request`, and dropping it is the fix for a red ✗ on every
# release. The trigger looked free and was not.
#
# Development here is trunk-based (see the `git-workflow` skill): work goes
# straight to `main` and no PR is opened for it. The only pull request this
# repository ever sees is the one Release Please opens — and a PR opened by
# GITHUB_TOKEN has its workflow runs HELD at `action_required` until a human
# clicks «Approve and run». Nobody ever does: `release` merges that PR,
# deliberately, without waiting for it.
#
# An unapproved run does not stay politely pending. GitHub EXPIRES it the
# moment it is superseded — release-please pushes twice, the version bump and
# then the uv.lock sync — or the PR closes, and an expired run's conclusion is
# `failure`: twelve seconds, zero jobs, and the banner "This run likely failed
# because of a workflow file issue", which points at this file and is a lie.
# The annotation underneath is the true one: "This workflow run required
# approval but was not approved before it expired."
#
# So every release cut two red checks beside a release that was fine, and a red
# build that everyone is told to ignore is a red build nobody reads.
#
# Nothing is lost. The release PR's contents land on `main` in the merge commit
# and are tested there in full. To test a branch by hand, dispatch this
# workflow against it — which also offers `run_slow_tiers`, more than a PR run
# ever gave.
#
# The head branch cannot be filtered out instead: `pull_request.branches`
# matches the BASE branch, and the approval is held at run level, so no job-
# level `if:` is ever reached to decline the work.
on:
  push:
    branches: [main]
  # The browser tier, nightly, plus the informational audits and the coverage
  # floor (see the steps that read `github.event_name == 'schedule'`).
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      run_slow_tiers:
        description: 'Also run the end-to-end tier'
        type: boolean
        default: false

# The event is part of the KEY, and leaving it out cancelled a run on every
# single push to main. `release` merges its PR with GITHUB_TOKEN, which triggers
# no workflow, so it dispatches this one by hand — and a dispatched run on main
# landed in the same group as the push run already going and killed it. Every
# push therefore ended in a red "cancelled" that meant nothing was wrong.
#
# Splitting by event keeps what the cancellation is FOR — a second push
# superseding the first, a re-dispatch superseding an earlier dispatch — and
# drops only the cross-event collision, which was never anything but collateral.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# CI only reads the repository; nothing here pushes, comments, or releases.
permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  # Pinned so the resolver itself is reproducible, not just what it resolves.
  UV_VERSION: '0.11.32'

jobs:
  # ------------------------------------------------------------------ #
  # Gates 0-2 — style, types, the fast tiers and integration, in ONE job.
  #
  # One job rather than three because the three would each pay for the same
  # checkout, `uv sync` and `npm ci`, and a gap between them. The "cheap
  # feedback first" property comes from step ORDER instead: ruff answers in
  # seconds, then mypy, then the fast tiers, and integration — which needs
  # Postgres and Redis — last.
  #
  # The cost of merging is granularity: one red X covers lint, types and every
  # tier below e2e, so the step name is what tells you which gate failed.
  # ------------------------------------------------------------------ #
  verify:
    name: lint + types + fast + integration + resilience
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Started with the job and idle through the lint and fast steps; the
    # integration and resilience tiers at the end are what need them.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U marketplace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      # `--locked` fails rather than silently re-resolving, so CI can never
      # install a dependency set the committed uv.lock does not describe.
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      # Every importable path, not just src/tests: main.py is the ASGI
      # entrypoint, alembic/ holds hand-edited migrations, and scripts/ writes
      # to databases. Leaving them unchecked was a silent gap — formatting had
      # already drifted in alembic/versions/.
      - name: Ruff (backend)
        working-directory: backend
        run: |
          uv run ruff check src tests main.py alembic scripts
          uv run ruff format --check src tests main.py alembic scripts

      # Run from the REPO ROOT, not from backend/. ruff resolves the
      # per-file-ignores patterns (`tests/**`) relative to the config file's
      # directory, so linting `../tests/performance` from inside backend/ makes
      # them stop matching and the tier fails on ignores it is meant to have.
      - name: Ruff (cross-stack performance tier)
        run: |
          uv run --project backend ruff check --config backend/pyproject.toml tests/performance
          uv run --project backend ruff format --check --config backend/pyproject.toml tests/performance

      - name: mypy (strict)
        working-directory: backend
        run: uv run mypy src main.py scripts

      # Audits the RUNTIME set only — what actually ships. `--disable-pip`
      # because the export is fully pinned, so pip-audit has nothing to resolve.
      #
      # On EVERY push, unlike its informational twin below: this one gates, and
      # the seconds it costs are the price of not shipping a known CVE.
      # Cadence is a security control, so it is not traded for pipeline time.
      - name: pip-audit (runtime dependencies)
        working-directory: backend
        timeout-minutes: 5
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/runtime.txt
          uv run pip-audit --requirement /tmp/runtime.txt --strict --disable-pip

      # The dev set too, but informational — these packages never reach a
      # server, yet they DO execute on a runner holding a checkout and a token,
      # so "nobody looks at them" is the wrong answer; blocking every push on an
      # advisory in a tool's own transitive (today: `pip`, pulled in by
      # pip-audit itself) is the other wrong answer. Nightly: nothing is gated
      # on it, so once a day says everything four runs a day would.
      - name: pip-audit (dev dependencies, informational)
        if: github.event_name == 'schedule' || inputs.run_slow_tiers
        working-directory: backend
        continue-on-error: true
        timeout-minutes: 2
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -o /tmp/all.txt
          uv run pip-audit --requirement /tmp/all.txt --strict --disable-pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: ESLint
        working-directory: frontend
        run: npm run lint

      - name: Prettier
        working-directory: frontend
        run: npm run format:check

      # Gate on what actually SHIPS. The dev tree carries advisories with no
      # fixed version available, and blocking every push on an unfixable
      # finding just teaches people to ignore the gate. The production tree is
      # audited strictly.
      #
      # The `--fetch-*` flags and the timeout are not tidiness; they are the fix
      # for a release this repository actually lost on 2026-09-04.
      #
      # `--omit=dev` puts npm on the LEGACY quick-audit endpoint
      # (`/-/npm/v1/security/audits/quick`), which npm's own output says is
      # being retired and which was intermittently answering 503 that day. npm
      # defaults `fetch-timeout` to FIVE MINUTES and retries twice, so one
      # degraded endpoint costs up to fifteen minutes — the whole job budget.
      # Measured on the same tree that afternoon: the stock command took 7m01s
      # to fail, the same audit with the flags below answered correctly in 2.6s.
      #
      # When the budget ran out GitHub CANCELLED the job, and a cancelled run is
      # not a green one — so an advisory lookup nobody was gated on quietly held
      # a release. `continue-on-error` never covered that: it swallows a
      # non-zero exit and says nothing about a process that does not return.
      #
      # The gating audit also refuses to turn npm's uptime into our release
      # gate: a report showing vulnerabilities fails the build, an endpoint that
      # will not answer is a warning. Fail closed on findings, not on weather.
      - name: npm audit (production dependencies)
        working-directory: frontend
        timeout-minutes: 5
        run: |
          set -uo pipefail
          report=$(npm audit --omit=dev --audit-level=high --json \
            --fetch-timeout=15000 --fetch-retries=2 2>/tmp/npm-audit.err) && rc=0 || rc=$?
          if ! printf '%s' "$report" | jq -e 'has("auditReportVersion")' >/dev/null 2>&1; then
            echo "::warning title=Production npm audit did not run::The advisory endpoint did not answer, so the production tree was not audited. This is npm's availability, not a finding."
            sed -n '1,20p' /tmp/npm-audit.err || true
            exit 0
          fi
          printf '%s' "$report" | jq '.metadata.vulnerabilities'
          exit "$rc"

      # Nightly, for the same reason as the dev pip-audit: informational.
      - name: npm audit (dev dependencies, informational)
        if: github.event_name == 'schedule' || inputs.run_slow_tiers
        working-directory: frontend
        continue-on-error: true
        timeout-minutes: 2
        run: npm audit --audit-level=high --fetch-timeout=15000 --fetch-retries=2

      # Coverage is measured on the NIGHTLY run, not on every push.
      # Instrumentation is most of what this tier costs, and the number moves a
      # few times a month.
      #
      # The floor is still a ratchet — 68% today, raise it as the suite grows,
      # never lower it to make a red build green. It is simply enforced by the
      # nightly run, so a coverage regression is caught the next morning rather
      # than at push. Which tiers carry the pyramid's weight is unaffected: the
      # same tests run either way.
      - name: Backend unit + component tiers
        working-directory: backend
        env:
          COVERAGE: >-
            ${{ (github.event_name == 'schedule' || inputs.run_slow_tiers)
            && '--cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=68'
            || '' }}
        run: uv run pytest tests/unit tests/component -m "unit or component" ${COVERAGE}

      - name: Upload the coverage report
        if: always() && (github.event_name == 'schedule' || inputs.run_slow_tiers)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

      - name: Frontend unit + integration specs
        working-directory: frontend
        run: npm run test

      # The SPA build is part of the product, so a build break is a red
      # pipeline. Seconds to run, and it is the only gate that compiles every
      # template and resolves every import for real.
      - name: Build the SPA
        working-directory: frontend
        run: npm run build

      # ---------------------------------------------------------------- #
      # The integration tier.
      #
      # Its environment is declared per STEP rather than on the job, and that
      # is deliberate: hoisting ENVIRONMENT, the POSTGRES_*/REDIS_* pair and a
      # JWT signing key to job level would hand them to the unit and component
      # tiers too, which have never run with them. Those tiers are supposed to
      # be unable to reach a database; giving them the credentials for one is
      # how a unit test quietly starts depending on Postgres and nobody notices
      # for a month.
      # ---------------------------------------------------------------- #
      - name: Generate an ephemeral encryption key
        run: |
          printf 'FERNET_SECRET_KEY=%s\n' "$(openssl rand 32 | base64 | tr '+/' '-_')" >> "$GITHUB_ENV"

      - name: Integration tier
        working-directory: backend
        env:
          ENVIRONMENT: local
          DEBUG: 'false'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci-password
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ''
          JWT_SECRET_KEY: ci-only-signing-key-not-used-anywhere-else
        run: uv run pytest tests/integration -m integration

      # ---------------------------------------------------------------- #
      # The resilience tier — the pytest half of tests/performance.
      #
      # Here rather than in a job of its own, and AFTER the integration tier,
      # because that is what its own conftest asks for: it runs against
      # `marketplace_test`, the throwaway database the integration tier
      # creates, and skips with "run the integration tier once to create it"
      # when that database is missing.
      #
      # It once ran in a job of its own behind `run_slow_tiers`, a flag the
      # nightly schedule does not set — so across 200 runs it never executed
      # once. A tier that guards pool exhaustion, reclaimed transactions and
      # write races is worth more than that, and at five seconds it is cheaper
      # than deciding when to run it.
      #
      # Repository root, not `backend/`: this tier is cross-stack and takes its
      # config from tests/pytest.ini.
      # ---------------------------------------------------------------- #
      - name: Resilience tier (pool exhaustion, reclaimed transactions, write races)
        env:
          ENVIRONMENT: local
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: marketplace
          POSTGRES_USER: marketplace
          POSTGRES_PASSWORD: ci-password
          JWT_SECRET_KEY: ci-only-signing-key-not-used-anywhere-else
        run: uv run --project backend pytest -c tests/pytest.ini tests/performance

  # ------------------------------------------------------------------ #
  # Gate 3 — end-to-end. Full stack + a real browser. Nightly or on demand.
  # ------------------------------------------------------------------ #
  end-to-end:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    # Not on every push: it fires AFTER the code is already on main, so per
    # push it would buy reassurance rather than a gate. Nightly gives the same
    # signal once a day.
    if: github.event_name == 'schedule' || inputs.run_slow_tiers

    # The stack runs as its OWN Compose project. On this runner nothing else
    # is running, but the same commands are the ones a developer runs on a
    # machine that may hold a development stack — and the base compose file
    # declares `name: marketplace-analytic`, so a bare `docker compose -f …`
    # would recreate that stack's containers against a throwaway database.
    #
    #   COMPOSE_PROJECT_NAME  a separate project — separate containers,
    #                         networks and volumes
    #   FRONTEND_HTTP_PORT    8080/8443, off the ports a real stack serves on
    #   (and docker-compose.e2e.yml retags every built image `:e2e`, because
    #    image tags are global to the daemon)
    #
    # The guard step below fails the job if the first of these is ever lost.
    # Seeding runs through `docker compose exec` in the same project, so no
    # step addresses a container by name — `test_ci_never_targets_production`
    # fails one that does.
    env:
      COMPOSE_PROJECT_NAME: marketplace-analytic-e2e
      FRONTEND_HTTP_PORT: '8080'
      FRONTEND_HTTPS_PORT: '8443'
      E2E_BASE_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: tests/package-lock.json

      # The template runs a local stack as it is (its Fernet key is refused
      # anywhere but ENVIRONMENT=local, which is what the stack runs as here).
      - name: Prepare the backend environment
        working-directory: backend
        run: cp .env.example .env

      # Ask Compose what it actually resolved, and refuse to continue if it
      # names the base project or binds the ports a real stack serves on.
      # Placed after the step above because `config` interpolates backend/.env
      # and cannot resolve anything until it exists.
      - name: Refuse to run as the base project
        run: |
          set -euo pipefail
          cfg=$(docker compose --project-directory backend \
            -f backend/docker/docker-compose.yml -f backend/docker/docker-compose.e2e.yml \
            config --format json)
          resolved=$(printf '%s' "$cfg" | jq -r '.name')
          echo "Compose resolved the project to: ${resolved}"
          printf '%s' "$cfg" | jq -r '.services.edge.ports[] | "  edge publishes \(.published) -> \(.target)"'
          if [ "$resolved" != "marketplace-analytic-e2e" ]; then
            echo "::error::Refusing to start: this would target '${resolved}', not marketplace-analytic-e2e." >&2
            exit 1
          fi
          if printf '%s' "$cfg" | jq -e '[.services[] | (.ports // [])[] | select((.published|tostring) == "80" or (.published|tostring) == "443")] | length > 0' >/dev/null; then
            echo "::error::Refusing to start: the e2e stack would bind port 80 or 443." >&2
            exit 1
          fi
          echo "Isolation checks passed."

      # The e2e overlay builds the frontend's self-contained `e2e` target,
      # which carries a plain-HTTP config and its own copy of the bundle. The
      # production config hard-requires a Let's Encrypt key pair no runner
      # has, and without it nginx cannot load its config at all.
      - name: Start the stack
        run: >-
          docker compose --project-directory backend
          -f backend/docker/docker-compose.yml -f backend/docker/docker-compose.e2e.yml
          up -d --build

      # Assert a real 200. `curl -sf` treats a redirect as success and does not
      # follow it — so it once passed against a stack that served only
      # "301 https://localhost/".
      - name: Wait for the stack to serve the SPA
        run: |
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "${E2E_BASE_URL}/" || true)
            if [ "$code" = "200" ]; then
              echo "Stack is serving (HTTP $code)."
              exit 0
            fi
            echo "waiting… (HTTP ${code:-none})"
            sleep 5
          done
          echo "The stack did not become healthy in time." >&2
          docker compose --project-directory backend \
            -f backend/docker/docker-compose.yml -f backend/docker/docker-compose.e2e.yml \
            logs --tail=100
          exit 1

      # The browser tier needs three things no migration supplies: an account,
      # a second workspace to switch to, and a shop in the first one — the same
      # fabricated shop `make demo` shows, written offline with no WB token.
      - name: Seed the end-to-end account, workspaces and shop
        run: >-
          docker compose --project-directory backend
          -f backend/docker/docker-compose.yml -f backend/docker/docker-compose.e2e.yml
          exec -T api python -m scripts.seed_e2e_fixtures

      - name: Install Playwright and its browser
        working-directory: tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # `E2E_BASE_URL` comes from the job env; `--workers=1` is already the
      # config's default (see playwright.config.js for why serial is both
      # cheaper and more correct), so nothing is passed.
      - name: End-to-end tier
        working-directory: tests
        run: npm run test:e2e

      - name: Upload traces and video on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: |
            tests/.report
            tests/.artifacts
          retention-days: 7

      - name: Stack logs on failure
        if: failure()
        run: >-
          docker compose --project-directory backend
          -f backend/docker/docker-compose.yml -f backend/docker/docker-compose.e2e.yml
          logs --tail=200

# Semantic versioning, changelog, and the release announcement.
#
# The version of this project is derived, never typed. Release Please reads the
# Conventional Commits on main (already enforced at commit time by the
# commitizen hook in .pre-commit-config.yaml) and keeps an open "release PR"
# that shows exactly what the next version would be and why. Merging that PR is
# the release: it writes CHANGELOG.md, bumps version.txt, backend/pyproject.toml
# and frontend/package.json in lockstep, tags `vX.Y.Z`, and publishes a GitHub
# Release. Nothing here decides a version number on its own.
#
# Pre-1.0 the config sets `bump-minor-pre-major`, so a breaking change moves
# 0.1.0 -> 0.2.0 instead of jumping the project to 1.0.0 before it is ready.
#
# Release notes are the commit subjects, in English. Announcing a release to
# the people who use the product is not part of this repository.
#
# The release PR is merged here rather than by hand (see «Merging it» below);
# label it `hold-release` to keep one open.
#
# Note on CI for the release PR: it is opened by GITHUB_TOKEN, and GitHub holds
# workflow runs for Actions-opened PRs at `action_required` until a human
# approves them. That hold is why the merge is not gated on the PR's own
# checks: they never start, so waiting for them would wait forever.
#
# The half of that which was written down wrong, corrected 2026-09-07: the held
# run does NOT sit there pending. GitHub expires it as soon as it is superseded
# or the PR closes — both of which this workflow causes, within seconds — and an
# expired run's conclusion is `failure`. Every release therefore cut two red ✗,
# blamed on "a workflow file issue", for an approval nobody was ever going to
# give. `tests` no longer runs on `pull_request` at all; its header says why.
# Nothing is lost — the PR only touches CHANGELOG.md and the version files, and
# the merge commit lands on main and runs the full pipeline.

name: release

# Release Please itself runs on every push, and that half is unchanged: the open
# release PR is how anyone sees what the next version would be and why, so it
# has to stay current.
#
# CUTTING the release is what moved onto a schedule. Merging that PR on every
# push made the version number a push counter — 40 releases in the three days to
# 2026-09-12, twelve of them in six hours on the 11th, several for a `chore:`
# that changed no behaviour at all. A changelog of one-commit releases says
# nothing that `git log` does not, and every one of them tagged, announced and
# notified as though it were news.
#
# Sunday 17:00 UTC is 20:00 MSK: a week's work cut as one version, in the
# evening of the quietest day, with Monday morning free to look at it. Nothing
# else waits for it — main keeps moving on every push, and only the VERSION
# batches.
#
# `workflow_dispatch` cuts one immediately when a week is too long to wait.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 17 * * 0'
  workflow_dispatch:

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # `actions: write` is what lets the merge step start the two workflows that a
  # human merge would have started by itself — see «Merging it» below.
  actions: write

jobs:
  release:
    name: version + changelog
    # On the self-hosted runner: this workflow is what cuts a version, and a
    # version that cannot be cut is a change that cannot ship. Its steps need
    # only `python3` and `gh`, both of which the runner already has.
    runs-on: [self-hosted, prod-vps]
    timeout-minutes: 15
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # ---------------------------------------------------------------- #
      # `uv.lock` records the project's OWN version, not just its
      # dependencies. So the moment Release Please bumps
      # backend/pyproject.toml, the committed lock is one line stale and
      # `uv sync --locked` fails — taking the `lint + types + fast tiers` job
      # down with it.
      #
      # v0.1.1 is the worked example: it was tagged and released, its tests
      # went red on that single line, and the release never shipped.
      #
      # The honest fix is to update the lock rather than to stop checking it:
      # `--locked` is what stops CI installing a dependency set the lock does
      # not describe, and that guarantee is worth keeping.
      # ---------------------------------------------------------------- #
      - name: Check out the release branch
        if: steps.release.outputs.pr
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}

      - name: Install uv
        if: steps.release.outputs.pr
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          # Keep in step with UV_VERSION in tests.yml — a different resolver
          # here could write a lock that the test workflow then rejects.
          version: '0.11.32'
          python-version: '3.12'

      - name: Keep uv.lock in step with the bumped version
        if: steps.release.outputs.pr
        run: |
          set -euo pipefail
          (cd backend && uv lock)

          if git diff --quiet -- backend/uv.lock; then
            echo "uv.lock already matches the release version."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/uv.lock
          # `chore(release):` on purpose — the announcement filters the release
          # bot's own commits, and this is one of them.
          git commit -m 'chore(release): sync uv.lock with the bumped version'
          # A GITHUB_TOKEN push does not trigger workflows, so this cannot loop.
          git push

      # ---------------------------------------------------------------- #
      # Merging it. The release PR used to be merged by hand; it is merged
      # here instead, because "click the button" was the only thing standing
      # between a green main and a released one.
      #
      # THE CATCH, and why this step is longer than one `gh pr merge`: a merge
      # performed with GITHUB_TOKEN pushes to main WITHOUT triggering any
      # workflow — the same rule the uv.lock push above relies on to avoid
      # looping. A human merge triggers two things, and both would go missing:
      #
      #   * `tests`, whose green run is what `deploy` waits for. Without it the
      #     version bump would sit on main, released but never shipped — the
      #     exact failure v0.1.1 had, arrived at from the other direction.
      #   * `release` itself, which is what notices the merged PR and creates
      #     the tag and the GitHub Release. Without
      #     it the PR would merge and no release would ever be cut.
      #
      # `workflow_dispatch` is the documented exception to that rule, so both
      # are started explicitly. A dispatched `tests` on main runs the same
      # tiers a push does (`end-to-end` keys off the branch, `performance` is
      # opt-in either way), so the deploy gate keeps its full strength.
      #
      # The suppression bites one level deeper than it first appears, and cost
      # v0.5.2 its deploy: the `workflow_run` event that `tests` normally emits
      # to start `deploy` is ALSO suppressed when the run was dispatched by
      # GITHUB_TOKEN. `tests` therefore hands off to `deploy` itself for
      # dispatched runs on main — see `deploy-after-dispatch` in tests.yml.
      #
      # To HOLD a release, label the PR `hold-release`: the merge is skipped
      # and the PR stays open, which is what leaving it open used to mean.
      # ---------------------------------------------------------------- #
      # The `if:` is the weekly gate, and it is the ONLY condition here. On a
      # push this step is skipped and the release PR simply stays open, which is
      # what accumulates a week of commits into one version.
      #
      # Still no `fromJSON` in this step, and that part remains deliberate: a
      # step's `env:` is templated even when its `if` is false, so reading
      # `fromJSON(steps.release.outputs.pr)` from `env` blew the whole job up on
      # the run where no PR existed — "Error reading JToken from JsonReader" —
      # while the identical expression under `with:` above is fine. An `if:`
      # that touches nothing but `github.event_name` is safe; one that parsed
      # that output would not be. Finding the PR by branch prefix instead keeps
      # the step safe to run whenever it does run, and lets a dispatch merge a
      # PR an earlier run left behind.
      #
      # The re-dispatch at the end of this step starts `release` again, which
      # arrives here as `workflow_dispatch` and so passes this gate — by then
      # the PR it would merge is already merged, the lookup finds nothing, and
      # it exits 0. That is the intended no-op, not a loop.
      - name: Merge the release PR
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This step runs with no checkout (the ones above are conditional),
          # so `gh` has no git remote to infer the repository from and every
          # call fails with "not a git repository". `GH_REPO` supplies it.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          PR_NUMBER=$(gh pr list --state open --json number,headRefName --jq '
            [.[] | select(.headRefName | startswith("release-please--branches--main"))]
            | .[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "No open release PR; nothing to merge."
            exit 0
          fi

          if gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' \
              | grep -qx 'hold-release'; then
            echo "PR #${PR_NUMBER} is labelled hold-release — leaving it open."
            exit 0
          fi

          # Wait for GitHub to finish recomputing mergeability before asking it
          # to merge. The step above pushes uv.lock to the release branch, and a
          # merge issued while that recomputation is still in flight is refused
          # with "Base branch was modified" — which is a race, not a conflict.
          # Observed 2026-08-17 (v0.7.6): one failure in twelve runs, and the
          # release sat unmerged while the deploy of the same commit succeeded.
          #
          # A merge commit, not a squash: the announcement builds its list with
          # `git log --no-merges`, which is what keeps "Merge pull request #12…"
          # out of a note meant for humans.
          merged=""
          for attempt in 1 2 3 4 5; do
            state=$(gh pr view "$PR_NUMBER" --json state --jq '.state')
            if [ "$state" = "MERGED" ]; then
              # A concurrent run got there first; that is success, not failure.
              echo "Release PR #${PR_NUMBER} is already merged."
              merged="already"
              break
            fi
            if gh pr merge "$PR_NUMBER" --merge; then
              echo "Merged release PR #${PR_NUMBER} on attempt ${attempt}."
              merged="yes"
              break
            fi
            echo "Merge attempt ${attempt} was refused; re-checking in $((attempt * 10))s."
            sleep $((attempt * 10))
          done

          if [ -z "$merged" ]; then
            # Deliberately a failure: the deploy of this commit has already
            # happened, so a silent skip would leave main's version fields behind
            # with nothing pointing at why. The next push re-runs this workflow
            # and merges the PR then.
            echo "::error::Could not merge release PR #${PR_NUMBER} after 5 attempts."
            exit 1
          fi

          # Both of these would have happened on their own had a person clicked
          # the button. Started in this order so the pipeline that gates the
          # deploy is already moving before release-please cuts the tag.
          gh workflow run tests.yml --ref main
          gh workflow run release.yml --ref main
          echo "Dispatched tests + release for the merged commit."
